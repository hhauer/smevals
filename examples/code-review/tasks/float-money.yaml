name: float-money
before: |
  // invoice.ts
  // Computes invoice totals from cart line items. All money amounts are
  // integer cents throughout, to avoid floating point drift; the only
  // place a dollar amount appears is in the formatted display string.

  export interface LineItem {
    sku: string;
    unitPriceCents: number;
    quantity: number;
  }

  export interface DiscountPolicy {
    kind: "percent" | "flat";
    // percent: 0-100; flat: a cents amount to subtract
    value: number;
  }

  export interface InvoiceTotals {
    subtotalCents: number;
    discountCents: number;
    taxCents: number;
    totalCents: number;
  }

  const TAX_RATE = 0.0825; // 8.25%, applied to the post-discount subtotal

  function lineItemTotalCents(item: LineItem): number {
    return item.unitPriceCents * item.quantity;
  }

  function computeDiscountCents(
    subtotalCents: number,
    policy: DiscountPolicy | null
  ): number {
    if (!policy) {
      return 0;
    }
    if (policy.kind === "flat") {
      return Math.min(policy.value, subtotalCents);
    }
    const raw = Math.round((subtotalCents * policy.value) / 100);
    return Math.min(raw, subtotalCents);
  }

  export function computeInvoiceTotals(
    items: LineItem[],
    discount: DiscountPolicy | null
  ): InvoiceTotals {
    const subtotalCents = items.reduce(
      (sum, item) => sum + lineItemTotalCents(item),
      0
    );
    const discountCents = computeDiscountCents(subtotalCents, discount);
    const taxableCents = subtotalCents - discountCents;
    const taxCents = Math.round(taxableCents * TAX_RATE);
    const totalCents = taxableCents + taxCents;

    return { subtotalCents, discountCents, taxCents, totalCents };
  }

  // Formats a cents amount as a display string, e.g. 1050 -> "$10.50".
  export function formatCents(cents: number): string {
    const sign = cents < 0 ? "-" : "";
    const abs = Math.abs(cents);
    const dollars = Math.floor(abs / 100);
    const remainder = abs % 100;
    return `${sign}$${dollars}.${remainder.toString().padStart(2, "0")}`;
  }
