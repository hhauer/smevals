name: boundary-shift
before: |
  // pagination.ts
  // Client for consuming a paginated REST endpoint that returns pages of
  // `Item` records along with cursor metadata.

  export interface Item {
    id: string;
    value: number;
  }

  export interface PageResponse {
    items: Item[];
    page: number;
    totalPages: number;
  }

  export type PageFetcher = (page: number) => Promise<PageResponse>;

  export interface FetchAllOptions {
    startPage?: number;
    maxPages?: number;
  }

  // Walks pages [startPage, totalPages) and returns every item collected.
  export async function fetchAllItems(
    fetchPage: PageFetcher,
    options: FetchAllOptions = {}
  ): Promise<Item[]> {
    const startPage = options.startPage ?? 0;
    const items: Item[] = [];
    let page = startPage;
    let totalPages = Infinity;
    let pagesFetched = 0;

    while (page < totalPages) {
      if (options.maxPages !== undefined && pagesFetched >= options.maxPages) {
        break;
      }
      const response = await fetchPage(page);
      items.push(...response.items);
      totalPages = response.totalPages;
      pagesFetched += 1;
      page += 1;
    }

    return items;
  }

  // Fetches a single page and reports whether more pages remain, for
  // callers that want to stream results incrementally.
  export async function fetchNextPage(
    fetchPage: PageFetcher,
    currentPage: number
  ): Promise<{ items: Item[]; hasMore: boolean }> {
    const response = await fetchPage(currentPage);
    return {
      items: response.items,
      hasMore: currentPage + 1 < response.totalPages,
    };
  }

  // Counts items across all pages without buffering them, for lightweight
  // existence checks.
  export async function countAllItems(
    fetchPage: PageFetcher
  ): Promise<number> {
    let page = 0;
    let totalPages = Infinity;
    let count = 0;

    while (page < totalPages) {
      const response = await fetchPage(page);
      count += response.items.length;
      totalPages = response.totalPages;
      page += 1;
    }

    return count;
  }
