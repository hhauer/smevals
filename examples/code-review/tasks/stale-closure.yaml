name: stale-closure
before: |
  // retryQueue.ts - processes a batch of jobs; failures are retried once
  // after a fixed backoff so a handful of flaky jobs don't block the batch.

  export interface Job {
    id: string;
    run: () => Promise<void>;
  }

  export type Scheduler = (delayMs: number, callback: () => void) => void;

  export interface RetryOptions {
    maxAttempts: number;
    baseDelayMs: number;
    schedule: Scheduler;
  }

  export interface JobResult {
    id: string;
    attempts: number;
    succeeded: boolean;
  }

  function attemptJob(job: Job): Promise<boolean> {
    return job.run().then(
      () => true,
      () => false
    );
  }

  // Runs every job once, then retries failures concurrently up to
  // maxAttempts total, each after its own backoff delay.
  export async function runWithRetries(
    jobs: Job[],
    options: RetryOptions
  ): Promise<JobResult[]> {
    const results = new Map<string, JobResult>();
    let toRetry: Job[] = [];

    for (const job of jobs) {
      const succeeded = await attemptJob(job);
      results.set(job.id, { id: job.id, attempts: 1, succeeded });
      if (!succeeded) {
        toRetry.push(job);
      }
    }

    let attempt = 1;
    while (toRetry.length > 0 && attempt < options.maxAttempts) {
      attempt += 1;
      const delay = options.baseDelayMs * 2 ** (attempt - 1);
      const stillFailing: Job[] = [];

      await Promise.all(
        toRetry.map(
          (job) =>
            new Promise<void>((resolve) => {
              options.schedule(delay, async () => {
                const succeeded = await attemptJob(job);
                results.set(job.id, { id: job.id, attempts: attempt, succeeded });
                if (!succeeded) {
                  stillFailing.push(job);
                }
                resolve();
              });
            })
        )
      );

      toRetry = stillFailing;
    }

    return jobs.map((job) => results.get(job.id)!);
  }

  // Summarizes results for logging/metrics.
  export function summarize(results: JobResult[]) {
    const succeeded = results.filter((r) => r.succeeded).length;
    const totalAttempts = results.reduce((sum, r) => sum + r.attempts, 0);
    return { succeeded, failed: results.length - succeeded, totalAttempts };
  }
