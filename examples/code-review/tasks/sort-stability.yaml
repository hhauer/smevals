name: sort-stability
before: |
  // leaderboard.ts
  // Ranks player entries for the season leaderboard: highest score wins;
  // ties are broken by fewest penalties (a player who reached the same
  // score more cleanly ranks above one who needed penalty replays).

  export interface Entry {
    playerId: string;
    displayName: string;
    score: number;
    penalties: number;
  }

  export interface RankedEntry extends Entry {
    rank: number;
  }

  // Comparator for Array.prototype.sort: higher score first; among equal
  // scores, fewer penalties first.
  function compareEntries(a: Entry, b: Entry): number {
    if (a.score !== b.score) {
      return b.score - a.score;
    }
    return a.penalties - b.penalties;
  }

  // Sorts entries into leaderboard order and assigns dense ranks. Tied
  // entries (equal score AND equal penalties) share a rank; the next
  // distinct entry resumes at its position in the list, not its position
  // plus one (standard competition ranking).
  export function rankEntries(entries: Entry[]): RankedEntry[] {
    const sorted = [...entries].sort(compareEntries);
    const ranked: RankedEntry[] = [];

    let rank = 0;
    let previous: Entry | null = null;
    sorted.forEach((entry, index) => {
      const tied =
        previous !== null &&
        previous.score === entry.score &&
        previous.penalties === entry.penalties;
      if (!tied) {
        rank = index + 1;
      }
      ranked.push({ ...entry, rank });
      previous = entry;
    });

    return ranked;
  }

  // Returns the top N entries, or fewer if the leaderboard is smaller.
  export function topN(entries: Entry[], n: number): RankedEntry[] {
    return rankEntries(entries).slice(0, n);
  }

  // Formats a numeric rank as an ordinal string: 1 -> "1st", 2 -> "2nd",
  // 3 -> "3rd", 11-13 -> "th" (the English ordinal exceptions).
  export function formatRank(rank: number): string {
    const remainder10 = rank % 10;
    const remainder100 = rank % 100;
    if (remainder100 >= 11 && remainder100 <= 13) {
      return `${rank}th`;
    }
    switch (remainder10) {
      case 1:
        return `${rank}st`;
      case 2:
        return `${rank}nd`;
      case 3:
        return `${rank}rd`;
      default:
        return `${rank}th`;
    }
  }
