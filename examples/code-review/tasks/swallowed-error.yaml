name: swallowed-error
before: |
  // uploadPipeline.ts
  // Uploads a batch of files in two phases per file: upload the bytes,
  // then commit the upload so it becomes visible to readers. A file that
  // uploads but never commits must be reported as failed - readers should
  // never see a batch summary claim success for a file that isn't
  // actually committed.

  export interface FileUpload {
    name: string;
    bytes: Uint8Array;
  }

  export interface UploadResult {
    name: string;
    succeeded: boolean;
    error?: string;
  }

  export interface BatchSummary {
    results: UploadResult[];
    succeededCount: number;
    failedCount: number;
  }

  export type Uploader = (file: FileUpload) => Promise<string>; // returns an upload handle
  export type Committer = (handle: string) => Promise<void>;

  async function uploadAndCommit(
    file: FileUpload,
    upload: Uploader,
    commit: Committer
  ): Promise<UploadResult> {
    let handle: string;
    try {
      handle = await upload(file);
    } catch (err) {
      return { name: file.name, succeeded: false, error: String(err) };
    }

    try {
      await commit(handle);
    } catch (err) {
      return { name: file.name, succeeded: false, error: String(err) };
    }

    return { name: file.name, succeeded: true };
  }

  // Uploads every file, committing each in turn, and aggregates the
  // outcomes into a batch summary.
  export async function uploadBatch(
    files: FileUpload[],
    upload: Uploader,
    commit: Committer
  ): Promise<BatchSummary> {
    const results: UploadResult[] = [];
    for (const file of files) {
      results.push(await uploadAndCommit(file, upload, commit));
    }

    const succeededCount = results.filter((r) => r.succeeded).length;
    const failedCount = results.length - succeededCount;
    return { results, succeededCount, failedCount };
  }
