    if (!parsed.ok) return { ok: false, error: parsed.error, line: parsed.line };
    const task = (parsed.doc && typeof parsed.doc === "object"
                  && !Array.isArray(parsed.doc)) ? parsed.doc : {};
    const floats = parsed.floats || {};
    const disp = (v, key) =>
      (typeof v === "number" && floats[key] ? v.toFixed(1) : pyStr(v));
    const name = isScalar(task.name) ? disp(task.name, "name") : "";
    return {
      ok: true,
      vars: [
        { name: "SMEVALS_MODEL", value: opts.model || "", missing: !opts.model },
        {
          name: "SMEVALS_RUN_DIR",
          value: `runs/${name || "<task>"}/${opts.config || "<config>"}/`
            + `${opts.model ? slugifyModel(opts.model) : "<model>"}/<timestamp>`,
          synthetic: true,
        },
      ],
    };
  }

  // Normalize rel against fromDir without escaping the eval root
  function resolveRel(fromDir, rel) {
    if (typeof rel !== "string" || !rel || rel.startsWith("/")) return null;
    const out = [];
    for (const part of (fromDir + "/" + rel).split("/")) {
      if (part === "" || part === ".") continue;
      if (part === "..") {
        if (!out.length) return null;
        out.pop();
      } else out.push(part);
    }
    return out.join("/");
  }

  // The grader's check pipeline with each checker's resolution status,
  // derived from the doc's current text plus the eval's file tree.
  function pipeline(text, files = []) {
    const parsed = yamlParse(text);
    if (!parsed.ok) return { ok: false, error: parsed.error, line: parsed.line };
    const grader = (parsed.doc && typeof parsed.doc === "object"
                    && !Array.isArray(parsed.doc)) ? parsed.doc : {};
    const byPath = new Map(files.map(f => [f.path, !!f.executable]));
    const checks = Array.isArray(grader.checks) ? grader.checks : [];
    const steps = checks.map((check, index) => {
      if (check === null || typeof check !== "object" || Array.isArray(check)) {
        return { index, checker: "", status: "invalid", config: {}, required: false };
      }
      const config = {};
      for (const [k, v] of Object.entries(check)) if (k !== "checker") config[k] = v;
      const step = {
        index,
        checker: typeof check.checker === "string" ? check.checker : "",
        config,
        required: check.required === true,
      };
      if (!step.checker) step.status = "missing";
      else if (BUILTIN_CHECKERS.includes(step.checker)) step.status = "builtin";
      else {
        const resolved = resolveRel("graders", step.checker);
        step.resolved = resolved;
        if (!resolved) step.status = "outside";
        else if (!byPath.has(resolved)) step.status = "not-found";
        else step.status = byPath.get(resolved) ? "ok" : "not-executable";
      }
      return step;
    });
    const scoring = grader.scoring;
    const threshold = scoring && typeof scoring === "object"
      && typeof scoring.pass_threshold === "number"
      ? scoring.pass_threshold : null;
    return {
      ok: true,
      name: isScalar(grader.name) ? String(grader.name) : "",
      hasChecks: Array.isArray(grader.checks),
      steps,
      threshold,
    };
  }

  function docKind(path) {
    if (path === "eval.yaml") return "eval";
    const m = String(path).match(/^(tasks|configs|graders)\/[^/]+\.yaml$/);
    return m ? { tasks: "task", configs: "config", graders: "grader" }[m[1]] : null;
  }

  return {
    BUILTIN_CHECKERS, parsePlain, yamlParse, yamlEmit, getAt, applyEdit,
    envMirror, pipeline, resolveRel, docKind,
    scalarEnvKey, scalarEnvVars, scalarEnvName,
  };
})();
if (typeof module !== "undefined") module.exports = pure;
// STUDIO_PURE_END

// --- workbench -----------------------------------------------------------

const KIND_GROUPS = [
  ["tasks", "Tasks"], ["configs", "Configs"], ["graders", "Graders"],
  ["checkers", "Checkers"], ["other", "Other files"],
];

const flatFiles = wb =>
  KIND_GROUPS.flatMap(([kind]) => wb.detail.files[kind] || []);

const dirty = buf => buf.text !== buf.savedText;
const wbDirty = wb => wb && [...wb.buffers.values()].some(dirty);
// Checks the active workbench AND every one parked in wbCache - an unsaved
// edit left behind on a shelf trip must still block a real tab close.
const anyDirty = () =>
  wbDirty(state.wb) || [...state.wbCache.values()].some(wbDirty);

const fileProblems = (wb, path) =>
  (wb.detail.validation || []).filter(p => p.file === path);

function fileHash(wb, path, raw) {
  return `#/eval/${enc(wb.slug)}${path ? `/f/${enc(path)}` : ""}${raw ? "/raw" : ""}`;
}

async function loadWorkbench(slug) {
  const wb = {
    slug, detail: null, schemas: null, buffers: new Map(),
    open: null, surface: null, mirrorConfig: null, configCache: {}, err: null,
    // bench state: the eval's runs, the run form, the active job, and the
    // dry-run comparison all live here so they survive file switches. runs
    // stays null (unfetched) until the first surface that needs rows calls
    // ensureRuns - see below; runsPromise is its single-flight lock.
    runs: null, runsErr: null, runsPromise: null, runsFilter: null,
    bench: { model: "" }, benchErr: null,
    job: null, drySel: null, dry: null, dryErr: null, dryPending: false,
    detailsState: {}, runText: {}, rawCache: {}, textPrefs: {},
    // results tab state (Task 2): the eval_results document for the
    // currently-picked grader, fetched lazily the same way
    results: null, resultsGrader: null, resultsErr: null,
    // compare surface state (Task 8): the picked task/grader/sort, the
    // per-model collapse toggle, and the pinned run ids (2-4 -> the
    // side-by-side panel) - all local, no server round-trip of its own
    compareTask: null, compareGrader: null, compareSort: "score",
    compareAll: false, pinned: new Set(), pinnedTask: null,
  };
  state.wb = wb;
  view.innerHTML = `<div class="crumb"><a href="#/">← shelf</a></div>`;
  try {
    const [evals, detail, schemas] = await Promise.all([
      loadEvals(),
      api(`/api/evals/${enc(slug)}`),
      state.schemas ? Promise.resolve(state.schemas) : api("/api/schemas"),
    ]);
    if (state.wb !== wb) return null;
    state.schemas = schemas;
    wb.detail = detail;
    wb.schemas = schemas;
    wb.info = evals.find(e => e.slug === slug) || { name: slug };
    const configs = (detail.files.configs || [])
      .map(f => f.path.replace(/^configs\//, "").replace(/\.yaml$/, ""));
    wb.mirrorConfig = configs.includes("default") ? "default" : configs[0] || null;
    loadConfigCache(wb);
    // Runs are NOT fetched here (the phase-1 debt this task pays off): a
    // workbench that only shows files never pays for the full runs listing.
    // ensureRuns(wb) is called lazily by whichever surface first needs rows.
    loadModels(wb);
    return wb;
  } catch (ex) {
    if (state.wb === wb) {
      view.innerHTML =
        `<div class="crumb"><a href="#/">← shelf</a></div>` + errorBox(ex.message);
    }
    return null;
  }
}

// Config docs feed the env mirror's SMEVALS_MODEL; unsaved config edits in
// open buffers win over the cached on-disk copies (see configText).
async function loadConfigCache(wb) {
  for (const entry of wb.detail.files.configs || []) {
    if (wb.configCache[entry.path] !== undefined) continue;
    try {
      const data = await api(
        `/api/evals/${enc(wb.slug)}/file?path=${enc(entry.path)}`);
      if (state.wb !== wb) return;
      wb.configCache[entry.path] = data.content;
    } catch { wb.configCache[entry.path] = ""; }
  }
  if (state.wb === wb) renderContext(wb);
}

function configText(wb, name) {
  const path = `configs/${name}.yaml`;
  const buf = wb.buffers.get(path);
  return buf ? buf.text : wb.configCache[path];
}

// Parks the active workbench (if any) in wbCache under its own slug, so a
// route change away from it doesn't discard unsaved buffers or a job.
function stashWorkbench() {
  if (state.wb) state.wbCache.set(state.wb.slug, state.wb);
}

// surface: { file, raw } for the editor, { runs: true, run, filter } for the
// bench, { results: true } for the Results tab
async function renderWorkbench(slug, surface) {
  document.body.classList.add("wb");
  let wb = state.wb && state.wb.slug === slug ? state.wb : null;
  let reattached = false;
  if (!wb) {
    stashWorkbench();
    wb = state.wbCache.get(slug) || null;
    if (wb) {
      state.wb = wb;
      reattached = true;
    }
  }
  if (!wb) {
    wb = await loadWorkbench(slug);
    if (!wb) return;
    renderShell(wb);
  } else if (reattached) {
    renderShell(wb);
    // The previous poll loop exited when this workbench stopped being
    // state.wb (it gates on state.wb === wb); a still-running job needs a
    // fresh pollJob to pick the progress panel back up.
    if (wb.job && (wb.job.status === "queued" || wb.job.status === "running")) {
      pollJob(wb, wb.job.id);
    }
  }
  wb.surface = surface;
  if (surface.runs) wb.runsFilter = surface.filter || null;
  if (surface.compare && surface.task) wb.compareTask = surface.task;
  const fpath = surface.file || null;
  wb.open = fpath;
  if (fpath && !wb.buffers.has(fpath)) {
    renderPanes(wb); // tree selection + "Loading…" editor state
    try {
      const data = await api(
        `/api/evals/${enc(slug)}/file?path=${enc(fpath)}`);
      if (state.wb !== wb || wb.open !== fpath) return;
      wb.buffers.set(fpath, {
        path: fpath,
        text: data.content,
        savedText: data.content,
        sha: data.sha256,
        executable: data.executable,
        conflict: null,
        err: null,
      });
    } catch (ex) {
      if (state.wb !== wb) return;
      wb.err = ex.message;
    }
  }
  const buf = fpath && wb.buffers.get(fpath);
  if (buf) {
    const kind = pure.docKind(fpath);
    buf.view = surface.raw || !kind || !pure.yamlParse(buf.text).ok
      ? "raw" : "form";
  }
  renderPanes(wb);
}

function renderShell(wb) {
  const problems = (wb.detail.validation || []).length;
  view.innerHTML = `
    <div class="wb-head">
      <div class="crumb"><a href="#/">← shelf</a></div>
      <h2>${esc(wb.info.name)}</h2>
      ${problems ? `<span class="badge-warn">${esc(plural(problems, "problem"))}</span>` : ""}
      <span class="wb-hint">⌘S saves · files live in your working tree</span>
    </div>
    <div class="wb-grid">
      <nav class="card pane pane-tree" id="wb-tree" aria-label="Files"></nav>
      <section class="card pane pane-editor" id="wb-editor"></section>
      <aside class="card pane pane-ctx" id="wb-ctx" aria-label="Context"></aside>
    </div>`;
}

function renderPanes(wb) {
  renderHeadBadge(wb);
  renderTree(wb);
  if (wb.surface && wb.surface.runs) renderRunsPane(wb);
  else if (wb.surface && wb.surface.results) renderResultsPane(wb);
  else if (wb.surface && wb.surface.compare) renderComparePane(wb);
  else renderEditor(wb);
  renderContext(wb);
}

// The light bench refresh: everything runs data feeds, but never the
// editor body - callers use it while the author may be mid-keystroke.
function renderBenchSurfaces(wb) {
  renderTree(wb);
  if (wb.surface && wb.surface.runs) renderRunsPane(wb);
  else if (wb.surface && wb.surface.results) renderResultsPane(wb);
  else if (wb.surface && wb.surface.compare) renderComparePane(wb);
  renderContext(wb);
}

function renderHeadBadge(wb) {
  const head = view.querySelector(".wb-head");
  if (!head) return;
  const problems = (wb.detail.validation || []).length;
  const badge = head.querySelector(".badge-warn");
  if (problems) {
    const html = `<span class="badge-warn">${esc(plural(problems, "problem"))}</span>`;
    if (badge) badge.outerHTML = html;
    else head.querySelector("h2").insertAdjacentHTML("afterend", html);
  } else if (badge) badge.remove();
}

// --- file tree -----------------------------------------------------------

function renderTree(wb) {
  const box = document.getElementById("wb-tree");
  if (!box) return;
  const problemFiles = new Set((wb.detail.validation || []).map(p => p.file));
  box.innerHTML = KIND_GROUPS.map(([kind, label]) => {
    const entries = wb.detail.files[kind] || [];
    if (!entries.length && kind === "checkers") return "";
    return `
      <div class="tree-group">
        <div class="tree-group-label">${esc(label)}</div>
        ${entries.length ? entries.map(f => {
          const buf = wb.buffers.get(f.path);
          const executable = buf ? buf.executable : f.executable;
          return `
            <button type="button" class="tree-item${wb.open === f.path ? " sel" : ""}"
                    data-path="${esc(f.path)}">
              <span class="fname">${esc(f.path)}</span>
              <span class="flags">
                ${executable ? `<span class="chip-x" title="executable">x</span>` : ""}
                ${buf && dirty(buf) ? `<span class="dot-dirty" title="unsaved changes"></span>` : ""}
                ${problemFiles.has(f.path) ? `<span class="dot-problem" title="has problems"></span>` : ""}
              </span>
            </button>`;
        }).join("") : `<div class="tree-empty">none yet</div>`}
      </div>`;
  }).join("") + `
    <div class="tree-group">
      <div class="tree-group-label">Bench</div>
      <button type="button" class="tree-item${wb.surface && wb.surface.runs ? " sel" : ""}"
              data-goto="runs">
        <span class="fname">runs/</span>
        <span class="flags"><span class="tree-count">${
          wb.info.runs?.total ?? 0}</span></span>
      </button>
      <button type="button" class="tree-item${wb.surface && wb.surface.results ? " sel" : ""}"
              data-goto="results">
        <span class="fname">results</span>
      </button>
    </div>`;
  box.querySelectorAll(".tree-item[data-path]").forEach(el =>
    el.addEventListener("click", () => {
      location.hash = fileHash(wb, el.dataset.path, false);
    }));
  box.querySelector("[data-goto=runs]").addEventListener("click", () => {
    location.hash = runsHash(wb);
  });
  box.querySelector("[data-goto=results]").addEventListener("click", () => {
    location.hash = resultsHash(wb);
  });
}

// --- editor --------------------------------------------------------------

function renderEditor(wb) {
  const box = document.getElementById("wb-editor");
  if (!box) return;
  if (wb.err) {
    box.innerHTML = `<div class="ed-err">${errorBox(wb.err)}</div>`;
    wb.err = null;
    return;
  }
  if (!wb.open) {
    box.innerHTML = `
      <div class="ed-empty">
        <h3>Pick a file to edit</h3>
        <p>Tasks are a prompt plus any scalar data you like. Configs point
           at a Runner — an executable that gets the task as environment
           variables and writes its answer to stdout. Graders are ordered
           pipelines of checks over what came back.</p>
        <p>Select a task and the panel on the right mirrors the exact
           environment its Runner subprocess will receive, following your
           edits as you type.</p>
      </div>`;
    return;
  }
  const buf = wb.buffers.get(wb.open);
  if (!buf) {
    box.innerHTML = `<div class="ed-empty"><p>Loading ${esc(wb.open)}…</p></div>`;
    return;
  }
  const kind = pure.docKind(buf.path);
  const parsed = kind ? pure.yamlParse(buf.text) : null;
  const formable = kind && parsed.ok;
  const isYaml = buf.path.endsWith(".yaml");
  box.innerHTML = `
    <div class="ed-head">
      <span class="ed-path">${esc(buf.path)}
        ${dirty(buf) ? `<span class="dot-dirty" title="unsaved changes"></span>` : ""}
      </span>
      <span class="ed-actions">
        ${kind ? `
          <span class="seg" role="group" aria-label="Editor view">
            <button type="button" data-view="form" ${formable ? "" : "disabled"}
                    class="${buf.view === "form" ? "on" : ""}">Form</button>
            <button type="button" data-view="raw"
                    class="${buf.view === "raw" ? "on" : ""}">Raw</button>
          </span>` : ""}
        ${kind && !formable && !buf.conflict ? `
          <span class="ed-note">Form view needs valid YAML</span>` : ""}
        ${!isYaml ? (buf.executable
          ? `<span class="chip-x" title="runs as an executable">executable</span>`
          : `<button type="button" class="btn btn-sm btn-ghost" data-act="chmod"
                     title="Saves the file and sets its executable bit">
               Make executable</button>`) : ""}
        <button type="button" class="btn btn-sm btn-primary" data-act="save"
                ${dirty(buf) && !buf.conflict ? "" : "disabled"}>Save</button>
      </span>
    </div>
    <div class="ed-err" id="ed-err">${buf.err ? errorBox(buf.err) : ""}</div>
    <div class="ed-body" id="ed-body"></div>
    ${buf.conflict ? "" : dryPanelHtml(wb, buf)}`;
  buf.err = null;

  box.querySelectorAll("[data-view]").forEach(el =>
    el.addEventListener("click", () => {
      if (el.dataset.view === buf.view) return;
      location.hash = fileHash(wb, buf.path, el.dataset.view === "raw");
    }));
  box.querySelector("[data-act=save]").addEventListener("click", () => saveOpen(wb));
  const chmod = box.querySelector("[data-act=chmod]");
  if (chmod) chmod.addEventListener("click", () => saveOpen(wb, { executable: true }));
  const dryClose = box.querySelector("[data-act=dryclose]");
  if (dryClose) dryClose.addEventListener("click", () => {
    wb.dry = null;
    renderEditor(wb);
  });

  const body = document.getElementById("ed-body");
  if (buf.conflict) renderConflict(wb, buf, body);
  else if (buf.view === "form") renderForm(wb, buf, body);
  else renderRaw(wb, buf, body);
}

// A light refresh after keystrokes: dirty dots, save button, problem lists -
// everything except the editor body itself, so focus and caret stay put.
function refreshChrome(wb, buf) {
  const box = document.getElementById("wb-editor");
  const save = box.querySelector("[data-act=save]");
  if (save) save.disabled = !dirty(buf) || !!buf.conflict;
  const formBtn = box.querySelector("[data-view=form]");
  if (formBtn) {
    const formable = pure.yamlParse(buf.text).ok;
    formBtn.disabled = !formable;
    const note = box.querySelector(".ed-note");
    if (!formable && !note && !buf.conflict) {
      box.querySelector(".seg").insertAdjacentHTML("afterend",
        `<span class="ed-note">Form view needs valid YAML</span>`);
    } else if (formable && note) note.remove();
  }
  const pathEl = box.querySelector(".ed-path");
  const dot = pathEl.querySelector(".dot-dirty");
  if (dirty(buf) && !dot) {
    pathEl.insertAdjacentHTML("beforeend",
      `<span class="dot-dirty" title="unsaved changes"></span>`);
  } else if (!dirty(buf) && dot) dot.remove();
  renderTree(wb);
  renderContext(wb);
}

// --- form view -----------------------------------------------------------

let fieldSeq = 0;

function valueEditor(kp, value, mode, probs) {
  const id = `f${fieldSeq++}`;
  const problems = (probs || []).map(p =>
    `<div class="ff-prob${p.problem.startsWith("warning") ? "" : " hard"}">${esc(p.problem)}</div>`
  ).join("");
  if (Array.isArray(value) && value.every(v => v === null || typeof v !== "object")) {
    const text = value.map(v => v === null ? "" : String(v)).join("\n");
    return { id, problems, html: `
      <textarea id="${id}" data-kp="${esc(kp)}" data-mode="list" spellcheck="false"
                rows="${Math.min(Math.max(value.length + 1, 2), 10)}">${esc(text)}</textarea>
      <div class="ff-help">One entry per line.</div>` };
  }
  if (value !== null && typeof value === "object") {
    return { id, problems, html: `
      <div class="ff-complex">A ${Array.isArray(value) ? "list" : "map"} —
        edit this key in the Raw view.</div>` };
  }
  const display = value === null ? "" : String(value);
  if (mode === "text" || display.includes("\n")) {
    const rows = Math.min(Math.max(display.split("\n").length + 1, 3), 16);
    return { id, problems, html: `
      <textarea id="${id}" data-kp="${esc(kp)}" data-mode="${esc(mode)}"
                spellcheck="false" rows="${rows}">${esc(display)}</textarea>` };
  }
  const mono = mode !== "text" ? "class=\"mono\"" : "";
  return { id, problems, html: `
    <input id="${id}" ${mono} data-kp="${esc(kp)}" data-mode="${esc(mode)}"
           spellcheck="false" autocomplete="off"
           ${mode === "number" ? `inputmode="decimal"` : ""}
           value="${esc(display)}">` };
}

function checkerOptions(wb, current) {
  const discovered = (wb.detail.files.checkers || [])
    .map(f => "../" + f.path);
  const options = [
    `<optgroup label="Built-in checkers">` +
      pure.BUILTIN_CHECKERS.map(b =>
        `<option value="${esc(b)}" ${b === current ? "selected" : ""}>${esc(b)}</option>`
      ).join("") + `</optgroup>`,
  ];
  if (discovered.length) {
    options.push(`<optgroup label="Checker files">` +
      discovered.map(c =>
        `<option value="${esc(c)}" ${c === current ? "selected" : ""}>${esc(c)}</option>`
      ).join("") + `</optgroup>`);
  }
  if (current && !pure.BUILTIN_CHECKERS.includes(current)
      && !discovered.includes(current)) {
    options.unshift(`<option value="${esc(current)}" selected>${esc(current)}</option>`);
  }
  if (!current) options.unshift(`<option value="" selected>— pick a checker —</option>`);
  return options.join("");
}

function checksEditor(wb, buf, checks, probs) {
  const cards = checks.map((check, i) => {
    const ok = check !== null && typeof check === "object" && !Array.isArray(check);
    const checker = ok && typeof check.checker === "string" ? check.checker : "";
    const checkProbs = probs.filter(p => p.path.startsWith(`checks.${i}`));
    const rows = ok ? Object.entries(check).filter(([k]) => k !== "checker") : [];
    return `
      <div class="check-card">
        <div class="check-head">
          <span class="check-n">${i + 1}</span>
          ${ok ? `<select data-checker="${i}" aria-label="Checker">
                    ${checkerOptions(wb, checker)}</select>
                  ${envTagHtml(pure.scalarEnvKey("SMEVALS_CHECK_", "checker"))}`
               : `<span class="ff-complex">not a map — edit in Raw view</span>`}
          <span class="check-tools">
            <button type="button" data-act="move" data-i="${i}" data-d="-1"
                    title="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
            <button type="button" data-act="move" data-i="${i}" data-d="1"
                    title="Move down" ${i === checks.length - 1 ? "disabled" : ""}>↓</button>
            <button type="button" data-act="delcheck" data-i="${i}"
                    title="Remove this check">✕</button>
          </span>
        </div>
        <div class="check-body">
          ${checkProbs.filter(p => p.path === `checks.${i}.checker`).map(p =>
            `<div class="ff-prob hard">${esc(p.problem)}</div>`).join("")}
          ${rows.map(([k, v]) => {
            const ed = valueEditor(`checks.${i}.${k}`, v, "scalar", []);
            const envTag = envTagHtml(pure.scalarEnvName("SMEVALS_CHECK_", k, v));
            return `
              <div class="ff">
                <div class="ff-row">
                  <div class="ff-val">
                    <label class="ff-key" for="${ed.id}">${esc(k)}${envTag}</label>
                    ${ed.html}
                  </div>
                  <button type="button" class="btn-del" data-act="delkey"
                          data-kp="checks.${i}.${esc(k)}" title="Remove ${esc(k)}">✕</button>
                </div>
              </div>`;
          }).join("")}
          ${ok ? `
            <div class="add-key">
              <input placeholder="add a key…" data-newkey="checks.${i}"
                     spellcheck="false" autocomplete="off" aria-label="New key name">
              <span class="add-key-env" data-newkey-env=""></span>
              <button type="button" class="btn btn-sm btn-ghost" data-act="addkey"
                      data-parent="checks.${i}">Add</button>
            </div>` : ""}
        </div>
      </div>`;
  }).join("");
  return `
    ${cards}
    <button type="button" class="btn btn-sm btn-ghost" data-act="addcheck">
      + Add check</button>`;
}

// A task's fixed fields don't need the live scalar-only check extras and
// check config get - name and prompt are always plain strings, so the
// Runner env vars they become are a fact about the schema, not a live
// per-value derivation.
const TASK_FIELD_ENV = {
  name: "SMEVALS_TASK, SMEVALS_TASK_NAME",
  prompt: "SMEVALS_PROMPT",
};

const envTagHtml = name => name ? ` <span class="ff-env">${esc(name)}</span>` : "";

function renderForm(wb, buf, body) {
  const kind = pure.docKind(buf.path);
  const schema = wb.schemas[kind] || [];
  const parsed = pure.yamlParse(buf.text);
  const doc = (parsed.doc && typeof parsed.doc === "object"
               && !Array.isArray(parsed.doc)) ? parsed.doc : {};
  const probs = fileProblems(wb, buf.path);
  const schemaTop = new Set(schema.map(f => f.key.split(".")[0]));

  const fields = schema.map(field => {
    const value = pure.getAt(doc, field.key);
    const fieldProbs = probs.filter(p => p.path === field.key);
    if (field.kind === "checks") {
      const checks = Array.isArray(value) ? value : [];
      return `
        <div class="ff">
          <label>${esc(field.label)}${field.required ? " *" : ""}</label>
          ${probs.filter(p => p.path === "checks").map(p =>
            `<div class="ff-prob hard">${esc(p.problem)}</div>`).join("")}
          ${checksEditor(wb, buf, checks, probs)}
          <div class="ff-help">${esc(field.help)}</div>
        </div>`;
    }
    const mode = { str: "scalar", path: "scalar", number: "number", text: "text" }[field.kind] || "scalar";
    const ed = valueEditor(field.key, value === undefined ? null : value, mode, fieldProbs);
    const envTag = kind === "task" ? envTagHtml(TASK_FIELD_ENV[field.key]) : "";
    return `
      <div class="ff">
        <label for="${ed.id}">${esc(field.label)}${field.required ? " *" : ""}${envTag}</label>
        ${ed.html}
        ${ed.problems}
        <div class="ff-help">${esc(field.help)}</div>
      </div>`;
  }).join("");

  const extras = Object.entries(doc)
    .filter(([k]) => !schemaTop.has(k))
    .map(([k, v]) => {
      const ed = valueEditor(k, v, "scalar", probs.filter(p => p.path === k));
      const envTag = kind === "task"
        ? envTagHtml(pure.scalarEnvName("SMEVALS_TASK_", k, v)) : "";
      return `
        <div class="ff">
          <div class="ff-row">
            <div class="ff-val">
              <label class="ff-key" for="${ed.id}">${esc(k)}${envTag}</label>
              ${ed.html}
              ${ed.problems}
            </div>
            <button type="button" class="btn-del" data-act="delkey"
                    data-kp="${esc(k)}" title="Remove ${esc(k)}">✕</button>
          </div>
        </div>`;
    }).join("");

  body.innerHTML = `
    <div class="form-view">
      ${/^\s*#/m.test(buf.text) ? `
        <div class="form-note">This file has # comments. A form edit
          rewrites the whole file and drops them — edit in Raw view to
          keep them.</div>` : ""}
      ${fields}
      ${extras}
      <div class="add-key">
        <input placeholder="add any key…" data-newkey="" spellcheck="false"
               autocomplete="off" aria-label="New key name">
        ${kind === "task" ? `<span class="add-key-env" data-newkey-env=""></span>` : ""}
        <button type="button" class="btn btn-sm btn-ghost" data-act="addkey"
                data-parent="">Add</button>
      </div>
    </div>`;
  bindForm(wb, buf, body);
}

function fieldOp(el) {
  const kp = el.dataset.kp;
  const mode = el.dataset.mode;
  const raw = el.value;
  if (mode === "list") {
    const items = raw.split("\n").filter(ln => ln.trim() !== "")
      .map(ln => pure.parsePlain(ln.trim()));
    return { op: "set", path: kp, value: items };
  }
  if (raw === "") return { op: "del", path: kp };
  if (mode === "text") return { op: "set", path: kp, value: raw };
  return { op: "set", path: kp, value: pure.parsePlain(raw.trim()) };
}

function bindForm(wb, buf, body) {
  body.addEventListener("input", event => {
    const el = event.target;
    if (el.dataset && el.dataset.newkey !== undefined) {
      const out = el.parentElement.querySelector("[data-newkey-env]");
      if (!out) return;
      const key = el.value.trim();
      const prefix = el.dataset.newkey.startsWith("checks.")
        ? "SMEVALS_CHECK_" : "SMEVALS_TASK_";
      out.textContent = key ? `→ ${pure.scalarEnvKey(prefix, key)}` : "";
      return;
    }
    if (!el.dataset || el.dataset.kp === undefined) return;
    const op = fieldOp(el);
    const result = pure.applyEdit(buf.text, op);
    if (result.ok) {
      buf.text = result.text;
      // A freshly-added extra/check field's own label carries an env tag
      // that depends on its value's scalar-ness - keep it live too, not
      // just the add-key preview, so it never lags a keystroke behind.
      const label = el.closest(".ff")?.querySelector(".ff-key");
      if (label) {
        const kp = el.dataset.kp;
        const k = kp.slice(kp.lastIndexOf(".") + 1);
        const prefix = kp.startsWith("checks.") ? "SMEVALS_CHECK_"
          : pure.docKind(buf.path) === "task" ? "SMEVALS_TASK_" : null;
        const value = op.op === "del" ? null : op.value;
        if (prefix) label.innerHTML =
          `${esc(k)}${envTagHtml(pure.scalarEnvName(prefix, k, value))}`;
      }
      refreshChrome(wb, buf);
    }
  });
  body.addEventListener("change", event => {
    const el = event.target;
    if (el.dataset.checker === undefined) return;
    const result = pure.applyEdit(buf.text,
      { op: "set", path: `checks.${el.dataset.checker}.checker`, value: el.value });
    if (result.ok) { buf.text = result.text; renderEditor(wb); refreshChrome(wb, buf); }
  });
  body.addEventListener("click", event => {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    let op = null;
    if (act === "addcheck") {
      op = { op: "insert", path: "checks", value: { checker: "contains", value: "" } };
    } else if (act === "delcheck") {
      op = { op: "del", path: `checks.${el.dataset.i}` };
    } else if (act === "move") {
      const from = Number(el.dataset.i);
      op = { op: "move", path: "checks", from, to: from + Number(el.dataset.d) };
    } else if (act === "delkey") {
      op = { op: "del", path: el.dataset.kp };
    } else if (act === "addkey") {
      const input = body.querySelector(
        `[data-newkey="${CSS.escape(el.dataset.parent)}"]`);
      const key = input.value.trim();
      if (!key) { input.focus(); return; }
      const path = el.dataset.parent ? `${el.dataset.parent}.${key}` : key;
      if (pure.getAt(pure.yamlParse(buf.text).doc, path) !== undefined) {
        input.focus();
        return;
      }
      op = { op: "set", path, value: null };
    } else return;
    const result = pure.applyEdit(buf.text, op);
    if (result.ok) {
      buf.text = result.text;
      renderEditor(wb);
      refreshChrome(wb, buf);
    }
  });
}

// --- raw view ------------------------------------------------------------

function problemRows(wb, buf) {
  const kind = pure.docKind(buf.path);
  const parsed = pure.yamlParse(buf.text);
  const rows = fileProblems(wb, buf.path).map(p => {
    let line = null;
    if (p.path && parsed.ok && parsed.lineMap[p.path]) line = parsed.lineMap[p.path];
    else {
      const m = p.problem.match(/line (\d+)/);
      if (m) line = Number(m[1]);
    }
    return { line, kp: p.path, message: p.problem };
  });
  if (kind && !parsed.ok) {
    rows.push({
      line: parsed.line,
      kp: "",
      message: `unsaved edit is not valid YAML: ${parsed.error}`,
    });
  }
  return rows;
}

function gutterHtml(text, marked) {
  const count = String(text).split("\n").length;
  let html = "";
  for (let n = 1; n <= count; n++) {
    html += `<div${marked.has(n) ? ` class="pl"` : ""}>${n}</div>`;
  }
  return html;
}

const probFootHtml = rows => rows.length ? rows.map(r => `
  <div class="prob-row">
    <span class="prob-line">${r.line ? `L${r.line}` : "—"}</span>
    ${r.kp ? `<span class="kp">${esc(r.kp)}</span>` : ""}
    <span>${esc(r.message)}</span>
  </div>`).join("") : "";

function renderRaw(wb, buf, body) {
  const rows = problemRows(wb, buf);
  const marked = new Set(rows.map(r => r.line).filter(Boolean));
  body.innerHTML = `
    <div class="raw-view">
      <div class="raw-gutter-clip"><div class="raw-gutter" id="raw-gutter">
        ${gutterHtml(buf.text, marked)}</div></div>
      <textarea class="raw-text" id="raw-text" spellcheck="false"
                autocomplete="off" wrap="off"
                aria-label="${esc(buf.path)}"></textarea>
    </div>
    <div class="prob-foot" id="prob-foot" ${rows.length ? "" : "hidden"}>
      ${probFootHtml(rows)}</div>`;
  const textarea = document.getElementById("raw-text");
  textarea.value = buf.text;
  const clip = body.querySelector(".raw-gutter-clip");
  textarea.addEventListener("scroll", () => { clip.scrollTop = textarea.scrollTop; });
  textarea.addEventListener("input", () => {
    buf.text = textarea.value;
    const rows2 = problemRows(wb, buf);
    const marked2 = new Set(rows2.map(r => r.line).filter(Boolean));
    document.getElementById("raw-gutter").innerHTML = gutterHtml(buf.text, marked2);
    const foot = document.getElementById("prob-foot");
    foot.innerHTML = probFootHtml(rows2);
    foot.hidden = !rows2.length;
    refreshChrome(wb, buf);
  });
}

// --- save + conflicts ----------------------------------------------------

async function saveOpen(wb, extra = {}) {
  const buf = wb.open && wb.buffers.get(wb.open);
  if (!buf || buf.saving || buf.conflict) return;
  if (!dirty(buf) && !extra.executable) return;
  buf.saving = true;
  try {
    const data = await api(`/api/evals/${enc(wb.slug)}/file`, {
      method: "PUT",
      body: { path: buf.path, content: buf.text, base_sha256: buf.sha, ...extra },
    });
    if (state.wb !== wb) return;
    buf.sha = data.sha256;
    buf.savedText = buf.text;
    if (extra.executable !== undefined) buf.executable = extra.executable;
    wb.detail.validation = data.validation;
    restoreFocusAfter(() => { renderPanes(wb); });
  } catch (ex) {
    if (state.wb !== wb) return;
    if (ex.conflict) buf.conflict = { theirs: ex.conflict.theirs };
    else buf.err = ex.message;
    renderEditor(wb);
  } finally {
    buf.saving = false;
  }
}

// Saving from the keyboard must not eject the caret from the editor
function restoreFocusAfter(rerender) {
  const active = document.activeElement;
  const isRaw = active && active.id === "raw-text";
  const kp = active && active.dataset ? active.dataset.kp : undefined;
  const sel = active && active.selectionStart !== undefined
    ? [active.selectionStart, active.selectionEnd] : null;
  const scroll = isRaw ? active.scrollTop : null;
  rerender();
  let target = null;
  if (isRaw) target = document.getElementById("raw-text");
  else if (kp !== undefined) {
    target = document.querySelector(`#ed-body [data-kp="${CSS.escape(kp)}"]`);
  }
  if (target) {
    target.focus();
    if (sel) try { target.setSelectionRange(sel[0], sel[1]); } catch { /* not a text field */ }
    if (scroll !== null) target.scrollTop = scroll;
  }
}

function renderConflict(wb, buf, body) {
  body.innerHTML = `
    <div class="conflict">
      <p class="conflict-intro">This file changed on disk while you were
        editing — probably in another editor. Nothing has been written.
        Compare the two versions, then keep one.</p>
      <div class="conflict-grid">
        <div class="conflict-pane">
          <h4>On disk now</h4>
          <pre>${esc(buf.conflict.theirs)}</pre>
        </div>
        <div class="conflict-pane ours">
          <h4>Your unsaved edits</h4>
          <pre>${esc(buf.text)}</pre>
        </div>
      </div>
      <div class="conflict-actions">
        <button type="button" class="btn btn-sm btn-ghost" data-res="reload">
          Reload from disk</button>
        <button type="button" class="btn btn-sm btn-primary" data-res="overwrite">
          Keep my edits</button>
      </div>
    </div>`;
  body.querySelector("[data-res=reload]").addEventListener("click", async () => {
    try {
      const data = await api(
        `/api/evals/${enc(wb.slug)}/file?path=${enc(buf.path)}`);
      if (state.wb !== wb) return;
      Object.assign(buf, {
        text: data.content, savedText: data.content,
        sha: data.sha256, executable: data.executable, conflict: null,
      });
      await refreshDetail(wb);
      renderPanes(wb);
    } catch (ex) { buf.err = ex.message; renderEditor(wb); }
  });
  body.querySelector("[data-res=overwrite]").addEventListener("click", async () => {
    try {
      // Re-read for the current on-disk hash, then write our text over it
      const current = await api(
        `/api/evals/${enc(wb.slug)}/file?path=${enc(buf.path)}`);
      if (state.wb !== wb) return;
      buf.sha = current.sha256;
      buf.conflict = null;
      await saveOpen(wb);
    } catch (ex) { buf.err = ex.message; renderEditor(wb); }
  });
}

async function refreshDetail(wb) {
  const detail = await api(`/api/evals/${enc(wb.slug)}`);
  if (state.wb === wb) wb.detail = detail;
}

// --- context panel -------------------------------------------------------

const ENV_CONTRACT = [
  ["SMEVALS_TASK", "the task's name"],
  ["SMEVALS_PROMPT", "the task's prompt, when it has one"],
  ["SMEVALS_MODEL", "the model to attempt it with"],
  ["SMEVALS_TASK_<KEY>", "every other scalar key on the task"],
  ["SMEVALS_RUN_DIR", "where output.txt and artifacts land"],
];

function renderContext(wb) {
  const box = document.getElementById("wb-ctx");
  if (!box) return;
  if (wb.surface && wb.surface.runs) {
    const row = wb.surface.run && wb.runs
      ? wb.runs.find(r => r.run === wb.surface.run) : null;
    return row ? renderRunNote(wb, box, row) : renderBenchNote(wb, box);
  }
  if (wb.surface && wb.surface.results) return renderResultsNote(wb, box);
  if (wb.surface && wb.surface.compare) return renderCompareNote(wb, box);
  const buf = wb.open && wb.buffers.get(wb.open);
  const kind = buf ? pure.docKind(buf.path) : null;
  if (kind === "task") return renderTaskMirror(wb, buf, box);
  if (kind === "grader") return renderGraderPipeline(wb, buf, box);
  if (kind === "config") return renderConfigContext(wb, buf, box);
  box.innerHTML = `
    <p class="ctx-eyebrow">The Runner contract</p>
    <p class="ctx-sub">what every Runner subprocess receives</p>
    <div class="env-block">
      ${ENV_CONTRACT.map(([name, what]) => `
        <div class="env-var">
          <span class="env-name">${esc(name)}</span>
          <div class="env-val dim">${esc(what)}</div>
        </div>`).join("")}
    </div>
    <div class="ctx-note" style="margin-top: var(--sp-3)">
      <p>Open a task: its own fields show their env var names inline, and
         this panel adds the model and run directory. Open a grader to see
         its check pipeline instead.</p>
    </div>`;
}

function configNames(wb) {
  return (wb.detail.files.configs || [])
    .map(f => f.path.replace(/^configs\//, "").replace(/\.yaml$/, ""));
}

function mirrorModel(wb) {
  const name = wb.mirrorConfig;
  if (!name) return { model: null, hint: "no configs yet" };
  const text = configText(wb, name);
  if (text === undefined) return { model: null, hint: "loading config…" };
  const parsed = pure.yamlParse(text);
  const model = parsed.ok && parsed.doc && typeof parsed.doc.model === "string"
    ? parsed.doc.model : null;
  return {
    model,
    hint: model ? `from configs/${name}.yaml` : `configs/${name}.yaml has no model — pass -m`,
  };
}

function renderTaskMirror(wb, buf, box) {
  const { model, hint } = benchModel(wb);
  const mirror = pure.envMirror(buf.text, { config: wb.mirrorConfig, model });
  box.innerHTML = `
    <p class="ctx-eyebrow">Model &amp; run directory</p>
    <p class="ctx-sub">not on the task itself · set by the picker below</p>
    <div class="env-block">
      ${mirror.ok ? mirror.vars.map(v => `
        <div class="env-var" data-env="${esc(v.name)}">
          <span class="env-name">${esc(v.name)}</span>
          <div class="env-val${v.missing || v.synthetic ? " dim" : ""}">${
            v.missing
              ? esc(v.name === "SMEVALS_MODEL" ? `(${hint})` : "(missing)")
              : esc(v.value)}</div>
        </div>`).join("")
      : `<div class="env-err">The mirror is waiting for valid YAML —
           <b>${esc(mirror.error)}</b></div>`}
    </div>
    <div class="ctx-note" style="margin-top: var(--sp-3)">
      <p>This is the exact environment <code>smevals run</code> hands your
         Runner subprocess — the task's own fields carry their env vars
         inline, to the left; every other scalar key becomes
         <code>SMEVALS_TASK_&lt;KEY&gt;</code>.</p>
      <p><a href="${runsFilterHash(wb, { task: fileStem(buf.path) })}">runs
         of this task →</a></p>
      <p><a href="${compareHash(wb, fileStem(buf.path))}">compare outputs →</a></p>
    </div>
    ${benchRunHtml(wb, buf)}`;
  bindBenchRun(wb, buf, box);
}

const PIPE_STATUS = {
  builtin: ["st-ok", "built-in checker"],
  ok: ["st-ok", "executable"],
  "not-executable": ["st-warn", "found, but not executable"],
  "not-found": ["st-bad", "no such file"],
  outside: ["st-bad", "path escapes the eval"],
  missing: ["st-bad", "no checker set"],
  invalid: ["st-bad", "not a map"],
};

const pipeValue = v => {
  if (v === null) return "";
  if (Array.isArray(v)) return v.map(pipeValue).join(", ");
  if (typeof v === "object") return "{…}";
  const s = String(v);
  const first = s.split("\n")[0];
  return first === s ? s : first + " ⋯";
};

function renderGraderPipeline(wb, buf, box) {
  const pipe = pure.pipeline(buf.text, flatFiles(wb));
  if (!pipe.ok) {
    box.innerHTML = `
      <p class="ctx-eyebrow">Check pipeline</p>
      <p class="ctx-sub">what smevals grade runs, in order</p>
      <div class="env-block"><div class="env-err">The pipeline is waiting
        for valid YAML — <b>${esc(pipe.error)}</b></div></div>
      ${benchDryHtml(wb, buf)}`;
    bindBenchDry(wb, buf, box);
    return;
  }
  box.innerHTML = `
    <p class="ctx-eyebrow">Check pipeline</p>
    <p class="ctx-sub">what smevals grade runs, in order</p>
    <div class="pipe">
      ${pipe.steps.length ? pipe.steps.map(step => {
        const [cls, label] = PIPE_STATUS[step.status];
        return `
          <div class="pipe-step">
            <span class="pipe-n">${step.index + 1}</span>
            <div class="pipe-checker">${esc(step.checker || "—")}</div>
            <div class="pipe-status ${cls}"><span class="st-dot"></span>
              ${esc(label)}${step.required ? " · required — failure halts the pipeline" : ""}</div>
            ${Object.keys(step.config).length ? `
              <div class="pipe-conf">
                ${Object.entries(step.config).map(([k, v]) => `
                  <div><span class="k">${esc(k)}:</span> ${esc(pipeValue(v))}</div>`).join("")}
              </div>` : ""}
          </div>`;
      }).join("") : `<div class="ctx-note"><p>No checks yet — add one in the
        form view and it appears here.</p></div>`}
    </div>
    <div class="pipe-foot">
      A grade passes when every check succeeds${pipe.threshold !== null
        ? `, and the checks' final score reaches
           ${esc(String(pipe.threshold))}` : ""}.
    </div>
    ${benchDryHtml(wb, buf)}`;
  bindBenchDry(wb, buf, box);
}

function renderConfigContext(wb, buf, box) {
  const parsed = pure.yamlParse(buf.text);
  const doc = parsed.ok && parsed.doc && typeof parsed.doc === "object"
    ? parsed.doc : {};
  const runner = typeof doc.runner === "string" ? doc.runner : "";
  const resolved = runner ? pure.resolveRel("configs", runner) : null;
  const entry = resolved
    ? flatFiles(wb).find(f => f.path === resolved) : null;
  const status = !runner ? ["st-bad", "no runner set"]
    : !resolved ? ["st-bad", "path escapes the eval"]
    : !entry ? ["st-bad", "no such file"]
    : entry.executable ? ["st-ok", "executable"]
    : ["st-warn", "found, but not executable"];
  box.innerHTML = `
    <p class="ctx-eyebrow">Config</p>
    <p class="ctx-sub">picked with -c ${esc(doc.name || "…")}</p>
    <div class="pipe">
      <div class="pipe-step">
        <span class="pipe-n">R</span>
        <div class="pipe-checker">${esc(runner || "—")}</div>
        <div class="pipe-status ${status[0]}"><span class="st-dot"></span>
          ${esc(status[1])}</div>
      </div>
      <div class="pipe-step">
        <span class="pipe-n">M</span>
        <div class="pipe-checker">${esc(doc.model || "no default model")}</div>
        <div class="pipe-status"><span></span>
          ${doc.model ? "used when -m is omitted" : "every run must pass -m"}</div>
      </div>
    </div>
    <div class="ctx-note" style="margin-top: var(--sp-3)">
      <p>The runner is an executable, resolved relative to this file. It
         receives the task as SMEVALS_* environment variables — open a task
         to see them.</p>
    </div>`;
}

// --- bench: runs, jobs, grading, dry-run ---------------------------------

const runsHash = wb => `#/eval/${enc(wb.slug)}/runs`;
const runHash = (wb, run) => `#/eval/${enc(wb.slug)}/runs/${enc(run)}`;
// filter: any of { task, config, model, tag, grader } - the runs list
// narrows to rows matching every part (grader scopes the tag lookup)
const FILTER_KEYS = ["task", "config", "model", "tag", "grader"];
const runsFilterHash = (wb, filter) => {
  const params = new URLSearchParams();
  for (const key of FILTER_KEYS) {
    if (filter && filter[key]) params.set(key, filter[key]);
  }
  const q = params.toString();
  return runsHash(wb) + (q ? `?${q}` : "");
};
const graderNames = wb => (wb.detail.files.graders || [])
  .map(f => f.path.replace(/^graders\//, "").replace(/\.yaml$/, ""));
const taskNames = wb => (wb.detail.files.tasks || [])
  .map(f => f.path.replace(/^tasks\//, "").replace(/\.yaml$/, ""));
const fileStem = path => String(path).replace(/^.*\//, "").replace(/\.yaml$/, "");
const runOk = row => !(row.exit_code ?? 0);
const fmtDuration = s => s == null ? "" :
  s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`
          : `${Number(s).toFixed(1)}s`;

// The eval's Runs, fetched lazily and only once: the runs list/detail, the
// dry-run picker, and the bench's latest-run panel each call this before
// reading wb.runs, instead of loadWorkbench fetching it eagerly for every
// workbench open (the phase-1 debt this task pays off). Cached on wb.runs;
// force re-fetches (after a run or grade lands). Concurrent callers share
// one in-flight request (single-flight) rather than issuing duplicate
// fetches for the same tick.
async function ensureRuns(wb, force = false) {
  if (!force) {
    if (wb.runs !== null) return;
    if (wb.runsPromise) return wb.runsPromise;
  }
  const promise = (async () => {
    try {
      const rows = await api(`/api/evals/${enc(wb.slug)}/runs`);
      if (state.wb !== wb) return;
      rows.sort((a, b) => String(b.started || "").localeCompare(String(a.started || "")));
      wb.runs = rows;
      wb.runsErr = null;
    } catch (ex) {
      if (state.wb !== wb) return;
      if (wb.runs === null) wb.runs = [];
      wb.runsErr = ex.message;
    } finally {
      if (wb.runsPromise === promise) wb.runsPromise = null;
    }
  })();
  wb.runsPromise = promise;
  return promise;
}

// Model suggestions for the run form's combo box, fetched once per session
async function loadModels(wb) {
  if (state.models) return;
  try {
    state.models = (await api("/api/models")).models || [];
  } catch { state.models = []; }
  if (state.wb === wb) renderContext(wb);
}

// bare: outcome/score only, for rows where the grader is already named
const gradeChip = (name, g, bare = false) => {
  const cls = g.outcome === "pass" ? "pass" : "fail";
  const score = g.score === null || g.score === undefined ? "" : ` ${g.score}`;
  const when = g.graded ? ` · graded ${ago(g.graded)}` : "";
  return `<span class="chip-grade ${cls}" title="${esc(
    `${name}: ${g.outcome}${score}${when}`)}">${
    bare ? "" : `${esc(name)}: `}${esc(g.outcome)}${esc(score)}</span>`;
};

// --- run artifacts: cached file reads + collapsible sections ---------------

function ensureFileText(wb, rel) {
  if (wb.runText[rel] !== undefined) return wb.runText[rel];
  wb.runText[rel] = null; // loading
  api(`/api/evals/${enc(wb.slug)}/file?path=${enc(rel)}`)
    .then(data => { wb.runText[rel] = data.content; })
    .catch(ex => { wb.runText[rel] = `(couldn't read ${rel}: ${ex.message})`; })
    .finally(() => { if (state.wb === wb) renderBenchSurfaces(wb); });
  return null;
}

// Inline images ride the binary-safe /raw endpoint. An <img src> cannot
// carry the X-Studio-Key header, so the bytes are fetched with it and
// handed to the tag as an object URL, cached per workbench.
function ensureRawBlob(wb, rel) {
  const cached = wb.rawCache[rel];
  if (cached !== undefined) return cached;
  wb.rawCache[rel] = null; // loading
  fetch(`/api/evals/${enc(wb.slug)}/raw?path=${enc(rel)}`,
        { headers: { "X-Studio-Key": studioKey() } })
    .then(async response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const url = URL.createObjectURL(await response.blob());
      wb.rawCache[rel] = { url };
    })
    .catch(ex => { wb.rawCache[rel] = { err: ex.message }; })
    .finally(() => { if (state.wb === wb) renderBenchSurfaces(wb); });
  return null;
}

// Save-to-disk for artifacts that neither render inline nor read as text
async function downloadRaw(wb, rel, name) {
  const response = await fetch(`/api/evals/${enc(wb.slug)}/raw?path=${enc(rel)}`,
    { headers: { "X-Studio-Key": studioKey() } });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const url = URL.createObjectURL(await response.blob());
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

// <details> open state survives rerenders via wb.detailsState
function foldHtml(wb, key, label, bodyHtml, defaultOpen) {
  const open = key in wb.detailsState ? wb.detailsState[key] : defaultOpen;
  return `
    <details class="fold" data-fold="${esc(key)}"${open ? " open" : ""}>
      <summary>${esc(label)}</summary>${bodyHtml}
    </details>`;
}

function bindFolds(wb, container) {
  container.querySelectorAll("details[data-fold]").forEach(el =>
    el.addEventListener("toggle", () => {
      wb.detailsState[el.dataset.fold] = el.open;
    }));
}

// One text file as a fold: a wrap toggle plus a 20k-char cap with show-all,
// so a huge output stays navigable. Prefs survive rerenders on wb.textPrefs.
const TEXT_CAP = 20000;

function textFoldHtml(wb, key, label, rel, defaultOpen) {
  const text = ensureFileText(wb, rel);
  if (text === null) {
    return foldHtml(wb, key, label,
      `<div class="fold-loading">Loading…</div>`, defaultOpen);
  }
  const prefs = wb.textPrefs[key] || {};
  const wrap = prefs.wrap !== false;
  const truncated = !prefs.full && text.length > TEXT_CAP;
  const body = `
    <div class="fold-tools">
      <button type="button" data-wrap="${esc(key)}">wrap: ${
        wrap ? "on" : "off"}</button>
      ${truncated ? `<button type="button" data-full="${esc(key)}">show all
        (${text.length.toLocaleString()} chars)</button>` : ""}
    </div>
    <pre${wrap ? "" : ` class="nowrap"`}>${
      esc(truncated ? text.slice(0, TEXT_CAP) : text) || "(empty)"}${
      truncated ? "\n… truncated" : ""}</pre>`;
  return foldHtml(wb, key, label, body, defaultOpen);
}

function bindFoldTools(wb, container) {
  container.querySelectorAll(".fold-tools [data-wrap]").forEach(el =>
    el.addEventListener("click", () => {
      const prefs = wb.textPrefs[el.dataset.wrap] ||= {};
      prefs.wrap = prefs.wrap === false;
      renderBenchSurfaces(wb);
    }));
  container.querySelectorAll(".fold-tools [data-full]").forEach(el =>
    el.addEventListener("click", () => {
      (wb.textPrefs[el.dataset.full] ||= {}).full = true;
      renderBenchSurfaces(wb);
    }));
}

const IMAGE = /\.(png|svg|jpe?g|gif|webp)$/i;
const TEXTLIKE = /\.(txt|log|md|json|ya?ml|csv|tsv|xml|html?|py|js|ts|sh|diff|patch)$/i;

// Every artifact one run (or grade) directory holds: images inline, text
// as folds, anything else as a download. base is run-relative ("" or
// "grades/<name>/"); names as collect_eval lists them.
function artifactsHtml(wb, row, keyPrefix, base, names) {
  const rel = name => `runs/${row.run}/${base}${name}`;
  const images = names.filter(f => IMAGE.test(f));
  const texts = names.filter(f => !IMAGE.test(f) && TEXTLIKE.test(f));
  const others = names.filter(f => !IMAGE.test(f) && !TEXTLIKE.test(f));
  const imgHtml = name => {
    const blob = ensureRawBlob(wb, rel(name));
    return `
      <figure class="art-fig">
        <figcaption class="art-cap">${esc(base + name)}</figcaption>
        ${blob === null
          ? `<div class="art-wait">loading ${esc(name)}…</div>`
          : blob.err
            ? `<div class="art-wait">couldn't load ${esc(name)}: ${esc(blob.err)}</div>`
            : `<img class="art-img" src="${esc(blob.url)}" alt="${esc(base + name)}">`}
      </figure>`;
  };
  return `
    ${images.map(imgHtml).join("")}
    ${texts.map(name => textFoldHtml(wb, `${keyPrefix}:${row.run}:${base}${name}`,
      base + name, rel(name), false)).join("")}
    ${others.length ? `
      <div class="art-line">artifacts:
        ${others.map(name => `<button type="button" class="btn btn-sm btn-ghost"
          data-dl="${esc(rel(name))}" data-dl-name="${esc(name)}"
          title="${esc(`download ${name}`)}">${esc(name)} ↓</button>`).join(" ")}
      </div>` : ""}`;
}

function bindArtifacts(wb, container) {
  container.querySelectorAll("[data-dl]").forEach(el =>
    el.addEventListener("click", async () => {
      el.disabled = true;
      try {
        await downloadRaw(wb, el.dataset.dl, el.dataset.dlName);
      } catch (ex) {
        el.textContent = `${el.dataset.dlName}: ${ex.message}`;
      }
      el.disabled = false;
    }));
  bindFoldTools(wb, container);
}

// output.txt + stderr + artifacts for one run row, in ctx or run-detail size;
// runYaml adds the recorded run.yaml (the run detail's provenance fold)
function runBodyHtml(wb, row, keyPrefix, { runYaml = false } = {}) {
  const files = row.files || [];
  const artifacts = files.filter(
    f => !["output.txt", "stderr.txt", "run.yaml"].includes(f));
  const foldFile = (name, defaultOpen) => textFoldHtml(
    wb, `${keyPrefix}:${row.run}:${name}`, name,
    `runs/${row.run}/${name}`, defaultOpen);
  return `
    ${foldFile("output.txt", true)}
    ${files.includes("stderr.txt") ? foldFile("stderr.txt", false) : ""}
    ${artifactsHtml(wb, row, keyPrefix, "", artifacts)}
    ${runYaml ? foldFile("run.yaml", false) : ""}`;
}

// --- runs surfaces (middle pane) -------------------------------------------

function renderRunsPane(wb) {
  const box = document.getElementById("wb-editor");
  if (!box) return;
  if (wb.runs === null) {
    box.innerHTML = `<div class="ed-empty"><p>Loading runs…</p></div>`;
    ensureRuns(wb).then(() => { if (state.wb === wb) renderBenchSurfaces(wb); });
    return;
  }
  if (wb.surface.run) renderRunDetail(wb, box);
  else renderRunsList(wb, box);
}

function runRowHtml(row) {
  const chips = Object.entries(row.grades || {})
    .map(([name, g]) => gradeChip(name, g)).join(" ");
  return `
    <button type="button" class="run-row" data-run="${esc(row.run)}">
      <span class="ok-dot${runOk(row) ? "" : " bad"}" title="${runOk(row)
        ? "runner exited 0"
        : esc(`runner failed (exit ${row.exit_code})`)}"></span>
      <span class="run-id">${esc(row.task ?? "?")} <span class="sep">/</span>
        ${esc(row.config ?? "?")} <span class="sep">/</span>
        ${esc(row.model ?? "?")}</span>
      <span class="run-chips">${chips}${runOk(row) ? ""
        : `<span class="chip-grade fail">failed</span>`}</span>
      <span class="run-when" title="${esc(row.started || "")}">${
        row.started ? esc(ago(row.started)) : "—"}</span>
    </button>`;
}

// True when any of the row's grades (scoped to one grader when given)
// carries the tag - the Results tab's tag chips pivot through this
function rowHasTag(row, tag, grader) {
  const grades = row.grades || {};
  const pool = grader ? [grades[grader]] : Object.values(grades);
  return pool.some(g => g && (g.tags || []).includes(tag));
}

function filterPartsHtml(f) {
  return [
    f.task && `task <b>${esc(f.task)}</b>`,
    f.config && `config <b>${esc(f.config)}</b>`,
    f.model && `model <b>${esc(f.model)}</b>`,
    f.tag && `tagged <b>#${esc(f.tag)}</b>${
      f.grader ? ` under <b>${esc(f.grader)}</b>` : ""}`,
  ].filter(Boolean).join(" · ");
}

function renderRunsList(wb, box) {
  const filter = wb.runsFilter;
  const rows = filter
    ? wb.runs.filter(r => (!filter.config || r.config === filter.config)
        && (!filter.model || r.model === filter.model)
        && (!filter.task || r.task === filter.task)
        && (!filter.tag || rowHasTag(r, filter.tag, filter.grader)))
    : wb.runs;
  box.innerHTML = `
    <div class="ed-head">
      <span class="ed-path">runs</span>
      <span class="ed-actions">
        <span class="bench-hint">${esc(plural(rows.length, "run"))}${
          filter ? ` of ${wb.runs.length}` : ""}</span>
        <a href="${compareHash(wb, filter && filter.task)}">compare outputs →</a>
      </span>
    </div>
    ${filter ? `
      <div class="runs-filter">showing ${filterPartsHtml(filter)}
        <a href="${runsHash(wb)}">clear filter</a>
      </div>` : ""}
    ${wb.runsErr ? `<div class="ed-err">${errorBox(wb.runsErr)}</div>` : ""}
    ${rows.length
      ? `<div class="runs-list">${rows.map(runRowHtml).join("")}</div>`
      : filter
        ? `<div class="ed-empty"><p>No runs match this filter.</p></div>`
        : `<div class="ed-empty">
          <h3>No runs yet</h3>
          <p>A run is one task attempted once: the Runner's stdout lands in
             <code>output.txt</code> under <code>runs/</code>, ready for
             graders to score. Runs are immutable — Studio only ever adds
             new ones.</p>
          <p>Open a task and use <b>Run this task</b> in the panel on the
             right, or from a terminal:
             <code>smevals run . -t &lt;task&gt;</code>.</p>
        </div>`}`;
  box.querySelectorAll(".run-row").forEach(el =>
    el.addEventListener("click", () => {
      location.hash = runHash(wb, el.dataset.run);
    }));
}

function renderRunDetail(wb, box) {
  const row = wb.runs.find(r => r.run === wb.surface.run);
  if (!row) {
    box.innerHTML = `
      <div class="ed-head">
        <span class="ed-path"><a href="${runsHash(wb)}">runs</a></span>
      </div>
      <div class="ed-err">${errorBox(`No such run: ${wb.surface.run}`)}</div>`;
    return;
  }
  // task/config/model pivot into the runs list filtered to their value -
  // the task link is Studio's per-task view
  const metaLink = (key, value) => value
    ? `<a class="meta-link" href="${runsFilterHash(wb, { [key]: value })}"
         title="${esc(`all runs with this ${key}`)}">${esc(value)}</a>`
    : `<span>?</span>`;
  box.innerHTML = `
    <div class="ed-head">
      <span class="ed-path"><a href="${runsHash(wb)}">runs</a> /&nbsp;${esc(row.run)}</span>
    </div>
    <div class="run-view">
      <div class="run-meta">
        <span class="ok-dot${runOk(row) ? "" : " bad"}"></span>
        ${metaLink("task", row.task)}<span class="sep">·</span>
        ${metaLink("config", row.config)}<span class="sep">·</span>
        ${metaLink("model", row.model)}<span class="sep">·</span>
        <span title="${esc(row.started || "")}">${
          row.started ? esc(ago(row.started)) : "—"}</span>
        ${row.duration != null ? `<span class="sep">·</span>
          <span>${esc(fmtDuration(row.duration))}</span>` : ""}
        ${row.imported_from ? `<span class="sep">·</span>
          <span title="${esc(row.imported_from)}">imported</span>` : ""}
        ${runOk(row) ? "" : `<span class="sep">·</span>
          <span style="color: var(--fail)">exit ${esc(String(row.exit_code))}</span>`}
      </div>
      ${runBodyHtml(wb, row, "run", { runYaml: true })}
      ${runGradesHtml(wb, row)}
    </div>`;
  bindFolds(wb, box);
  bindGradeButtons(wb, box);
  bindArtifacts(wb, box);
}

function runGradesHtml(wb, row) {
  const names = graderNames(wb);
  const failed = !runOk(row);
  return `
    <div class="run-grades">
      <div class="rg-label">grades</div>
      ${failed ? `<p class="rg-note">A failed run is a harness error, not
        evidence — grading is disabled.</p>` : ""}
      ${names.length ? names.map(name => {
        const g = (row.grades || {})[name];
        const checks = g ? g.checks || [] : [];
        return `
          <div class="grade-row">
            <span class="rg-name">${esc(name)}</span>
            ${g ? gradeChip(name, g, true)
                : `<span class="rg-none">not graded yet</span>`}
            ${failed ? "" : `
              <button type="button" class="btn btn-sm ${g ? "btn-ghost" : "btn-primary"}"
                      data-grade="${esc(name)}" data-run="${esc(row.run)}">
                ${g ? "Regrade" : "Grade"}</button>`}
          </div>
          ${checks.length ? foldHtml(wb, `run:${row.run}:checks:${name}`,
            plural(checks.length, "check"),
            `<div class="grade-checks">
              ${checks.map(c => dryCellHtml(checkView(c), null, false)).join("")}
              ${(g.tags || []).length ? `<div class="dry-tags">${
                esc(g.tags.map(t => "#" + t).join(" "))}</div>` : ""}
            </div>`, true) : ""}
          ${g && (g.files || []).length
            ? artifactsHtml(wb, row, `run:g:${name}`, `grades/${name}/`, g.files)
            : ""}
          <div data-grade-err="${esc(name)}"></div>`;
      }).join("") : `<p class="rg-note">No graders in this eval yet — add
        one under graders/ and it can score this run.</p>`}
    </div>`;
}

function bindGradeButtons(wb, container) {
  container.querySelectorAll("[data-grade]").forEach(el =>
    el.addEventListener("click", () => {
      const slot = container.querySelector(
        `[data-grade-err="${CSS.escape(el.dataset.grade)}"]`);
      doGrade(wb, el.dataset.run, el.dataset.grade, slot, el);
    }));
}

async function doGrade(wb, run, grader, errSlot, button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Grading…";
  try {
    await api(`/api/evals/${enc(wb.slug)}/grade`, { body: { run, grader } });
    if (state.wb !== wb) return;
    await ensureRuns(wb, true);
    if (state.wb !== wb) return;
    renderBenchSurfaces(wb);
    // A fresh grade changes what a dry-run comparison is measured against
    if (wb.open && wb.dry) renderEditor(wb);
    document.querySelector(
      `[data-grade="${CSS.escape(grader)}"][data-run="${CSS.escape(run)}"]`)?.focus();
  } catch (ex) {
    if (state.wb !== wb) return;
    button.disabled = false;
    button.textContent = label;
    if (errSlot) errSlot.innerHTML = errorBox(ex.message);
  }
}

// --- context: the bench note (runs surfaces) -------------------------------

function renderBenchNote(wb, box) {
  box.innerHTML = `
    <p class="ctx-eyebrow">The bench</p>
    <p class="ctx-sub">run → grade → tighten the grader</p>
    <div class="ctx-note">
      <p>Each run is a directory under <code>runs/</code>: the Runner's
         stdout as <code>output.txt</code>, stderr and artifacts beside it,
         grades in <code>grades/&lt;grader&gt;/</code>.</p>
      <p>Grade a run with any grader from its page. To tune a grader, open
         it in the editor and <b>dry-run</b> it against a run: it grades
         with your unsaved text and shows the difference next to the saved
         grade, writing nothing under runs/.</p>
    </div>`;
}

// --- context: one run open (the run detail's companion) ---------------------
//
// What serve's run page put beside the output: the task being attempted.
// The task file is the eval's current definition; the run's own run.yaml
// fold (left) records the exact fields the Runner received.
function renderRunNote(wb, box, row) {
  const taskPath = `tasks/${row.task}.yaml`;
  const hasTask = row.task && flatFiles(wb).some(f => f.path === taskPath);
  box.innerHTML = `
    <p class="ctx-eyebrow">This run's task</p>
    <p class="ctx-sub">${esc(row.task ?? "unknown task")}</p>
    ${hasTask
      ? textFoldHtml(wb, `ctx:task:${taskPath}`, taskPath, taskPath, true)
      : `<div class="ctx-note"><p>No <code>${esc(taskPath)}</code> in this
           eval today — the run.yaml fold on the left records the task as
           the Runner received it.</p></div>`}
    <div class="ctx-note">
      ${hasTask ? `<p><a href="${fileHash(wb, taskPath, false)}">open the
        task in the editor →</a></p>` : ""}
      ${row.task ? `<p><a href="${runsFilterHash(wb, { task: row.task })}">all
        runs of this task →</a></p>` : ""}
      <p>Grade or regrade with any grader from the panel on the left; a
         grade never changes the run itself.</p>
    </div>`;
  bindFolds(wb, box);
  bindFoldTools(wb, box);
}

// --- context: Run this task ------------------------------------------------

// The run form's model wins over the config's default; the same value
// feeds the env mirror, so the mirror previews exactly the run the
// button would fire.
function benchModel(wb) {
  const typed = (wb.bench.model || "").trim();
  if (typed) return { model: typed, hint: "" };
  return mirrorModel(wb);
}

const jobLogHtml = job => (job.log || []).length
  ? job.log.slice(-12).map(l => `<div class="log-line">${esc(l)}</div>`).join("")
  : `<div class="log-line dim">waiting for the runner…</div>`;

function benchRunHtml(wb, buf) {
  const job = wb.job;
  const busy = job && (job.status === "queued" || job.status === "running");
  const configs = configNames(wb);
  const cfgDefault = mirrorModel(wb).model;
  return `
    <div class="ctx-act" id="bench-run">
      <p class="ctx-eyebrow">Run this task</p>
      ${busy ? `
        <div class="job-status"><span class="spin"></span>
          ${esc(job.status)} — one real run, recorded under runs/</div>
        <div class="env-block job-log">${jobLogHtml(job)}</div>` : `
        <div class="bench-form">
          <div class="bench-row">
            <label for="bench-config">config</label>
            ${configs.length ? `
              <select id="bench-config">
                ${configs.map(c => `
                  <option value="${esc(c)}" ${c === wb.mirrorConfig ? "selected" : ""}>
                    ${esc(c)}</option>`).join("")}
              </select>` : `<span class="bench-hint">no configs yet</span>`}
          </div>
          <div class="bench-row">
            <label for="bench-model">model</label>
            <input id="bench-model" list="bench-models" spellcheck="false"
                   autocomplete="off"
                   placeholder="${esc(cfgDefault || "model id")}"
                   value="${esc(wb.bench.model || "")}">
            <datalist id="bench-models">
              ${(state.models || []).map(m => `<option value="${esc(m)}">`).join("")}
            </datalist>
          </div>
          <div class="bench-actions">
            <button type="button" class="btn btn-sm btn-primary" id="bench-go"
                    ${configs.length ? "" : "disabled"}>Run</button>
            <span class="bench-hint">${cfgDefault
              ? `blank model = ${esc(cfgDefault)}`
              : "this config has no default model"}</span>
          </div>
          ${dirty(buf) ? `<div class="bench-hint">Runs the file as saved —
            this task has unsaved edits.</div>` : ""}
          <div id="bench-err">${wb.benchErr ? errorBox(wb.benchErr) : ""}</div>
        </div>`}
      ${latestRunHtml(wb)}
    </div>`;
}

function latestRunHtml(wb) {
  const job = wb.job;
  if (!job || job.status === "queued" || job.status === "running") return "";
  if (job.run_dir && wb.runs === null) {
    ensureRuns(wb).then(() => { if (state.wb === wb) renderContext(wb); });
  }
  const row = job.run_dir && wb.runs
    ? wb.runs.find(r => r.run === job.run_dir) : null;
  return `
    <div class="bench-done">
      <p class="ctx-eyebrow" style="margin-top: var(--sp-3)">Latest run</p>
      ${job.status === "failed" ? errorBox(job.error || "the run failed") : ""}
      ${row ? `
        <div class="run-meta">
          <span class="ok-dot${runOk(row) ? "" : " bad"}"></span>
          ${row.duration != null ? `<span>${esc(fmtDuration(row.duration))}</span>
            <span class="sep">·</span>` : ""}
          <a href="${runHash(wb, row.run)}">open run →</a>
        </div>
        ${runBodyHtml(wb, row, "ctx")}
        ${Object.keys(row.grades || {}).length ? `
          <div class="run-meta">${Object.entries(row.grades)
            .map(([n, g]) => gradeChip(n, g)).join(" ")}</div>` : ""}
        ${runOk(row) ? `
          <div class="bench-actions">
            ${graderNames(wb).map(n => `
              <button type="button" class="btn btn-sm btn-ghost"
                      data-grade="${esc(n)}" data-run="${esc(row.run)}">
                Grade with ${esc(n)}</button>`).join("")}
          </div>
          <div data-grade-err="ctx"></div>` : ""}
      ` : job.run_dir ? `<div class="bench-hint">reading the run…</div>` : ""}
    </div>`;
}

// Update only the mirror's value nodes while the model box keeps focus -
// rebuilding the input would dismiss the native datalist dropdown
function refreshMirrorNodes(wb, buf, box) {
  const { model, hint } = benchModel(wb);
  const mirror = pure.envMirror(buf.text, { config: wb.mirrorConfig, model });
  if (!mirror.ok) return;
  for (const v of mirror.vars) {
    const el = box.querySelector(
      `[data-env="${CSS.escape(v.name)}"] .env-val`);
    if (!el) continue;
    el.classList.toggle("dim", !!(v.missing || v.synthetic));
    el.textContent = v.missing
      ? (v.name === "SMEVALS_MODEL" ? `(${hint})` : "(missing)")
      : v.value;
  }
}

function bindBenchRun(wb, buf, box) {
  const configSel = box.querySelector("#bench-config");
  if (configSel) configSel.addEventListener("change", () => {
    wb.mirrorConfig = configSel.value;
    renderContext(wb);
    document.getElementById("bench-config")?.focus();
  });
  const modelInput = box.querySelector("#bench-model");
  if (modelInput) modelInput.addEventListener("input", () => {
    wb.bench.model = modelInput.value;
    refreshMirrorNodes(wb, buf, box);
  });
  const go = box.querySelector("#bench-go");
  if (go) go.addEventListener("click", () => startRun(wb, buf));
  const gradeErr = box.querySelector('[data-grade-err="ctx"]');
  box.querySelectorAll("[data-grade]").forEach(el =>
    el.addEventListener("click", () =>
      doGrade(wb, el.dataset.run, el.dataset.grade, gradeErr, el)));
  bindFolds(wb, box);
  bindArtifacts(wb, box);
}

async function startRun(wb, buf) {
  wb.benchErr = null;
  try {
    const job = await api(`/api/evals/${enc(wb.slug)}/run`, {
      body: {
        task: fileStem(buf.path),
        config: wb.mirrorConfig,
        // blank falls back to the config's default; the server rejects
        // honestly when there is neither
        model: (wb.bench.model || "").trim() || null,
      },
    });
    if (state.wb !== wb) return;
    wb.job = job;
    renderContext(wb);
    pollJob(wb, job.id);
  } catch (ex) {
    if (state.wb !== wb) return;
    wb.benchErr = ex.message;
    renderContext(wb);
  }
}

async function pollJob(wb, jobId) {
  const active = () => state.wb === wb && wb.job && wb.job.id === jobId;
  let errStreak = 0;
  while (active() && (wb.job.status === "queued" || wb.job.status === "running")) {
    await new Promise(resolve => setTimeout(resolve, 400));
    if (!active()) return;
    try {
      const job = await api(`/api/jobs/${enc(jobId)}`);
      if (!active()) return;
      wb.job = job;
      errStreak = 0;
    } catch (ex) {
      // Tolerate one blip (a dropped fetch mid-poll) before giving up on a
      // job that may still be running server-side.
      errStreak++;
      if (errStreak >= 2) wb.job = { ...wb.job, status: "failed", error: ex.message };
    }
    renderContext(wb);
  }
  if (!active()) return;
  await ensureRuns(wb, true);
  if (!active()) return;
  renderBenchSurfaces(wb);
}

// --- context: dry-run controls (grader open in the editor) -----------------

function benchDryHtml(wb, buf) {
  let body;
  if (wb.runs === null) {
    body = `<div class="bench-hint">loading runs…</div>`;
    ensureRuns(wb).then(() => { if (state.wb === wb) renderContext(wb); });
  } else if (!wb.runs.length) {
    body = `
      <div class="ctx-note">
        <p>Dry-run grades an existing run with this editor's current text —
           unsaved edits included — and compares it with the saved grade,
           writing nothing.</p>
        <p>There are no runs yet. Open a task and use <b>Run this task</b>,
           or from a terminal: <code>smevals run . -t &lt;task&gt;</code>.</p>
      </div>`;
  } else {
    const sel = wb.drySel && wb.runs.some(r => r.run === wb.drySel)
      ? wb.drySel : wb.runs[0].run;
    body = `
      <div class="bench-form">
        <div class="bench-row">
          <label for="dry-pick">run</label>
          <select id="dry-pick">
            ${wb.runs.map(r => `
              <option value="${esc(r.run)}" ${r.run === sel ? "selected" : ""}>
                ${esc(r.task ?? "?")} · ${esc(r.config ?? "?")} ·
                ${esc(r.model ?? "?")} · ${r.started ? esc(ago(r.started)) : "?"}${
                  runOk(r) ? "" : " · FAILED"}</option>`).join("")}
          </select>
        </div>
        <div class="bench-actions">
          <button type="button" class="btn btn-sm btn-primary" id="dry-go"
                  ${wb.dryPending ? "disabled" : ""}>
            ${wb.dryPending ? "Dry-running…" : "Dry-run against this run"}</button>
        </div>
        <div class="bench-hint">Grades with the editor text as it is now —
          unsaved edits included. Nothing lands under runs/.</div>
        <div id="dry-err">${wb.dryErr ? errorBox(wb.dryErr) : ""}</div>
      </div>`;
  }
  return `
    <div class="ctx-act" id="bench-dry">
      <p class="ctx-eyebrow">Dry-run this grader</p>
      ${body}
    </div>`;
}

function bindBenchDry(wb, buf, box) {
  const pick = box.querySelector("#dry-pick");
  if (pick) pick.addEventListener("change", () => { wb.drySel = pick.value; });
  const go = box.querySelector("#dry-go");
  if (go) go.addEventListener("click", () => doDryrun(wb, buf));
}

async function doDryrun(wb, buf) {
  const pick = document.getElementById("dry-pick");
  const run = pick && pick.value;
  if (!run) return;
  wb.drySel = run;
  wb.dryErr = null;
  wb.dryPending = true;
  renderContext(wb);
  try {
    const result = await api(`/api/evals/${enc(wb.slug)}/dryrun`, {
      body: { run, grader_yaml: buf.text },
    });
    if (state.wb !== wb) return;
    wb.dry = { run, grader: fileStem(buf.path), result };
  } catch (ex) {
    if (state.wb !== wb) return;
    wb.dryErr = ex.message;
  }
  wb.dryPending = false;
  if (state.wb !== wb) return;
  if (wb.open === buf.path) renderEditor(wb);
  renderContext(wb);
  document.getElementById("dry-go")?.focus();
}

// --- dry-run comparison panel (under the grader editor) --------------------

function checkView(c) {
  if (!c || typeof c !== "object") return null;
  return {
    checker: typeof c.checker === "string" ? c.checker : "",
    status: c.skipped ? "skipped" : c.ok ? "ok" : "fail",
    score: c.score ?? null,
    notes: typeof c.notes === "string" ? c.notes : "",
    metrics: c.metrics && typeof c.metrics === "object" ? c.metrics : {},
    details: c.details && typeof c.details === "object" ? c.details : {},
    tags: Array.isArray(c.tags) ? c.tags : [],
  };
}

// details values may nest; scalars read bare, anything else as JSON
const detailValue = v =>
  v === null || ["string", "number", "boolean"].includes(typeof v)
    ? String(v) : JSON.stringify(v);

// One check as a comparison cell; when compared, values differing from
// the other side get the accent wash
function dryCellHtml(v, other, compared) {
  if (!v) return `<div class="dc dry-empty-cell">no check here</div>`;
  const chg = f => compared && (!other || other[f] !== v[f]) ? " chg" : "";
  // metrics and tags are structured, so difference is by value, not identity
  const chgDeep = f => compared
    && (!other || JSON.stringify(other[f]) !== JSON.stringify(v[f]))
    ? " chg" : "";
  const scoreHtml = v.score !== null
    ? `<span class="dc-score${chg("score")}">score ${esc(String(v.score))}</span>`
    : compared && other && other.score !== null
      ? `<span class="dc-score chg">unscored</span>` : "";
  return `
    <div class="dc">
      <div class="dc-head">
        <span class="dc-status ${esc(v.status)}${chg("status")}">${esc(v.status)}</span>
        <span class="dc-name${chg("checker")}">${esc(v.checker || "—")}</span>
        ${scoreHtml}
      </div>
      ${v.notes ? `<div class="dc-notes${chg("notes")}">${esc(v.notes)}</div>`
        : compared && other && other.notes
          ? `<div class="dc-notes chg">(no notes)</div>` : ""}
      ${Object.entries(v.metrics).map(([k, m]) => `
        <div class="dc-metric${chgDeep("metrics")}">
          <span class="k">${esc(k)}:</span> ${esc(String(m))}</div>`).join("")}
      ${Object.entries(v.details).map(([k, d]) => `
        <div class="dc-metric${chgDeep("details")}">
          <span class="k">${esc(k)}:</span> ${esc(detailValue(d))}</div>`).join("")}
      ${v.tags.length ? `<div class="dc-tags${chgDeep("tags")}">${
        esc(v.tags.map(t => "#" + t).join(" "))}</div>` : ""}
    </div>`;
}

const drySumHtml = (g, chg) => `
  <div class="dry-sum">
    <span class="${chg.score ? "chg" : ""}">score ${
      g.score == null ? "—" : esc(String(g.score))}</span>
    <span class="sep">·</span>
    <span class="outcome-${g.outcome === "pass" ? "pass" : "fail"}${
      chg.outcome ? " chg" : ""}">${esc(String(g.outcome))}</span>
  </div>`;

const dryTagsHtml = (tags, changed) => `
  <div class="dry-tags"><span class="${changed ? "chg" : ""}">${
    tags && tags.length ? esc(tags.map(t => "#" + t).join(" ")) : "no tags"}</span></div>`;

function dryPanelHtml(wb, buf) {
  if (!wb.dry || pure.docKind(buf.path) !== "grader") return "";
  const stem = fileStem(buf.path);
  if (wb.dry.grader !== stem) return "";
  const dry = wb.dry.result;
  const row = (wb.runs || []).find(r => r.run === wb.dry.run);
  const base = (row && row.grades && row.grades[stem]) || null;
  const baseChecks = (base ? base.checks || [] : []).map(checkView);
  const dryChecks = (dry.checks || []).map(checkView);
  const rows = [];
  for (let i = 0; i < Math.max(baseChecks.length, dryChecks.length); i++) {
    const b = baseChecks[i] || null;
    const d = dryChecks[i] || null;
    rows.push(`
      <div class="dry-row">
        ${base ? `<div class="dry-cell">${dryCellHtml(b, d, false)}</div>` : ""}
        <div class="dry-cell">${dryCellHtml(d, b, !!base)}</div>
      </div>`);
  }
  const changed = base ? {
    score: (base.score ?? null) !== (dry.score ?? null),
    outcome: base.outcome !== dry.outcome,
    tags: JSON.stringify(base.tags || []) !== JSON.stringify(dry.tags || []),
  } : { score: false, outcome: false, tags: false };
  return `
    <div class="dry-panel${base ? "" : " single"}" id="dry-panel">
      <div class="dry-head">
        <span class="ctx-eyebrow">Dry run · ${esc(wb.dry.run)}</span>
        <button type="button" class="btn-del" data-act="dryclose"
