                title="Close the dry-run panel">✕</button>
      </div>
      <div class="dry-row dry-labels">
        ${base ? `<div>saved grade${base.graded
          ? ` · ${esc(ago(base.graded))}` : ""}</div>` : ""}
        <div class="ours-label">your edit · dry run${
          dirty(buf) ? " · unsaved" : ""}</div>
      </div>
      ${rows.join("")}
      <div class="dry-row">
        ${base ? `<div class="dry-cell">${drySumHtml(base, {})}</div>` : ""}
        <div class="dry-cell">${drySumHtml(dry, changed)}</div>
      </div>
      <div class="dry-row">
        ${base ? `<div class="dry-cell">${dryTagsHtml(base.tags, false)}</div>` : ""}
        <div class="dry-cell">${dryTagsHtml(dry.tags, changed.tags)}</div>
      </div>
      ${base ? "" : `
        <p class="dry-note">This run has no saved grade from ${esc(stem)}
          yet, so there is nothing to compare against — this is the dry
          result alone. Grading the run from its page saves one.</p>`}
      ${dry.artifacts && dry.artifacts.length ? `
        <p class="dry-note">the checks would write:
          ${dry.artifacts.map(a => `<code>${esc(a)}</code>`).join(" ")}</p>` : ""}
    </div>`;
}

// --- compare surface (#/eval/<slug>/compare) --------------------------------
//
// Task 8, Jesse's direct feedback: "the results views don't provide a nice
// easy way to compare the various runs outputs visually on one screen" -
// the all-the-pelicans-on-one-screen view. One task, every run (or, per
// model when collapsed), as a contact-sheet grid; pin 2-4 for a full
// side-by-side panel. Rides the same /runs rows every other bench surface
// already fetches via ensureRuns (files + grade-workspace artifact names
// ride along) - no endpoint of its own.

// task: preselect a task on the Compare surface (falls back to the first
// task there); omit to keep whatever the surface last had picked
const compareHash = (wb, task) =>
  `#/eval/${enc(wb.slug)}/compare${task ? `?task=${enc(task)}` : ""}`;

// Ungraded/failed runs sort last under "score" - -Infinity, not 0, so a
// genuine 0 score still outranks "never graded"
const compareScore = (row, grader) => {
  const g = grader && (row.grades || {})[grader];
  return g && typeof g.score === "number" ? g.score : -Infinity;
};
const COMPARE_SORTS = {
  score: (rows, grader) => [...rows].sort((a, b) =>
    compareScore(b, grader) - compareScore(a, grader)),
  model: rows => [...rows].sort((a, b) =>
    String(a.model ?? "").localeCompare(String(b.model ?? ""))),
  newest: rows => [...rows].sort((a, b) =>
    String(b.started || "").localeCompare(String(a.started || ""))),
};

// The active sort, scoped to the picked task; collapsed to one card per
// model by keeping only the first row per model after sorting - so
// "best" falls out under score sort and "latest" falls out under newest,
// with no separate best/latest bookkeeping.
function compareRows(wb) {
  const rows = (wb.runs || []).filter(r => r.task === wb.compareTask);
  const sorted = (COMPARE_SORTS[wb.compareSort] || COMPARE_SORTS.score)(
    rows, wb.compareGrader);
  if (wb.compareAll) return sorted;
  const seen = new Set();
  return sorted.filter(r => {
    if (seen.has(r.model)) return false;
    seen.add(r.model);
    return true;
  });
}

// Representative visual precedence (the brief, verbatim): a grade
// workspace image (the active grader's) beats a run-dir image beats a
// clamped output.txt peek beats an honest empty state. Picks which of
// the row's already-known filenames to hand to the existing image/text
// machinery - never a forked artifact renderer.
function compareVisual(row, grader) {
  const g = grader && (row.grades || {})[grader];
  // the grader's own raster (render.png) is the picture the score was
  // computed from; a raw .svg only stands in when no raster sits beside it
  const gradeImgs = g ? (g.files || []).filter(f => IMAGE.test(f)) : [];
  const gradeImg = gradeImgs.find(f => !/\.svgz?$/i.test(f)) || gradeImgs[0];
  if (gradeImg) {
    return {
      kind: "image", name: gradeImg,
      rel: `runs/${row.run}/grades/${grader}/${gradeImg}`,
    };
  }
  const runImg = (row.files || []).find(f => IMAGE.test(f));
  if (runImg) return { kind: "image", name: runImg, rel: `runs/${row.run}/${runImg}` };
  if ((row.files || []).includes("output.txt")) {
    return { kind: "text", rel: `runs/${row.run}/output.txt` };
  }
  return { kind: "empty" };
}

const COMPARE_TEXT_LINES = 12;

function compareVisualHtml(wb, row, grader) {
  const visual = compareVisual(row, grader);
  if (visual.kind === "image") {
    const blob = ensureRawBlob(wb, visual.rel);
    return `
      <div class="cmp-vis">${
        blob === null ? `<div class="cmp-vis-wait">loading…</div>`
        : blob.err ? `<div class="cmp-vis-wait">couldn't load ${esc(visual.name)}</div>`
        : `<img class="cmp-vis-img" src="${esc(blob.url)}" alt="${esc(visual.name)}">`}
      </div>`;
  }
  if (visual.kind === "text") {
    const text = ensureFileText(wb, visual.rel);
    if (text === null) return `<div class="cmp-vis"><div class="cmp-vis-wait">loading…</div></div>`;
    const clamped = text.split("\n").slice(0, COMPARE_TEXT_LINES).join("\n");
    return `<div class="cmp-vis cmp-vis-text"><pre>${esc(clamped) || "(empty)"}</pre></div>`;
  }
  return `
    <div class="cmp-vis cmp-vis-empty">${
      runOk(row) ? "no output yet" : "run failed — no output to show"}</div>`;
}

function compareCardHtml(wb, row, grader) {
  const g = grader && (row.grades || {})[grader];
  const pinned = wb.pinned.has(row.run);
  const capped = !pinned && wb.pinned.size >= 4;
  // The pin control is a sibling of the run-detail link, not nested
  // inside it - a <button> can't nest inside an <a>, and this way the
  // browser's own click handling keeps them independent, no
  // stopPropagation bookkeeping needed.
  return `
    <div class="cmp-card${pinned ? " pinned" : ""}">
      <button type="button" class="cmp-pin" data-pin="${esc(row.run)}"
              aria-pressed="${pinned}" ${capped ? "disabled" : ""}
              title="${pinned ? "unpin" : capped ? "unpin one to pin another (4 max)" : "pin to compare"}">${
        pinned ? "pinned" : "pin"}</button>
      <a class="cmp-card-link" href="${runHash(wb, row.run)}">
        ${compareVisualHtml(wb, row, grader)}
        <div class="cmp-card-meta">
          <div class="cmp-card-model">${esc(row.model ?? "?")}</div>
          <div class="cmp-card-sub">
            ${g ? gradeChip(grader, g, true)
                : runOk(row) ? `<span class="rg-none">ungraded</span>`
                : `<span class="chip-grade fail">failed</span>`}
            <span class="cmp-card-when">${row.started ? esc(ago(row.started)) : "—"}</span>
          </div>
        </div>
      </a>
    </div>`;
}

// Pin 2-4 cards for a full side-by-side panel: complete outputs (image
// full-size + complete text, the run detail's own wrap/show-all
// ergonomics) via runBodyHtml - the same renderer the run detail uses,
// not a fork of it.
function comparePanelHtml(wb, grader) {
  const pinned = [...wb.pinned]
    .map(run => (wb.runs || []).find(r => r.run === run))
    .filter(Boolean);
  if (pinned.length < 2) return "";
  return `
    <div class="cmp-panel">
      <div class="cmp-panel-head">
        <span class="bench-hint">${esc(plural(pinned.length, "run"))} pinned</span>
        <button type="button" class="btn btn-sm btn-ghost" data-cmp-clear>clear</button>
      </div>
      <div class="cmp-cols">
        ${pinned.map(row => {
          const g = grader && (row.grades || {})[grader];
          const checks = g ? (g.checks || []) : [];
          const summary = checks.length
            ? `${checks.filter(c => c && c.ok).length}/${checks.length} checks passed` : "";
          return `
            <div class="cmp-col">
              <div class="cmp-col-head">
                <div class="cmp-card-model">${esc(row.model ?? "?")}</div>
                ${g ? gradeChip(grader, g, true)
                    : runOk(row) ? `<span class="rg-none">ungraded</span>`
                    : `<span class="chip-grade fail">failed</span>`}
                ${summary ? `<span class="cmp-col-sub">${esc(summary)}</span>` : ""}
                <button type="button" class="btn btn-sm btn-ghost"
                        data-unpin="${esc(row.run)}">unpin</button>
              </div>
              ${g && (g.files || []).length
                ? artifactsHtml(wb, row, `cmp:g:${row.run}`, `grades/${grader}/`, g.files)
                : ""}
              ${runBodyHtml(wb, row, `cmp:${row.run}`)}
            </div>`;
        }).join("")}
      </div>
    </div>`;
}

function compareHtml(wb, tasks, graders) {
  if (!tasks.length) {
    return `
      <div class="ed-head"><span class="ed-path">compare</span></div>
      <div class="ed-empty">
        <h3>No tasks yet</h3>
        <p>Compare puts one task's outputs from every run side by side -
           add a task under <code>tasks/</code> first.</p>
      </div>`;
  }
  const rows = compareRows(wb);
  const allRows = (wb.runs || []).filter(r => r.task === wb.compareTask);
  return `
    <div class="ed-head">
      <span class="ed-path">compare</span>
      <span class="ed-actions"><span class="bench-hint">${
        esc(plural(rows.length, "card"))}${
          !wb.compareAll && allRows.length !== rows.length
            ? ` (of ${allRows.length})` : ""}</span></span>
    </div>
    <div class="cmp-controls">
      <label class="bench-hint" for="cmp-task">task</label>
      <select id="cmp-task">
        ${tasks.map(t => `
          <option value="${esc(t)}" ${t === wb.compareTask ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select>
      <label class="bench-hint" for="cmp-grader">grader</label>
      <select id="cmp-grader" ${graders.length ? "" : "disabled"}>
        ${graders.length ? graders.map(g => `
          <option value="${esc(g)}" ${g === wb.compareGrader ? "selected" : ""}>${esc(g)}</option>`).join("")
          : `<option>none yet</option>`}
      </select>
      <label class="bench-hint" for="cmp-sort">sort</label>
      <select id="cmp-sort">
        <option value="score" ${wb.compareSort === "score" ? "selected" : ""}>score</option>
        <option value="model" ${wb.compareSort === "model" ? "selected" : ""}>model</option>
        <option value="newest" ${wb.compareSort === "newest" ? "selected" : ""}>newest</option>
      </select>
      <label class="cmp-toggle">
        <input type="checkbox" data-cmp-all ${wb.compareAll ? "checked" : ""}>
        show all runs
      </label>
    </div>
    ${comparePanelHtml(wb, wb.compareGrader)}
    ${wb.runsErr ? `<div class="ed-err">${errorBox(wb.runsErr)}</div>` : ""}
    ${rows.length ? `
      <div class="cmp-grid">${rows.map(row => compareCardHtml(wb, row, wb.compareGrader)).join("")}</div>`
      : wb.runsErr ? "" : `
      <div class="ed-empty">
        <h3>No runs yet for this task</h3>
        <p>Run <b>${esc(wb.compareTask)}</b> with a config to see its
           outputs here, side by side with every other run.</p>
      </div>`}`;
}

function renderComparePane(wb) {
  const box = document.getElementById("wb-editor");
  if (!box) return;
  if (wb.runs === null) {
    box.innerHTML = `<div class="ed-empty"><p>Loading runs…</p></div>`;
    ensureRuns(wb).then(() => { if (state.wb === wb) renderBenchSurfaces(wb); });
    return;
  }
  const tasks = taskNames(wb);
  if (!wb.compareTask || !tasks.includes(wb.compareTask)) wb.compareTask = tasks[0] || null;
  // pins are per-task; the select handler clears them, but the task can
  // also change underneath us via the URL (entry links, back/forward,
  // bookmarks) - another task's outputs must never render as this one's
  if (wb.pinnedTask !== wb.compareTask) {
    wb.pinned.clear();
    wb.pinnedTask = wb.compareTask;
  }
  const graders = graderNames(wb);
  if (!wb.compareGrader || !graders.includes(wb.compareGrader)) {
    wb.compareGrader = graders.includes("default") ? "default" : (graders[0] || null);
  }
  box.innerHTML = compareHtml(wb, tasks, graders);
  bindComparePane(wb, box);
}

function togglePin(wb, run) {
  if (wb.pinned.has(run)) wb.pinned.delete(run);
  else if (wb.pinned.size < 4) wb.pinned.add(run);
  renderComparePane(wb);
}

function bindComparePane(wb, box) {
  box.querySelector("#cmp-task")?.addEventListener("change", ev => {
    wb.pinned.clear();
    location.hash = compareHash(wb, ev.target.value);
  });
  box.querySelector("#cmp-grader")?.addEventListener("change", ev => {
    wb.compareGrader = ev.target.value;
    renderComparePane(wb);
  });
  box.querySelector("#cmp-sort")?.addEventListener("change", ev => {
    wb.compareSort = ev.target.value;
    renderComparePane(wb);
  });
  box.querySelector("[data-cmp-all]")?.addEventListener("change", ev => {
    wb.compareAll = ev.target.checked;
    renderComparePane(wb);
  });
  box.querySelectorAll("[data-pin]").forEach(el =>
    el.addEventListener("click", () => togglePin(wb, el.dataset.pin)));
  box.querySelectorAll("[data-unpin]").forEach(el =>

// --- results tab (#/eval/<slug>/results) -----------------------------------
//
// One eval's Results-tab document (site.eval_results via GET .../results):
// grader picker, leaderboard (config x model), tag shares, per-model metric
// blocks, and the excluded/ungraded/stale annotations as quiet badges -
// numbers only ever come from the API, this file just formats them.

const resultsHash = wb => `#/eval/${enc(wb.slug)}/results`;

async function loadEvalResults(wb, grader, force = false) {
  if (wb.results !== null && !force) return;
  try {
    const data = await api(`/api/evals/${enc(wb.slug)}/results${
      grader ? `?grader=${enc(grader)}` : ""}`);
    if (state.wb !== wb) return;
    wb.results = data;
    wb.resultsGrader = data.grader;
    wb.resultsErr = null;
  } catch (ex) {
    if (state.wb !== wb) return;
    wb.resultsErr = ex.message;
  }
}

// Competition ranking over groups already sorted mean-descending (site.py's
// order): a tie shares a rank, and the next distinct value skips ahead by
// the number of rows tied ahead of it (1, 1, 3 - never 1, 1, 2).
function competitionRanks(groups) {
  const ranks = [];
  let rank = 0;
  groups.forEach((g, i) => {
    if (i === 0 || g.mean !== groups[i - 1].mean) rank = i + 1;
    ranks.push(rank);
  });
  return ranks;
}

function leaderboardHtml(groups) {
  if (!groups.length) {
    return `<div class="lb-empty">No graded runs yet under this grader.</div>`;
  }
  const ranks = competitionRanks(groups);
  return groups.map((g, i) => `
    <button type="button" class="lb-row"
            data-config="${esc(g.config ?? "")}" data-model="${esc(g.model ?? "")}">
      <span class="lb-rank">${ranks[i]}</span>
      <span class="lb-mid">
        <div class="lb-name">${esc(g.model ?? "?")}
          <span class="lb-sub">(${esc(g.config ?? "?")})</span></div>
        <div class="lb-sub">${plural(g.n, "run")}${
          g.fail_count ? `, ${plural(g.fail_count, "fail")}` : ""} ·
          ${Math.round(g.pass_rate * 100)}% pass</div>
        <div class="lb-meter"><div style="width:${Math.round(g.pass_rate * 100)}%"></div></div>
      </span>
      <span class="lb-score">${esc(fmtMeanStderr(g.mean, g.stderr))}</span>
    </button>`).join("");
}

function tagSharesHtml(tags, total) {
  const entries = Object.entries(tags || {})
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (!entries.length) return `<div class="lb-empty">No tags recorded yet.</div>`;
  return entries.map(([tag, n]) => {
    const pct = total ? Math.round(n / total * 100) : 0;
    return `
      <button type="button" class="tagshare-row" data-tag="${esc(tag)}"
              title="${esc(`show runs tagged #${tag}`)}">
        <span class="tagshare-name">#${esc(tag)}</span>
        <span class="tagshare-bar"><div style="width:${pct}%"></div></span>
        <span class="tagshare-pct">${n}/${total} (${pct}%)</span>
      </button>`;
  }).join("");
}

function metricRowsHtml(metrics) {
  const keys = Object.keys(metrics || {}).sort();
  if (!keys.length) return `<div class="lb-empty">No metrics recorded.</div>`;
  return keys.map(key => {
    const m = metrics[key];
    const display = m.type === "bool"
      ? `${Math.round(m.true_rate * 100)}% true (n=${m.n})`
      : `${esc(fmtMeanStderr(m.mean, m.stderr))} (n=${m.n})`;
    return `<div class="metric-row"><span class="k">${esc(key)}</span><span class="v">${display}</span></div>`;
  }).join("");
}

function metricBlocksHtml(wb, groups) {
  if (!groups.length) return `<div class="lb-empty">No metrics recorded.</div>`;
  // model/config land here raw by design, not pre-escaped like most call
  // sites in this file - foldHtml esc()s both the label and the fold key
  // internally (see foldHtml above), so this stays safe under a hostile
  // model name without a second esc() here to go stale or double-escape.
  return groups.map(g => foldHtml(
    wb, `results:${wb.resultsGrader}:${g.config}:${g.model}`,
    `${g.model} (${g.config})`,
    `<div class="grade-checks">${metricRowsHtml(g.metrics)}</div>`, false)).join("");
}

function resultsBadgesHtml(r) {
  return `
    <div class="results-badges">
      <span class="chip-quiet" title="Failed runs are harness errors, not evidence, and never enter a mean">${
        esc(plural(r.excluded_failed, "run"))} excluded (failed)</span>
      <span class="chip-quiet" title="Non-failed runs with no grade yet from this grader">${
        esc(plural(r.ungraded, "run"))} ungraded</span>
      <span class="chip-quiet" title="Grades whose snapshot no longer matches this grader's current spec">${
        esc(plural(r.stale, "grade"))} stale</span>
    </div>`;
}

         counts non-failed runs this grader hasn't scored yet;
         <b>stale</b> counts grades whose snapshot no longer matches the

// --- global results matrix (#/results) --------------------------------------
//
// The executive summary (site.results_matrix via GET /api/results): models x
// evals, mean default-grader scores, best-per-eval highlighted, incomplete
// cells marked. Reuses loadEvals() for eval names (the matrix payload only
// carries slugs) - a formatting lookup, not an aggregation.

async function loadResultsMatrix(force = false) {
  if (state.resultsMatrix !== null && !force) return state.resultsMatrix;
  state.resultsMatrix = await api("/api/results");
  return state.resultsMatrix;
}

function matrixHtml(matrix, names) {
  if (!matrix.evals.length || !matrix.models.length) {
    return `
      <div class="card empty-shelf">
        <h2>No results yet</h2>
        <p>This matrix fills in once a model has at least one run recorded
           against an eval. Run a task from a workbench's bench panel, or
           from a terminal: <code>smevals run . -t &lt;task&gt;</code> —
           then come back.</p>
      </div>`;
  }
  const bestBySlug = {};
  for (const slug of matrix.evals) {
    let best = null;
    for (const model of matrix.models) {
      const cell = matrix.matrix[model]?.[slug];
      if (cell && cell.mean != null && (best === null || cell.mean > best)) best = cell.mean;
    }
    bestBySlug[slug] = best;
  }
  const incomplete = [];
  const rows = matrix.models.map(model => `
    <tr>
      <td>${esc(model)}</td>
      ${matrix.evals.map(slug => {
        const cell = matrix.matrix[model]?.[slug];
        if (!cell) return `<td class="empty">–</td>`;
        const isBest = cell.mean != null && cell.mean === bestBySlug[slug];
        if (cell.incomplete) {
          incomplete.push(`${model} · ${names[slug] || slug} (${cell.n}/${cell.target_n})`);
        }
        const title = cell.incomplete ? ` title="${esc(`${cell.n}/${cell.target_n} runs so far`)}"` : "";
        return `<td class="${isBest ? "best" : "mcell"}"${title}>${
          esc(fmtScore(cell.mean))}${cell.incomplete ? `<span class="matrix-mark">*</span>` : ""}</td>`;
      }).join("")}
    </tr>`).join("");
  return `
    <div class="card matrix-wrap">
      <table class="matrix">
        <thead><tr><th>model</th>${matrix.evals.map(slug =>
          `<th><a href="#/eval/${enc(slug)}/results">${esc(names[slug] || slug)}</a></th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${incomplete.length ? `
      <div class="matrix-foot">* incomplete (n/target): ${incomplete.map(esc).join(" · ")}</div>` : ""}`;
}

// Used by the poll ticker: re-fetches and swaps the table in place, without
// the "Loading…" reset a full renderResultsMatrix() would flash.
async function refreshResultsMatrix() {
  const slot = document.getElementById("results-matrix-slot");
  if (!slot) return;
  try {
    const [matrix, evals] = await Promise.all([
      loadResultsMatrix(true), loadEvals(true)]);
    const names = Object.fromEntries(evals.map(e => [e.slug, e.name]));
    slot.innerHTML = matrixHtml(matrix, names);
  } catch { /* keep showing the last good matrix on a transient blip */ }
}

async function renderResultsMatrix() {
  document.body.classList.remove("wb");
  view.innerHTML = `
    <div class="crumb"><a href="#/">← shelf</a></div>
    <h2 style="margin: 0 0 var(--sp-4); font-size: var(--fs-xl); font-weight: 650;
               letter-spacing: -0.02em">Results</h2>
    <div id="results-matrix-slot">Loading…</div>`;
  let matrix, evals;
  try {
    [matrix, evals] = await Promise.all([loadResultsMatrix(true), loadEvals()]);
  } catch (ex) {
    document.getElementById("results-matrix-slot").innerHTML = errorBox(ex.message);
    return;
  }
  const names = Object.fromEntries(evals.map(e => [e.slug, e.name]));
  document.getElementById("results-matrix-slot").innerHTML = matrixHtml(matrix, names);
}

// --- sweeps (#/sweep): compose form + live board -----------------------------
//
// One sweep at a time, server-side (POST /api/sweep -> a persistent job).
// The compose form previews its size via GET /api/sweep/plan and persists
// every change to localStorage, so a studio restart pre-fills it - and
// smevals' top-up semantics make re-starting cheap: already-recorded runs
// count, only the shortfall executes. The board renders ONLY from the
// sweep job's cell state, never from results data: a deferred-judge model
// has no grades until the final pass, so results-derived rendering would
// show it missing mid-sweep.

const SWEEP_COMPOSE_KEY = "smevals-sweep-compose";
// sweep.py's cell_key NUL separator. MUST stay this \u0000 escape,
// never a pasted literal: the HTML tokenizer mangles a raw NUL byte
// inside this inline <script> to U+FFFD, silently breaking every
// cell lookup.
const SWEEP_CELL_SEP = "\u0000";
const SWEEP_TREATMENTS = ["inline", "deferred", "skip"];

const sweepJobActive = job =>
  !!job && (job.status === "queued" || job.status === "running");

function sweepsState() {
  if (!state.sweeps) {
    state.sweeps = {
      job: null,       // the active-or-most-recent sweep job, or null
      compose: null,   // {evals, models, custom, n, graders} - localStorage-backed
      modelsDoc: null, // /api/models: {models, local}
      plan: null, planErr: null, err: null, posting: false,
    };
  }
  return state.sweeps;
}

function savedCompose() {
  try { return JSON.parse(localStorage.getItem(SWEEP_COMPOSE_KEY) || "null"); }
  catch { return null; }
}

function saveCompose(sw) {
  try { localStorage.setItem(SWEEP_COMPOSE_KEY, JSON.stringify(sw.compose)); }
  catch { /* private mode etc - the form still works, it just won't survive */ }
}

// The compose form's inputs: the shelf listing (eval names) and the model
// suggestions, plus the saved composition rehydrated against what exists now.
async function ensureComposeInputs(sw) {
  const [evals, modelsDoc] = await Promise.all([
    loadEvals(),
    sw.modelsDoc ? Promise.resolve(sw.modelsDoc) : api("/api/models"),
  ]);
  sw.modelsDoc = modelsDoc;
  if (!sw.compose) {
    const saved = savedCompose();
    const slugs = evals.map(e => e.slug);
    sw.compose = {
      evals: Array.isArray(saved?.evals)
        ? saved.evals.filter(s => slugs.includes(s)) : slugs,
      models: Array.isArray(saved?.models)
        ? saved.models.filter(m => typeof m === "string") : [],
      custom: Array.isArray(saved?.custom)
        ? saved.custom.filter(m => typeof m === "string") : [],
      n: Number.isInteger(saved?.n) && saved.n >= 1 ? saved.n : 5,
      graders: saved?.graders && typeof saved.graders === "object"
        ? saved.graders : {},
    };
  }
}

// --- the plan preview (shortfall + default grader treatments) ---------------

let sweepPlanSeq = 0;
let sweepPlanTimer = null;

function schedulePlan(sw) {
  clearTimeout(sweepPlanTimer);
  sweepPlanTimer = setTimeout(() => { fetchSweepPlan(sw); }, 300);
}

async function fetchSweepPlan(sw) {
  const c = sw.compose;
  const seq = ++sweepPlanSeq;
  // The plan endpoint 400s on an empty eval list - don't ask until there
  // is something to size (models may be empty: treatments still preview)
  if (!c.evals.length || !Number.isInteger(c.n) || c.n < 1) {
    sw.plan = null;
    sw.planErr = null;
    renderComposeDerived(sw);
    return;
  }
  // One repeated query param per value: enc() encodes a literal comma in
  // a free-text model name and a would-be separator identically, so a
  // joined CSV here would inflate the server's shortfall preview
  const query = [
    ...c.evals.map(s => `evals=${enc(s)}`),
    ...c.models.map(m => `models=${enc(m)}`),
    `n=${c.n}`,
  ].join("&");
  try {
    const plan = await api(`/api/sweep/plan?${query}`);
    if (seq !== sweepPlanSeq) return;
    sw.plan = plan;
    sw.planErr = null;
  } catch (ex) {
    if (seq !== sweepPlanSeq) return;
    sw.plan = null;
    sw.planErr = ex.message;
  }
  renderComposeDerived(sw);
}

// The treatment table shown (and POSTed): the plan's defaults (judge-
// pattern graders arrive pre-set to deferred) with the author's saved
// overrides on top; stale grader names in old saved state drop out here.
function mergedTreatments(sw) {
  const out = {};
  for (const [slug, defaults] of Object.entries(sw.plan?.graders || {})) {
    out[slug] = {};
    for (const [name, treatment] of Object.entries(defaults)) {
      const saved = sw.compose.graders?.[slug]?.[name];
      out[slug][name] = SWEEP_TREATMENTS.includes(saved) ? saved : treatment;
    }
  }
  return out;
}

const planShortfall = plan =>
  Object.values(plan.cells || {}).reduce((a, c) => a + (c.remaining || 0), 0);

// --- compose form -----------------------------------------------------------

const evalDisplayName = slug =>
  (state.evals || []).find(e => e.slug === slug)?.name || slug;

const sweepIntroHtml = () => `
  <div class="card empty-shelf" style="margin: 0 0 var(--sp-5)">
    <h2>Run the whole matrix</h2>
    <p>A sweep runs every eval × model pair you pick up to a target of n
       runs per task, grading as it goes: deterministic graders inline
       after each run, judge graders in one deferred pass at the end so

       are loaded locally, one at a time; anything else is treated as
       hosted.</p>
    <p>Sweeps run one at a time, right here in the studio, and results

  </div>`;

function composeHtml(sw) {

  const evals = state.evals || [];
  const local = new Set(sw.modelsDoc?.local || []);

  const options =

    <div class="sw-cols">

        <div class="sw-label">Evals</div>
        <div class="sw-pick" id="sw-evals">
          ${evals.length ? evals.map(e => `
            <label class="sw-item">
              <input type="checkbox" data-eval="${esc(e.slug)}"
                     ${c.evals.includes(e.slug) ? "checked" : ""}>
              <span class="sw-name">${esc(e.name)}</span>
            </label>`).join("")
            : `<div class="tree-empty">no evals yet — create one on
               <a href="#/">the shelf</a></div>`}
        </div>
      </div>
      <div>
        <div class="sw-label">Models</div>
        <div class="sw-pick" id="sw-models">
          ${options.length ? options.map(m => `
            <label class="sw-item">
              <input type="checkbox" data-model="${esc(m)}"
                     ${c.models.includes(m) ? "checked" : ""}>
              <span class="sw-name">${esc(m)}</span>
              ${local.has(m)
                ? `<span class="chip-quiet">local · LM Studio</span>` : ""}
            </label>`).join("")
            : `<div class="tree-empty">none suggested — add one below</div>`}
        </div>
        <div class="add-key">
          <input id="sw-model-add" placeholder="add a model id…"
                 spellcheck="false" autocomplete="off" aria-label="Add a model">
          <button type="button" class="btn btn-sm btn-ghost"
                  id="sw-model-add-go">Add</button>
        </div>
      </div>
    </div>
    <div class="sw-row">
      <label class="sw-label" style="margin: 0" for="sw-n">
        Target runs per task × model</label>
      <input id="sw-n" type="number" min="1" step="1" inputmode="numeric"
             value="${esc(String(c.n))}">
    </div>
    <div id="sw-treatments"></div>
    <div id="sw-preview"></div>
    <div class="bench-actions" style="margin-top: var(--sp-3)">
      <button type="button" class="btn btn-primary" id="sw-start" disabled>
        Start sweep</button>
      <span class="sw-hint">already-recorded runs count — starting again only
        runs the shortfall</span>
    </div>
    <div id="sw-err">${sw.err ? errorBox(sw.err) : ""}</div>`;
}

function treatmentsHtml(sw) {
  if (sw.planErr) return errorBox(sw.planErr);
  const treatments = mergedTreatments(sw);
  const rows = Object.entries(treatments).flatMap(([slug, graders]) =>
    Object.entries(graders).map(([name, treatment]) => `
      <div class="sw-treat-row">
        <span class="sw-treat-eval">${esc(evalDisplayName(slug))}</span>
        <span class="sw-treat-name">${esc(name)}</span>
        <select data-t-eval="${esc(slug)}" data-t-grader="${esc(name)}"
                aria-label="Treatment for ${esc(slug)} / ${esc(name)}">
          ${SWEEP_TREATMENTS.map(t => `
            <option value="${t}" ${t === treatment ? "selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>`));
  if (!rows.length) return "";
  return `
    <div class="sw-label" style="margin-top: var(--sp-4)">Grader treatments</div>
    <div class="sw-hint" style="margin-bottom: var(--sp-1)">inline grades
      after every run; deferred graders run once at the end (judge graders
      arrive pre-set to deferred, so their judge model loads once); skip
      records nothing.</div>
    ${rows.join("")}`;
}

function previewHtml(sw) {
  const c = sw.compose;
  if (!c.evals.length) return `<div class="sw-hint" style="margin-top: var(--sp-3)">pick at least one eval</div>`;
  if (!Number.isInteger(c.n) || c.n < 1) return `<div class="sw-hint" style="margin-top: var(--sp-3)">n must be a whole number ≥ 1</div>`;
  if (!c.models.length) return `<div class="sw-hint" style="margin-top: var(--sp-3)">pick at least one model</div>`;
  if (!sw.plan) return sw.planErr ? "" : `<div class="sw-hint" style="margin-top: var(--sp-3)">sizing the sweep…</div>`;
  const remaining = planShortfall(sw.plan);
  const have = Object.values(sw.plan.cells || {})
    .reduce((a, cell) => a + (cell.have || 0), 0);
  return `
    <div class="sw-preview">this sweep will execute ~${esc(plural(remaining, "run"))}${
      have ? `<span class="sw-hint">(${have} already recorded)</span>` : ""}</div>`;
}

// The parts of the compose form a plan/selection change redraws - never
// the whole form, so checkboxes and the n input keep focus mid-edit.
function renderComposeDerived(sw) {
  const treat = document.getElementById("sw-treatments");
  const preview = document.getElementById("sw-preview");
  if (!treat || !preview) return;
  treat.innerHTML = treatmentsHtml(sw);
  preview.innerHTML = previewHtml(sw);
  const c = sw.compose;
  const start = document.getElementById("sw-start");
  if (start) {
    start.disabled = sw.posting || !c.evals.length || !c.models.length
      || !Number.isInteger(c.n) || c.n < 1;
  }
}

function bindCompose(sw, slot) {
  const box = slot.querySelector("#sweep-compose");
  if (!box) return;
  const changed = (resize = true) => {
    saveCompose(sw);
    renderComposeDerived(sw);
    if (resize) schedulePlan(sw);
  };
  box.addEventListener("change", event => {
    const el = event.target;
    if (el.dataset.eval !== undefined) {
      const picked = new Set(sw.compose.evals);
      el.checked ? picked.add(el.dataset.eval) : picked.delete(el.dataset.eval);
      sw.compose.evals =
        (state.evals || []).map(e => e.slug).filter(s => picked.has(s));
      changed();
    } else if (el.dataset.model !== undefined) {
      const picked = new Set(sw.compose.models);
      el.checked ? picked.add(el.dataset.model) : picked.delete(el.dataset.model);
      sw.compose.models = [...picked];
      changed();
    } else if (el.dataset.tEval !== undefined) {
      (sw.compose.graders[el.dataset.tEval] ??= {})[el.dataset.tGrader] = el.value;
      changed(false); // treatments never change the shortfall
    }
  });
  box.querySelector("#sw-n").addEventListener("input", event => {
    const v = event.target.value.trim();
    sw.compose.n = /^\d+$/.test(v) ? parseInt(v, 10) : 0;
    changed();
  });
  const addModel = () => {
    const input = box.querySelector("#sw-model-add");
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (!sw.compose.models.includes(name)) sw.compose.models.push(name);
    if (!sw.compose.custom.includes(name)) sw.compose.custom.push(name);
    saveCompose(sw);
    renderSweepSlot(sw); // the model list itself changed shape
  };
  box.querySelector("#sw-model-add-go").addEventListener("click", addModel);
  box.querySelector("#sw-model-add").addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); addModel(); }
  });
  box.querySelector("#sw-start").addEventListener("click", () => startSweep(sw));
}

async function startSweep(sw) {
  const c = sw.compose;
  sw.err = null;
  sw.posting = true;
  renderComposeDerived(sw);
  try {
    const job = await api("/api/sweep", {
      body: {
        evals: c.evals, models: c.models, n: c.n,
        // without a plan (it errored) the server's defaults apply
        ...(sw.plan ? { graders: mergedTreatments(sw) } : {}),
      },
    });
    sw.posting = false;
    sw.job = job;
    state.sweepActive = true;
    renderSweepSlot(sw);
    startSweepPoll();
  } catch (ex) {
    sw.posting = false;
    if (/already running/.test(ex.message)) {
      // The 409: someone (another tab) started one - show its board
      renderSweep();
      return;
    }
    sw.err = ex.message;
    const errSlot = document.getElementById("sw-err");
    if (errSlot) errSlot.innerHTML = errorBox(ex.message);
    renderComposeDerived(sw);
  }
}

// --- the live board ---------------------------------------------------------

// Cell states colored strictly by token semantics: accent = actively
// being worked, pass/fail = outcomes, neutral for queued. A cancelled
// (or crashed) job can leave a cell mid-state; a spinner that never
// stops would lie, so a finished job renders those cells as "stopped".
const SWEEP_CELL_STATES = {
  queued: ["st-queued", "queued"],
  loading: ["st-active", "loading model"],
  running: ["st-active", "running"],
  grading: ["st-active", "grading"],
  done: ["st-done", "done"],
  failed: ["st-failed", "failed"],
};

function sweepCellHtml(cell, active) {
  let [cls, label] = SWEEP_CELL_STATES[cell.state] || ["st-queued", cell.state || "?"];
  if (!active && (cls === "st-active" || cell.state === "queued")) {
    [cls, label] = ["st-stopped", cell.state === "queued" ? "not run" : "stopped"];
  }
  const spin = active && cls === "st-active" ? `<span class="spin"></span>` : "";
  return `
    <td><div class="sw-cell ${cls}">
      <span class="sw-state">${spin}${esc(label)}</span>
      <span class="sw-have">${cell.have ?? 0}/${cell.target ?? 0}</span>
      <div class="sw-sub">
        <span title="mean so far, default grader">${
          cell.mean == null ? "–" : esc(fmtScore(cell.mean))}</span>
        ${cell.failed ? `<span class="sw-failn">${
          esc(plural(cell.failed, "fail"))}</span>` : ""}
      </div>
    </div></td>`;
}

const stateChipHtml = (label, tone, spinning) => `
  <span class="chip-state${tone ? " " + tone : ""}">${
    spinning ? `<span class="spin"></span>` : ""}${esc(label)}</span>`;

const SWEEP_JOB_CHIPS = {
  queued: ["", true], running: ["accent", true],
  done: ["pass", false], cancelled: ["", false], failed: ["fail", false],
};

function sweepBoardHtml(sw) {
  const job = sw.job;
  const active = sweepJobActive(job);
  const spec = job.spec;
  const [tone, spinning] = SWEEP_JOB_CHIPS[job.status] || ["", false];
  const deferredChip = d => {
    if (d.state === "done") return stateChipHtml("done", "pass", false);
    if (d.state === "failed") return stateChipHtml("failed", "fail", false);
    if (d.state === "running" && active) return stateChipHtml("running", "accent", true);
    return stateChipHtml(active ? "queued" : "not run", "", false);
  };
  return `
    <div class="sw-board-head">
      ${stateChipHtml(job.status, tone, spinning)}
      <span class="sw-spec">${esc(plural(spec.evals.length, "eval"))} ×
        ${esc(plural(spec.models.length, "model"))} · n=${spec.n}
        · started ${esc(ago(job.started))}</span>
      ${active ? `
        <span class="sw-cancel">
          <button type="button" class="btn btn-sm btn-ghost" id="sw-cancel"
                  ${job.cancel_requested ? "disabled" : ""}>
            ${job.cancel_requested ? "Cancelling…" : "Cancel sweep"}</button>
          <span class="sw-hint">stops after the current run — never kills a
            runner mid-run</span>
        </span>` : ""}
    </div>
    ${job.status === "failed" ? errorBox(job.error || "the sweep failed") : ""}
    <div id="sw-board-err"></div>
    <div class="card matrix-wrap">
      <table class="matrix sw-board">
        <thead><tr><th>model</th>${spec.evals.map(slug => `
          <th><a href="#/eval/${enc(slug)}/results">${
            esc(evalDisplayName(slug))}</a></th>`).join("")}</tr></thead>
        <tbody>${spec.models.map(model => `
          <tr>
            <td>${esc(model)}</td>
            ${spec.evals.map(slug => sweepCellHtml(
              job.cells[slug + SWEEP_CELL_SEP + model] || {}, active)).join("")}
          </tr>`).join("")}</tbody>
      </table>
    </div>
    ${active ? `
      <div class="sw-current">
        <span class="spin"></span>
        ${job.cancel_requested
          ? `cancelling — finishing the current run`
          : job.current
            ? `running <b>${esc(job.current.eval)}</b> /
               <b>${esc(job.current.model)}</b> / <b>${esc(job.current.task)}</b>`
            : `between runs…`}
      </div>` : ""}
    <div class="env-block job-log sw-log" style="margin-top: ${
      active ? "0" : "var(--sp-4)"}">${
      (job.log || []).length
        ? job.log.slice(-40).map(l => `<div class="log-line">${esc(l)}</div>`).join("")
        : `<div class="log-line dim">waiting for the first run…</div>`}</div>
    ${(job.deferred || []).length ? `
      <div class="sw-section-h">Deferred grading</div>
      ${job.deferred.map(d => `
        <div class="sw-def-row">
          <span class="sw-def-name">${esc(evalDisplayName(d.eval))} /
            ${esc(d.grader)}</span>
          ${deferredChip(d)}
        </div>`).join("")}` : ""}`;
}

function bindBoard(sw, slot) {
  const cancel = slot.querySelector("#sw-cancel");
  if (cancel) cancel.addEventListener("click", async () => {
    cancel.disabled = true;
    cancel.textContent = "Cancelling…";
    try {
      sw.job = await api("/api/sweep/cancel", { body: {} });
      renderBoardInPlace(sw);
    } catch (ex) {
      const errSlot = document.getElementById("sw-board-err");
      if (errSlot) errSlot.innerHTML = errorBox(ex.message);
    }
  });
}

// The ~1s board refresh: full markup swap (the board is pure job state),
// with focus put back by id so Cancel stays reachable by keyboard. The
// log tail pins to its bottom like a terminal would.
function renderBoardInPlace(sw) {
  const slot = document.getElementById("sweep-slot");
  if (!slot) return;
  const focusId = document.activeElement?.id;
  slot.innerHTML = sweepBoardHtml(sw);
  bindBoard(sw, slot);
  if (focusId) document.getElementById(focusId)?.focus();
  const log = slot.querySelector(".sw-log");
  if (log) log.scrollTop = log.scrollHeight;
}

// The #/sweep page body: the live board while a sweep runs; otherwise the
// compose form (pre-filled from localStorage), with the last sweep's
// board kept below it as the record of what just happened.
async function renderSweepSlot(sw) {
  const slot = document.getElementById("sweep-slot");
  if (!slot) return;
  if (sweepJobActive(sw.job)) {
    renderBoardInPlace(sw);
    return;
  }
  await ensureComposeInputs(sw);
  if (!document.getElementById("sweep-slot")) return; // navigated away
  slot.innerHTML = `
    ${sw.job ? "" : sweepIntroHtml()}
    <div class="card sweep-compose" id="sweep-compose">${composeHtml(sw)}</div>
    ${sw.job ? `<div class="sw-section-h">Last sweep</div>${sweepBoardHtml(sw)}` : ""}`;
  bindCompose(sw, slot);
  bindBoard(sw, slot);
  fetchSweepPlan(sw);
}

async function renderSweep() {
  document.body.classList.remove("wb");
  view.innerHTML = `
    <div class="crumb"><a href="#/">← shelf</a></div>
    <h2 style="margin: 0 0 var(--sp-4); font-size: var(--fs-xl); font-weight: 650;
               letter-spacing: -0.02em">Sweeps</h2>
    <div id="sweep-slot">Loading…</div>`;
  const sw = sweepsState();
  try {
    const doc = await api("/api/sweep");
    sw.job = doc.active === false ? null : doc;
  } catch (ex) {
    const slot = document.getElementById("sweep-slot");
    if (slot) slot.innerHTML = errorBox("Couldn't reach the sweep API: " + ex.message);
    return;
  }
  state.sweepActive = sweepJobActive(sw.job);
  await renderSweepSlot(sw);
  if (state.sweepActive) startSweepPoll();
}

// --- the sweep poll loop ----------------------------------------------------
//
// Polls /api/sweep ~1s while a sweep is active - wherever the user is.
// It keeps state.sweepActive true, so the results ticker below re-fetches
// whichever results surface is open and results land live mid-sweep; the
// board itself refreshes when #/sweep is showing. Token-guarded so there
// is only ever one loop.

let sweepPollToken = 0;

function startSweepPoll() {
  const token = ++sweepPollToken;
  (async () => {
    let errStreak = 0;
    while (token === sweepPollToken) {
      await new Promise(resolve => setTimeout(resolve, 1000));
      if (token !== sweepPollToken) return;
      const sw = sweepsState();
      let doc;
      try {
        doc = await api("/api/sweep");
        errStreak = 0;
      } catch {
        // Tolerate transient blips; a server that stays gone stops the loop
        if (++errStreak >= 3) break;
        continue;
      }
      if (token !== sweepPollToken) return;
      sw.job = doc.active === false ? null : doc;
      const active = sweepJobActive(sw.job);
      state.sweepActive = active;
      if (document.getElementById("sweep-slot")) renderSweepSlot(sw);
      if (!active) {
        // One last refresh so the final grades land without waiting a tick
        refreshVisibleResults();
        return;
      }
    }
    state.sweepActive = false;
  })();
}

// On boot: one look at /api/sweep, so a page reload mid-sweep livens the
// ticker and the board again without requiring a visit to #/sweep first.
async function syncSweepOnBoot() {
  try {
    const doc = await api("/api/sweep");
    if (doc.active === false || !sweepJobActive(doc)) return;
    sweepsState().job = doc;
    state.sweepActive = true;
    startSweepPoll();
  } catch { /* the sweep view will report on visit */ }
}

// --- live poll ticker --------------------------------------------------------
//
// Live like serve: while a sweep job is active, re-fetch whichever results
// surface is visible (the per-eval tab, the global matrix, or the shelf's
// results strips) every ~3s. Gated on state.sweepActive, which the sweep
// poll loop above maintains.

let pollTickBusy = false;

async function refreshVisibleResults() {
  if (pollTickBusy) return;
  pollTickBusy = true;
  try {
    if (state.wb && state.wb.surface && state.wb.surface.results) {
      const wb = state.wb;
      await loadEvalResults(wb, wb.resultsGrader, true);
      if (state.wb === wb) renderResultsPane(wb);
    } else if (document.getElementById("results-matrix-slot")) {
      await refreshResultsMatrix();
    } else if (!state.wb && document.querySelector(".shelf-grid")
        && !document.querySelector("form.new-eval")) {
      await refreshShelfInPlace();
    }
  } finally {
    pollTickBusy = false;
  }
}

function pollResultsTick() {
  if (state.sweepActive) refreshVisibleResults();
}

setInterval(pollResultsTick, 3000);

// --- global editor keys + unload guard -----------------------------------

document.addEventListener("keydown", event => {
  if ((event.metaKey || event.ctrlKey) && !event.altKey
      && event.key.toLowerCase() === "s") {
    if (state.wb && state.wb.open) {
      event.preventDefault();
      saveOpen(state.wb);
    }
    return;
  }
  if (event.key === "Escape") {
    // Closes whichever dismissable panel is open, in priority order: the
    // "new eval" form (shelf or empty-shelf), then a dry-run result panel.
    const cancel = document.querySelector("form.new-eval [data-cancel]");
    const dryClose = document.querySelector("[data-act=dryclose]");
    if (cancel) cancel.click();
    else if (dryClose) dryClose.click();
  }
});

window.addEventListener("beforeunload", event => {
  if (anyDirty()) {
    event.preventDefault();
    event.returnValue = "";
  }
});

// --- router --------------------------------------------------------------

function route() {
  const hash = location.hash || "#/";
  const [hashPath, hashQuery] = hash.split("?");
  if (hashPath === "#/results") {
    stashWorkbench();
    state.wb = null;
    document.body.classList.remove("wb");
    return renderResultsMatrix();
  }
  if (hashPath === "#/sweep") {
    stashWorkbench();
    state.wb = null;
    document.body.classList.remove("wb");
    return renderSweep();
  }
  const m = hashPath.match(
    /^#\/eval\/([^/]+)(?:\/f\/([^/]+?)(\/raw)?|(\/runs)(?:\/([^/]+))?|(\/results)|(\/compare))?$/);
  document.body.classList.toggle("wb", !!m);
  if (m) {
    const slug = decodeURIComponent(m[1]);
    if (m[6]) {
      return renderWorkbench(slug, { results: true });
    }
    if (m[7]) {
      const params = new URLSearchParams(hashQuery || "");
      return renderWorkbench(slug,
        { compare: true, task: params.get("task") || null });
    }
    if (m[4]) {
      const params = new URLSearchParams(hashQuery || "");
      const filter = {};
      for (const key of FILTER_KEYS) {
        if (params.get(key)) filter[key] = params.get(key);
      }
      return renderWorkbench(slug, {
        runs: true,
        run: m[5] ? decodeURIComponent(m[5]) : null,
        filter: Object.keys(filter).length ? filter : null,
      });
    }
    return renderWorkbench(slug,
      { file: m[2] ? decodeURIComponent(m[2]) : null, raw: !!m[3] });
  }
  stashWorkbench();
  state.wb = null;
  return renderShelf();
}

window.addEventListener("hashchange", route);
route();
syncSweepOnBoot();
</script>
</body>
