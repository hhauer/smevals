    hint: model ? `from configs/${name}.yaml` : `configs/${name}.yaml has no model — pass -m`,
  };
}

function renderTaskMirror(wb, buf, box) {
  const configs = configNames(wb);
  const { model, hint } = mirrorModel(wb);
  const mirror = pure.envMirror(buf.text, { config: wb.mirrorConfig, model });
  box.innerHTML = `
    <p class="ctx-eyebrow">What the Runner receives</p>
    <p class="ctx-sub">live process environment · follows your edits</p>
    ${configs.length ? `
      <div class="ctx-config-pick">
        <label for="ctx-config">config</label>
        <select id="ctx-config">
          ${configs.map(c => `
            <option value="${esc(c)}" ${c === wb.mirrorConfig ? "selected" : ""}>
              ${esc(c)}</option>`).join("")}
        </select>
      </div>` : ""}
    <div class="env-block">
      ${mirror.ok ? mirror.vars.map(v => `
        <div class="env-var">
          <span class="env-name">${esc(v.name)}</span>
          <div class="env-val${v.missing || v.synthetic ? " dim" : ""}">${
            v.missing
              ? esc(v.name === "SMEVALS_MODEL" ? `(${hint})` : "(missing)")
              : esc(v.value)}</div>
        </div>`).join("")
      : `<div class="env-err">The mirror is waiting for valid YAML —
           <b>${esc(mirror.error)}</b></div>`}
    </div>
    <div class="ctx-note" style="margin-top: var(--sp-3)">
      <p>This is the exact environment <code>smevals run</code> hands your
         Runner subprocess. Add any scalar key to the task and it appears
         here as <code>SMEVALS_TASK_&lt;KEY&gt;</code>.</p>
    </div>`;
  const pick = document.getElementById("ctx-config");
  if (pick) pick.addEventListener("change", () => {
    wb.mirrorConfig = pick.value;
    renderContext(wb);
  });
}

const PIPE_STATUS = {
  builtin: ["st-ok", "built-in checker"],
  ok: ["st-ok", "executable"],
  "not-executable": ["st-warn", "found, but not executable"],
  "not-found": ["st-bad", "no such file"],
  outside: ["st-bad", "path escapes the eval"],
  missing: ["st-bad", "no checker set"],
  invalid: ["st-bad", "not a map"],
};

const pipeValue = v => {
  if (v === null) return "";
  if (Array.isArray(v)) return v.map(pipeValue).join(", ");
  if (typeof v === "object") return "{…}";
  const s = String(v);
  const first = s.split("\n")[0];
  return first === s ? s : first + " ⋯";
};

function renderGraderPipeline(wb, buf, box) {
  const pipe = pure.pipeline(buf.text, flatFiles(wb));
  if (!pipe.ok) {
    box.innerHTML = `
      <p class="ctx-eyebrow">Check pipeline</p>
      <p class="ctx-sub">what smevals grade runs, in order</p>
      <div class="env-block"><div class="env-err">The pipeline is waiting
        for valid YAML — <b>${esc(pipe.error)}</b></div></div>`;
    return;
  }
  box.innerHTML = `
    <p class="ctx-eyebrow">Check pipeline</p>
    <p class="ctx-sub">what smevals grade runs, in order</p>
    <div class="pipe">
      ${pipe.steps.length ? pipe.steps.map(step => {
        const [cls, label] = PIPE_STATUS[step.status];
        return `
          <div class="pipe-step">
            <span class="pipe-n">${step.index + 1}</span>
            <div class="pipe-checker">${esc(step.checker || "—")}</div>
            <div class="pipe-status ${cls}"><span class="st-dot"></span>
              ${esc(label)}${step.required ? " · required — failure halts the pipeline" : ""}</div>
            ${Object.keys(step.config).length ? `
              <div class="pipe-conf">
                ${Object.entries(step.config).map(([k, v]) => `
                  <div><span class="k">${esc(k)}:</span> ${esc(pipeValue(v))}</div>`).join("")}
              </div>` : ""}
          </div>`;
      }).join("") : `<div class="ctx-note"><p>No checks yet — add one in the
        form view and it appears here.</p></div>`}
    </div>
    <div class="pipe-foot">
      A grade passes when every check succeeds${pipe.threshold !== null
        ? `, and the checks' final score reaches
           ${esc(String(pipe.threshold))}` : ""}.
    </div>`;
}

function renderConfigContext(wb, buf, box) {
  const parsed = pure.yamlParse(buf.text);
  const doc = parsed.ok && parsed.doc && typeof parsed.doc === "object"
    ? parsed.doc : {};
  const runner = typeof doc.runner === "string" ? doc.runner : "";
  const resolved = runner ? pure.resolveRel("configs", runner) : null;
  const entry = resolved
    ? flatFiles(wb).find(f => f.path === resolved) : null;
  const status = !runner ? ["st-bad", "no runner set"]
    : !resolved ? ["st-bad", "path escapes the eval"]
    : !entry ? ["st-bad", "no such file"]
    : entry.executable ? ["st-ok", "executable"]
    : ["st-warn", "found, but not executable"];
  box.innerHTML = `
    <p class="ctx-eyebrow">Config</p>
    <p class="ctx-sub">picked with -c ${esc(doc.name || "…")}</p>
    <div class="pipe">
      <div class="pipe-step">
        <span class="pipe-n">R</span>
        <div class="pipe-checker">${esc(runner || "—")}</div>
        <div class="pipe-status ${status[0]}"><span class="st-dot"></span>
          ${esc(status[1])}</div>
      </div>
      <div class="pipe-step">
        <span class="pipe-n">M</span>
        <div class="pipe-checker">${esc(doc.model || "no default model")}</div>
        <div class="pipe-status"><span></span>
          ${doc.model ? "used when -m is omitted" : "every run must pass -m"}</div>
      </div>
    </div>
    <div class="ctx-note" style="margin-top: var(--sp-3)">
      <p>The runner is an executable, resolved relative to this file. It
         receives the task as SMEVALS_* environment variables — open a task
         to see them.</p>
    </div>`;
}

// --- global editor keys + unload guard -----------------------------------

document.addEventListener("keydown", event => {
  if ((event.metaKey || event.ctrlKey) && !event.altKey
      && event.key.toLowerCase() === "s") {
    if (state.wb && state.wb.open) {
      event.preventDefault();
      saveOpen(state.wb);
    }
  }
});

window.addEventListener("beforeunload", event => {
  if (anyDirty()) {
    event.preventDefault();
    event.returnValue = "";
  }
});

// --- router --------------------------------------------------------------

function route() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/eval\/([^/]+)(?:\/f\/([^/]+?)(\/raw)?)?$/);
  document.body.classList.toggle("wb", !!m);
  if (m) {
    return renderWorkbench(
      decodeURIComponent(m[1]),
      m[2] ? decodeURIComponent(m[2]) : null,
      !!m[3]);
  }
  state.wb = null;
  return renderShelf();
}

window.addEventListener("hashchange", route);
route();
</script>
