<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>smevals studio</title>
<style>
/* ---- design tokens -----------------------------------------------------
   Every Studio surface draws from these custom properties. One accent hue
   (iris); green/red are semantic and reserved for pass/fail; amber is the
   problems/warning voice. Both color schemes are first-class. */
:root {
  --bg: #f4f5f7;
  --bg-dot: #e3e5ec;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --text: #1a1d23;
  --text-2: #5b6472;
  --text-3: #8b93a1;
  --line: #e3e5eb;
  --line-strong: #c8cdd8;
  --accent: #4d55cc;
  --accent-contrast: #ffffff;
  --accent-soft: rgba(77, 85, 204, 0.09);
  --warn: #8a5a00;
  --warn-bg: #f7ecd2;
  --pass: #1a7f45;
  --fail: #c03d3d;
  --shadow: 0 1px 2px rgba(20, 22, 28, 0.04), 0 4px 14px rgba(20, 22, 28, 0.05);
  --shadow-lift: 0 2px 4px rgba(20, 22, 28, 0.06), 0 10px 28px rgba(20, 22, 28, 0.09);

  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 11.5px;
  --fs-sm: 13px;
  --fs-md: 14.5px;
  --fs-lg: 17px;
  --fs-xl: 22px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 36px;
  --sp-7: 56px;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b;
    --bg-dot: #1d2028;
    --surface: #1c1f26;
    --surface-2: #242833;
    --text: #e8eaef;
    --text-2: #a0a7b4;
    --text-3: #6d7480;
    --line: #2b2f3a;
    --line-strong: #3c4150;
    --accent: #9aa3ff;
    --accent-contrast: #14161b;
    --accent-soft: rgba(154, 163, 255, 0.12);
    --warn: #e2b45c;
    --warn-bg: rgba(226, 180, 92, 0.14);
    --pass: #4cc47e;
    --fail: #ef6d6d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 14px rgba(0, 0, 0, 0.22);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.32);
  }
}

/* ---- base --------------------------------------------------------------- */
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--text);
  background-color: var(--bg);
  /* a whisper of graph paper: evals are measurement */
  background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
  background-size: 26px 26px;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--surface-2);
  padding: 1px 6px;
  border-radius: var(--r-sm);
}

/* ---- shell -------------------------------------------------------------- */
header, main {
  max-width: 1120px;
  margin: 0 auto;
  padding-inline: var(--sp-5);
}
header {
  display: flex;
  align-items: baseline;
  gap: var(--sp-3);
  padding-block: var(--sp-6) var(--sp-5);
}
.wordmark {
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--text);
}
.wordmark:hover { text-decoration: none; }
.wordmark .studio {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.88em;
  color: var(--accent);
  margin-left: 2px;
}
#header-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
}
main { padding-bottom: var(--sp-7); }

/* ---- cards & shelf ------------------------------------------------------ */
.shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
a.card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  color: inherit;
}
a.card:hover { text-decoration: none; }
@media (prefers-reduced-motion: no-preference) {
  a.card { transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }
  .shelf-grid > * { animation: rise 0.3s ease backwards; }
  .shelf-grid > :nth-child(2) { animation-delay: 0.04s; }
  .shelf-grid > :nth-child(3) { animation-delay: 0.08s; }
  .shelf-grid > :nth-child(4) { animation-delay: 0.12s; }
  .shelf-grid > :nth-child(5) { animation-delay: 0.16s; }
  .shelf-grid > :nth-child(6) { animation-delay: 0.2s; }
  .shelf-grid > :nth-child(7) { animation-delay: 0.24s; }
  .shelf-grid > :nth-child(n + 8) { animation-delay: 0.28s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
  }
}
a.card:hover, a.card:focus-visible {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  box-shadow: var(--shadow-lift);
}
.card-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
}
.card-name {
  font-size: var(--fs-lg);
  font-weight: 600;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.card-desc {
  font-size: var(--fs-sm);
  line-height: 1.55;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-desc.none { color: var(--text-3); font-style: italic; }
.card-foot {
  margin-top: auto;
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  white-space: nowrap;
}
.card-foot b { font-weight: 600; color: var(--text-2); }
.card-runs {
  margin-top: var(--sp-1);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
}
.card-runs b { font-weight: 600; color: var(--text-2); }
.lastrun { display: inline-flex; align-items: center; gap: 6px; }
.lastrun .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line-strong);
}
.lastrun .dot.fresh { background: var(--accent); }
.lastrun .dot.never { background: transparent; border: 1px solid var(--line-strong); }
.badge-warn {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--warn);
  background: var(--warn-bg);
  border-radius: 999px;
  padding: 2px 9px;
  margin-left: auto;
  white-space: nowrap;
}

/* ---- new-eval card ------------------------------------------------------ */
.card-new {
  display: grid;
  place-items: center;
  min-height: 176px;
  height: 100%;
  padding: var(--sp-5);
  width: 100%;
  font: inherit;
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--text-3);
  background: color-mix(in srgb, var(--surface) 45%, transparent);
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--r-lg);
  cursor: pointer;
}
@media (prefers-reduced-motion: no-preference) {
  .card-new { transition: border-color 0.15s ease, color 0.15s ease; }
}
.card-new:hover, .card-new:focus-visible { border-color: var(--accent); color: var(--accent); }
.card-new .plus { font-size: var(--fs-xl); display: block; text-align: center; line-height: 1.2; }

/* ---- forms -------------------------------------------------------------- */
form.new-eval {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-5) var(--sp-5);
}
form.new-eval label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: var(--sp-2);
}
input, textarea {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: 7px 10px;
}
textarea { resize: vertical; }
input:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-actions { display: flex; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }
.btn {
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--r-sm);
  padding: 8px 14px;
  cursor: pointer;
}
.btn-primary { background: var(--accent); color: var(--accent-contrast); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { opacity: 0.6; cursor: default; filter: none; }
.btn-quiet { background: transparent; color: var(--text-2); font-weight: 500; }
.btn-quiet:hover { color: var(--text); }

/* ---- inline errors (the one error-rendering voice) ---------------------- */
.error {
  font-size: var(--fs-sm);
  color: var(--fail);
  background: color-mix(in srgb, var(--fail) 9%, transparent);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3);
}

/* ---- teaching empty state ----------------------------------------------- */
.empty-shelf {
  max-width: 640px;
  margin: var(--sp-6) auto 0;
  padding: var(--sp-6) var(--sp-6) var(--sp-5);
}
.empty-shelf h2 {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-xl);
  font-weight: 650;
  letter-spacing: -0.02em;
}
.empty-shelf p { margin: 0 0 var(--sp-4); color: var(--text-2); }
.tree {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.8;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: var(--sp-4) var(--sp-5);
  margin: 0 0 var(--sp-4);
  overflow-x: auto;
  white-space: pre;
}
.tree .c { color: var(--text-3); }
.tree .k { color: var(--accent); }
.empty-actions { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.empty-hint { font-size: var(--fs-sm); color: var(--text-3); }
.empty-shelf form.new-eval { padding: var(--sp-4) 0 0; }

/* ---- workbench ----------------------------------------------------------
   Three floating surfaces on the graph paper: file tree / editor / context.
   The context panel is the teaching mirror and carries the page's one bold
   move (the terminal-styled env block); everything else stays quiet. */
:root { --wb-tree-w: 236px; --wb-ctx-w: 352px; }
body.wb main { max-width: 1680px; }
body.wb header { padding-block: var(--sp-5) var(--sp-4); }
.crumb {
  font-size: var(--fs-sm);
  margin-bottom: var(--sp-4);
}
.wb-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}
.wb-head .crumb { margin: 0; }
.wb-head h2 {
  margin: 0;
  font-size: var(--fs-xl);
  font-weight: 650;
  letter-spacing: -0.02em;
}
.wb-head .badge-warn { margin-left: 0; }
.wb-hint {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  white-space: nowrap;
}
.wb-grid {
  display: grid;
  grid-template-columns: var(--wb-tree-w) minmax(0, 1fr) var(--wb-ctx-w);
  gap: var(--sp-4);
  align-items: start;
}
.pane { min-height: 0; }
.pane-tree, .pane-ctx {
  max-height: calc(100vh - 150px);
  overflow-y: auto;
  position: sticky;
  top: var(--sp-4);
}
.pane-editor {
  display: flex;
  flex-direction: column;
  min-height: 420px;
}
@media (max-width: 1280px) { :root { --wb-ctx-w: 300px; } }
@media (max-width: 1020px) {
  .wb-grid { grid-template-columns: 1fr; }
  .pane-tree, .pane-ctx { position: static; max-height: none; }
}

/* ---- file tree ----------------------------------------------------------- */
.pane-tree { padding: var(--sp-3) var(--sp-2) var(--sp-4); }
.tree-group-label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: var(--sp-3) var(--sp-2) var(--sp-1);
}
.tree-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  font: inherit;
  font-size: var(--fs-sm);
  text-align: left;
  color: var(--text-2);
  background: none;
  border: none;
  border-radius: var(--r-sm);
  padding: 5px var(--sp-2);
  cursor: pointer;
}
.tree-item:hover { background: var(--surface-2); color: var(--text); }
.tree-item.sel { background: var(--accent-soft); color: var(--text); font-weight: 550; }
.tree-item .fname {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  overflow-wrap: anywhere;
}
.tree-item .flags { margin-left: auto; display: inline-flex; align-items: center; gap: var(--sp-1); }
.dot-problem, .dot-dirty {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.dot-problem { background: var(--warn); }
.dot-dirty { background: var(--accent); }
.chip-x {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--pass);
  border: 1px solid color-mix(in srgb, var(--pass) 40%, transparent);
  border-radius: var(--r-sm);
  padding: 0 4px;
  line-height: 1.4;
}
.tree-empty { padding: 2px var(--sp-2); font-size: var(--fs-xs); color: var(--text-3); font-style: italic; }

/* ---- editor pane --------------------------------------------------------- */
.ed-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.ed-path {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  overflow-wrap: anywhere;
}
.ed-actions { margin-left: auto; display: inline-flex; align-items: center; gap: var(--sp-2); }
.seg {
  display: inline-flex;
  background: var(--surface-2);
  border-radius: var(--r-sm);
  padding: 2px;
}
.seg button {
  font: inherit;
  font-size: var(--fs-xs);
  font-weight: 550;
  color: var(--text-2);
  background: none;
  border: none;
  border-radius: calc(var(--r-sm) - 2px);
  padding: 3px 10px;
  cursor: pointer;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg button:disabled { opacity: 0.45; cursor: default; }
.btn-sm { font-size: var(--fs-xs); padding: 4px 10px; }
.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--line-strong);
  font-weight: 500;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-3); }
.ed-note {
  font-size: var(--fs-xs);
  color: var(--warn);
  background: var(--warn-bg);
  border-radius: var(--r-sm);
  padding: 3px 9px;
}
.ed-err { padding: var(--sp-2) var(--sp-4) 0; }
.ed-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ed-empty { padding: var(--sp-6); color: var(--text-2); font-size: var(--fs-sm); max-width: 58ch; }
.ed-empty h3 { margin: 0 0 var(--sp-2); font-size: var(--fs-lg); font-weight: 650; letter-spacing: -0.01em; color: var(--text); }
.ed-empty p { margin: 0 0 var(--sp-3); }

/* ---- form view ----------------------------------------------------------- */
.form-view { padding: var(--sp-4) var(--sp-5) var(--sp-5); overflow-y: auto; }
.form-note {
  font-size: var(--fs-xs);
  color: var(--warn);
  background: var(--warn-bg);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: var(--sp-4);
}
.ff { margin-bottom: var(--sp-4); }
.ff > label, .ff-key {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0 var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: var(--sp-1);
}
.ff-key { text-transform: none; letter-spacing: 0.02em; color: var(--text-2); }
/* Quiet metadata, not a second value display: the env var name a field's
   own label carries inline, pinned to the row's far edge. */
.ff-env { font-weight: 400; color: var(--text-3); text-transform: none; letter-spacing: 0.02em; }
.ff-env::before { content: "→ "; }
.ff input, .ff textarea, .ff select { width: 100%; }
.ff input.mono, .ff textarea { font-family: var(--font-mono); font-size: var(--fs-sm); }
.ff-help { font-size: var(--fs-xs); color: var(--text-3); margin-top: var(--sp-1); }
.ff-prob { font-size: var(--fs-xs); color: var(--warn); margin-top: var(--sp-1); }
.ff-prob.hard { color: var(--fail); }
.ff-row { display: flex; align-items: flex-start; gap: var(--sp-2); }
.ff-row > .ff-val { flex: 1; }
.ff-complex {
  font-size: var(--fs-xs);
  color: var(--text-3);
  font-style: italic;
  padding: 6px 0;
}
.btn-del {
  font: inherit;
  font-size: var(--fs-sm);
  color: var(--text-3);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px var(--sp-1);
  line-height: 1;
}
.btn-del:hover { color: var(--fail); }
.add-key { display: flex; gap: var(--sp-2); align-items: center; margin-top: var(--sp-2); }
.add-key input { flex: 0 1 220px; font-family: var(--font-mono); font-size: var(--fs-sm); }
/* Previews the key being typed as the env var it will become, before the
   field exists on disk - empty and invisible until there's a key to show. */
.add-key-env {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
select {
  font: inherit;
  font-size: var(--fs-sm);
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: 6px 8px;
}
select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---- checks sub-editor --------------------------------------------------- */
.check-card {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
  background: color-mix(in srgb, var(--surface-2) 40%, transparent);
}
.check-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--line);
}
.check-n {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: var(--r-sm);
  padding: 1px 7px;
}
.check-head select { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--fs-xs); }
.check-head .ff-env { flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--fs-xs); white-space: nowrap; }
.check-tools { display: inline-flex; gap: 2px; }
.check-tools button {
  font: inherit;
  font-size: var(--fs-sm);
  color: var(--text-3);
  background: none;
  border: none;
  border-radius: var(--r-sm);
  padding: 2px 6px;
  cursor: pointer;
  line-height: 1.3;
}
.check-tools button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.check-tools button:disabled { opacity: 0.35; cursor: default; }
.check-body { padding: var(--sp-3); }
.check-body .ff { margin-bottom: var(--sp-3); }
.check-body .ff:last-child { margin-bottom: 0; }

/* ---- raw view ------------------------------------------------------------ */
.raw-view {
  flex: 1;
  display: flex;
  min-height: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.6;
}
.raw-gutter-clip { overflow: hidden; flex: none; background: var(--surface-2); border-right: 1px solid var(--line); }
.raw-gutter {
  padding: var(--sp-3) var(--sp-2) var(--sp-3) var(--sp-3);
  text-align: right;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  user-select: none;
  min-width: 3.2em;
}
.raw-gutter .pl { color: var(--warn); font-weight: 700; position: relative; }
.raw-gutter .pl::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--warn);
}
textarea.raw-text {
  flex: 1;
  min-width: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  line-height: inherit;
  padding: var(--sp-3) var(--sp-4);
  resize: none;
  white-space: pre;
  overflow: auto;
  tab-size: 2;
  min-height: 320px;
}
textarea.raw-text:focus-visible { outline: none; box-shadow: none; border: none; }

/* ---- problems footer ----------------------------------------------------- */
.prob-foot { border-top: 1px solid var(--line); padding: var(--sp-2) var(--sp-4) var(--sp-3); }
.prob-row {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  font-size: var(--fs-xs);
  color: var(--text-2);
  padding: 2px 0;
}
.prob-line {
  font-family: var(--font-mono);
  color: var(--warn);
  flex: none;
  min-width: 3.5em;
}
.prob-row .kp { font-family: var(--font-mono); color: var(--text); }

/* ---- conflict (409) ------------------------------------------------------ */
.conflict { padding: var(--sp-4) var(--sp-5) var(--sp-5); overflow-y: auto; }
.conflict-intro { font-size: var(--fs-sm); color: var(--text-2); margin: 0 0 var(--sp-3); max-width: 60ch; }
.conflict-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
@media (max-width: 800px) { .conflict-grid { grid-template-columns: 1fr; } }
.conflict-pane h4 {
  margin: 0 0 var(--sp-1);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--text-3);
}
.conflict-pane pre {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.6;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  max-height: 380px;
  overflow: auto;
}
.conflict-pane.ours pre { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.conflict-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }

/* ---- context panel ------------------------------------------------------- */
.pane-ctx { padding: var(--sp-4) var(--sp-4) var(--sp-5); }
.ctx-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 0 0 var(--sp-1);
}
.ctx-sub { font-size: var(--fs-xs); color: var(--text-3); margin: 0 0 var(--sp-3); }
.ctx-note { font-size: var(--fs-sm); color: var(--text-2); }
.ctx-note p { margin: 0 0 var(--sp-3); }

/* The env mirror keeps one fixed terminal palette in both color schemes -
   it depicts the Runner's process environment, and a terminal is dark. */
.env-block {
  --eb-bg: #171a21;
  --eb-line: #262b36;
  --eb-name: #9aa3ff;
  --eb-text: #dde2ea;
  --eb-dim: #79818f;
  background: var(--eb-bg);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4) var(--sp-4);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.55;
  overflow-x: auto;
  box-shadow: var(--shadow);
}
.env-var { padding-top: var(--sp-2); }
.env-var:first-child { padding-top: 0; }
.env-name { color: var(--eb-name); font-weight: 600; }
.env-name::after { content: "="; color: var(--eb-dim); font-weight: 400; }
.env-val {
  color: var(--eb-text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 7;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.env-val.dim, .env-missing { color: var(--eb-dim); font-style: italic; }
.env-err { color: var(--eb-dim); font-style: italic; }
.env-err b { color: #e2b45c; font-weight: 600; }

/* ---- check pipeline (grader context) ------------------------------------- */
.pipe { margin-top: var(--sp-2); }
.pipe-step {
  position: relative;
  padding: 0 0 var(--sp-4) calc(var(--sp-5) + var(--sp-2));
}
.pipe-step:last-child { padding-bottom: 0; }
.pipe-step::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 24px;
  bottom: 0;
  width: 2px;
  background: var(--line);
}
.pipe-step:last-child::before { display: none; }
.pipe-n {
  position: absolute;
  left: 0;
  top: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
}
.pipe-checker { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; overflow-wrap: anywhere; }
.pipe-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-3); }
.pipe-status .st-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.st-ok .st-dot { background: var(--pass); }
.st-warn .st-dot { background: var(--warn); }
.st-bad .st-dot { background: var(--fail); }
.st-warn { color: var(--warn); }
.st-bad { color: var(--fail); }
.pipe-conf {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  margin-top: var(--sp-1);
}
.pipe-conf .k { color: var(--text-3); }
.pipe-conf div { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 4.8em; overflow: hidden; }
.pipe-foot {
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
  font-size: var(--fs-xs);
  color: var(--text-2);
}

/* ---- problems (workbench header voice, kept from the shelf era) ---------- */
.problems h3 {
  margin: 0 0 var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--warn);
}

/* ---- bench: context-panel actions ----------------------------------------
   Run/grade/dry-run controls live in the context panel; results speak in
   the voices the app already has (the terminal env-block for process
   truth, chip outlines for grades, pass/fail semantic colors). */
.ctx-act { margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px solid var(--line); }
.bench-form { display: flex; flex-direction: column; gap: var(--sp-2); }
.bench-row { display: flex; align-items: center; gap: var(--sp-2); }
.bench-row label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  flex: none;
  min-width: 3.4em;
}
.bench-row select, .bench-row input {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}
.bench-actions { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-1); }
.bench-hint { font-size: var(--fs-xs); color: var(--text-3); }
.job-status {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-sm);
  color: var(--text-2);
  margin-bottom: var(--sp-2);
}
.spin {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--accent-soft);
  border-top-color: var(--accent);
  flex: none;
}
@media (prefers-reduced-motion: no-preference) {
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
}
/* The job log borrows the env-block's terminal palette: a run is a process */
.env-block .log-line { color: var(--eb-text); white-space: pre-wrap; overflow-wrap: anywhere; }
.env-block .log-line.dim { color: var(--eb-dim); font-style: italic; }
.job-log { max-height: 180px; overflow-y: auto; }

/* ---- runs: meta, chips, list, detail ------------------------------------- */
.run-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1) var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  margin: var(--sp-2) 0 var(--sp-3);
}
.run-meta .sep, .run-id .sep { color: var(--text-3); }
.ok-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  background: var(--pass);
}
.ok-dot.bad { background: var(--fail); }
.chip-grade {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  border: 1px solid;
  border-radius: 999px;
  padding: 1px 8px;
  white-space: nowrap;
}
.chip-grade.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 40%, transparent); }
.chip-grade.fail { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
.runs-list { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
.run-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  font: inherit;
  text-align: left;
  color: var(--text-2);
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-2);
  cursor: pointer;
}
.runs-list .run-row:last-child { border-bottom-color: transparent; }
.run-row:hover { background: var(--surface-2); color: var(--text); }
.run-id {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--text);
  overflow-wrap: anywhere;
}
.run-chips { display: inline-flex; gap: var(--sp-1); flex-wrap: wrap; margin-left: auto; }
.run-when {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  white-space: nowrap;
}
.run-view { padding: var(--sp-3) var(--sp-5) var(--sp-5); overflow-y: auto; }
.fold {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
  background: color-mix(in srgb, var(--surface-2) 40%, transparent);
}
.fold summary {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  user-select: none;
}
.fold summary:hover { color: var(--text); }
.fold pre {
  margin: 0;
  padding: 0 var(--sp-3) var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 380px;
  overflow-y: auto;
}
.fold-loading { padding: 0 var(--sp-3) var(--sp-3); font-size: var(--fs-xs); color: var(--text-3); font-style: italic; }
.fold .grade-checks { padding: 0 var(--sp-3) var(--sp-2); }
.art-line {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-2);
  align-items: baseline;
  font-size: var(--fs-xs);
  color: var(--text-3);
  margin: 0 0 var(--sp-3);
}
/* inline image artifacts (blob-fetched through /raw) */
.art-fig { margin: 0 0 var(--sp-3); }
.art-cap {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  margin: 0 0 var(--sp-1);
  overflow-wrap: anywhere;
}
.art-img {
  display: block;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.art-wait {
  font-size: var(--fs-xs);
  color: var(--text-3);
  font-style: italic;
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-3);
}
/* long-output ergonomics: wrap toggle + show-all inside a text fold */
.fold-tools {
  display: flex;
  gap: var(--sp-2);
  align-items: baseline;
  padding: 0 var(--sp-3) var(--sp-2);
  font-size: var(--fs-xs);
  color: var(--text-3);
}
.fold-tools button {
  font: inherit;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 9px;
  cursor: pointer;
}
.fold-tools button:hover { color: var(--text); border-color: var(--text-3); }
.fold pre.nowrap { white-space: pre; overflow-wrap: normal; overflow-x: auto; }
/* run-detail meta links: quiet pivots into the filtered runs list */
a.meta-link { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
a.meta-link:hover { color: var(--accent); text-decoration-style: solid; }
.run-grades { margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px solid var(--line); }
.rg-label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: var(--sp-2);
}
.rg-note { font-size: var(--fs-xs); color: var(--text-3); margin: 0 0 var(--sp-2); }
.grade-row { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0; flex-wrap: wrap; }
.rg-name { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text); }
.rg-none { font-size: var(--fs-xs); color: var(--text-3); font-style: italic; }
.grade-row .btn { margin-left: auto; }

/* ---- check result rows (persisted grades and dry-run columns) ------------ */
.dc { padding: 3px 0; font-size: var(--fs-xs); }
.dc-head { display: flex; align-items: baseline; gap: var(--sp-2); }
.dc-status { font-family: var(--font-mono); font-weight: 600; flex: none; }
.dc-status.ok { color: var(--pass); }
.dc-status.fail { color: var(--fail); }
.dc-status.skipped { color: var(--text-3); }
.dc-name { font-family: var(--font-mono); color: var(--text-2); overflow-wrap: anywhere; }
.dc-score { font-family: var(--font-mono); color: var(--text-3); margin-left: auto; white-space: nowrap; }
.dc-metric {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  padding-left: var(--sp-4);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.dc-metric .k { color: var(--text-3); }
.dc-tags {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  padding-left: var(--sp-4);
  overflow-wrap: anywhere;
}
.dc-notes {
  color: var(--text-3);
  margin-top: 1px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 6em;
  overflow-y: auto;
}

/* ---- dry-run comparison (the flagship): saved grade vs the current edit -- */
.dry-panel { border-top: 1px solid var(--line); padding: var(--sp-3) var(--sp-5) var(--sp-4); }
.dry-head { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.dry-head .ctx-eyebrow { margin: 0; overflow-wrap: anywhere; }
.dry-head .btn-del { margin-left: auto; }
.dry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--sp-5); }
.dry-panel.single .dry-row { grid-template-columns: 1fr; }
@media (max-width: 800px) { .dry-row { grid-template-columns: 1fr; } }
.dry-cell { min-width: 0; }
.dry-labels > div {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  padding-bottom: var(--sp-1);
  border-bottom: 1px solid var(--line);
  margin-bottom: var(--sp-1);
}
.dry-labels .ours-label { color: var(--accent); }
.dry-sum {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  padding-top: var(--sp-2);
  margin-top: var(--sp-1);
  border-top: 1px solid var(--line);
}
.dry-sum .sep { color: var(--text-3); }
.outcome-pass { color: var(--pass); font-weight: 600; }
.outcome-fail { color: var(--fail); font-weight: 600; }
.dry-tags { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-2); padding: var(--sp-1) 0; }
/* One quiet accent wash marks "this value changed" - red/green stay
   reserved for pass/fail meaning, so a diff never shouts */
.chg { background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); border-radius: 3px; }
.dry-note { font-size: var(--fs-xs); color: var(--text-3); margin: var(--sp-2) 0 0; }
.dry-empty-cell { font-size: var(--fs-xs); color: var(--text-3); font-style: italic; padding: 3px 0; }
.tree-count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); }

/* ---- header nav ----------------------------------------------------------- */
.header-nav { display: flex; gap: var(--sp-4); }
.header-nav a { font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.header-nav a:hover { color: var(--text); text-decoration: none; }

/* ---- shelf: results strip -------------------------------------------------- */
.card-results {
  margin-top: var(--sp-1);
  padding-top: var(--sp-2);
  border-top: 1px dashed var(--line);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  overflow-wrap: anywhere;
}
.card-results .best-score { color: var(--accent); font-weight: 700; }
.card-results.none { color: var(--text-3); font-style: italic; }

/* ---- results: badges, leaderboard, tag shares, metric blocks -------------- */
.results-badges { display: flex; gap: var(--sp-2); flex-wrap: wrap; padding: var(--sp-3) var(--sp-4) 0; }
.chip-quiet {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 1px 8px;
  white-space: nowrap;
}
.results-body { padding: var(--sp-3) var(--sp-5) var(--sp-5); overflow-y: auto; }
.results-section { margin-top: var(--sp-5); }
.results-section:first-child { margin-top: var(--sp-3); }
.results-section h3 {
  margin: 0 0 var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--text-3);
}
.lb-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  font: inherit;
  text-align: left;
  color: var(--text-2);
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: var(--sp-2);
  cursor: pointer;
}
.lb-row:last-child { border-bottom-color: transparent; }
.lb-row:hover { background: var(--surface-2); color: var(--text); }
.lb-rank {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
}
.lb-mid { flex: 1; min-width: 0; }
.lb-name { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text); overflow-wrap: anywhere; }
.lb-sub { font-size: var(--fs-xs); color: var(--text-3); margin-top: 1px; }
.lb-meter { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.lb-meter > div { height: 100%; background: var(--pass); border-radius: 2px; }
.lb-score {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  text-align: right;
  min-width: 92px;
  flex: none;
}
.lb-score .stderr { color: var(--text-3); font-weight: 400; }
.lb-empty { font-size: var(--fs-sm); color: var(--text-3); font-style: italic; padding: var(--sp-2) 0; }
.tagshare-row { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); padding: 3px 0; }
/* as a button: a tag chip pivots into the runs list filtered to that tag */
button.tagshare-row {
  font: inherit;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-radius: var(--r-sm);
  color: inherit;
  cursor: pointer;
}
button.tagshare-row:hover { background: var(--surface-2); }
button.tagshare-row:hover .tagshare-name { color: var(--accent); }
.tagshare-name { font-family: var(--font-mono); color: var(--text); flex: none; overflow-wrap: anywhere; }
.tagshare-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.tagshare-bar > div { height: 100%; background: var(--accent); border-radius: 3px; }
.tagshare-pct { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); width: 74px; text-align: right; flex: none; }
.metric-row { display: flex; gap: var(--sp-2); padding: 2px 0; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.metric-row .k { width: 150px; flex: none; color: var(--text-3); overflow-wrap: anywhere; }
.metric-row .v { color: var(--text-2); }
.runs-filter {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  font-size: var(--fs-xs);
  color: var(--text-2);
  padding: var(--sp-2) var(--sp-3);
  margin: var(--sp-2) var(--sp-3) 0;
  background: var(--accent-soft);
  border-radius: var(--r-sm);
}
.runs-filter b { color: var(--text); font-family: var(--font-mono); }

/* ---- compare: contact-sheet grid, cards, pin panel ------------------------ */
.cmp-controls {
  display: flex;
  align-items: center;
  gap: var(--sp-2) var(--sp-3);
  flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
}
.cmp-controls select {
  font: inherit;
  font-size: var(--fs-xs);
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 3px 8px;
}
.cmp-toggle {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: var(--fs-xs);
  color: var(--text-2);
  margin-left: auto;
  cursor: pointer;
}
.cmp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4) var(--sp-5);
}
.cmp-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
@media (prefers-reduced-motion: no-preference) {
  .cmp-card { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
}
.cmp-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
.cmp-card.pinned { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.cmp-pin {
  position: absolute;
  top: var(--sp-2);
  right: var(--sp-2);
  z-index: 1;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  background: color-mix(in srgb, var(--surface) 85%, transparent);

.cmp-pin:hover { color: var(--text); border-color: var(--text-3); }
.cmp-pin[aria-pressed="true"] { color: var(--accent-contrast); background: var(--accent); border-color: var(--accent); }
.cmp-pin:disabled { opacity: 0.4; cursor: default; }
.cmp-vis {

.cmp-vis-text { align-items: flex-start; justify-content: flex-start; padding: var(--sp-2); }
.cmp-vis-text pre {

  font-family: var(--font-mono);

}
.cmp-card-meta { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
.cmp-card-model {
  font-size: var(--fs-sm);

.cmp-card-sub {
  display: flex;

  gap: var(--sp-2);
  margin-top: var(--sp-1);

}
.cmp-card-when { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); margin-left: auto; }
.cmp-panel {
  margin: var(--sp-3) var(--sp-4) 0;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: color-mix(in srgb, var(--surface-2) 40%, transparent);
}
.cmp-panel-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--line);
}
.cmp-panel-head button { margin-left: auto; }
.cmp-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.cmp-col { padding: var(--sp-3); border-right: 1px solid var(--line); min-width: 0; }
.cmp-col:last-child { border-right: none; }
.cmp-col-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin-bottom: var(--sp-2);
}
.cmp-col-head button { margin-left: auto; }

  .cmp-cols { grid-template-columns: 1fr; }
  .cmp-col { border-right: none; border-bottom: 1px solid var(--line); }
  .cmp-col:last-child { border-bottom: none; }
}

/* ---- global results matrix ------------------------------------------------ */
.matrix-wrap { overflow-x: auto; padding: var(--sp-2) var(--sp-2) var(--sp-3); }
table.matrix { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.matrix th, table.matrix td {
  padding: 6px 12px;
  text-align: right;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
table.matrix th:first-child, table.matrix td:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  background: var(--surface);
}
table.matrix thead th {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--text-3);
}
table.matrix thead th:first-child { background: var(--surface); }
table.matrix thead th a { color: var(--text-2); }
table.matrix td.best { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: var(--r-sm); }
table.matrix td.mcell { color: var(--text-2); }
table.matrix td.empty { color: var(--text-3); }
.matrix-mark { color: var(--warn); margin-left: 3px; cursor: help; }
.matrix-foot { margin: var(--sp-3) var(--sp-4) 0; font-size: var(--fs-xs); color: var(--text-3); }

/* ---- sweeps: compose form -------------------------------------------------
   State colors stay within the app's token semantics: accent for active
   work (loading/running/grading), pass/fail reserved for outcomes, and
   neutral line colors for queued/stopped. State is never color alone -
   every cell and chip carries its state as text too. */
.sweep-compose { padding: var(--sp-4) var(--sp-5) var(--sp-5); margin-bottom: var(--sp-5); }
.sw-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
@media (max-width: 800px) { .sw-cols { grid-template-columns: 1fr; } }
.sw-label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: var(--sp-1);
}
.sw-pick {
  max-height: 230px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-1);
  background: var(--bg);
}
.sw-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 4px var(--sp-2);
  border-radius: var(--r-sm);
  cursor: pointer;
}
.sw-item:hover { background: var(--surface-2); }
.sw-item input { accent-color: var(--accent); flex: none; }
.sw-item .sw-name { font-family: var(--font-mono); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.sw-item .chip-quiet { margin-left: auto; }
.sw-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-4); }
.sw-row input[type=number] { font-family: var(--font-mono); font-size: var(--fs-sm); width: 76px; }
.sw-treat-row { display: flex; align-items: center; gap: var(--sp-2); padding: 3px 0; font-size: var(--fs-sm); }
.sw-treat-eval { color: var(--text-2); flex: none; }
.sw-treat-name { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text); overflow-wrap: anywhere; }
.sw-treat-row select { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-xs); flex: none; }
.sw-hint { font-size: var(--fs-xs); color: var(--text-3); }
.sw-preview {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--text);
  background: var(--accent-soft);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3);
  margin-top: var(--sp-4);
}
.sw-preview .sw-hint { margin-left: var(--sp-1); }

/* ---- sweeps: live board --------------------------------------------------- */
.sw-board-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin-bottom: var(--sp-3);
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.sw-board-head .sw-spec { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); }
.sw-board-head .sw-cancel { margin-left: auto; display: inline-flex; align-items: center; gap: var(--sp-2); }
.chip-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 1px 8px;
  white-space: nowrap;
}
.chip-state.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chip-state.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 40%, transparent); }
.chip-state.fail { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
table.sw-board th, table.sw-board td {
  text-align: left;
  border-bottom: none;
  padding: 4px;
}
.sw-cell {
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: 5px 10px 6px;
  min-width: 110px;
  font-variant-numeric: tabular-nums;
}
.sw-cell .sw-state {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
}
.sw-cell .sw-have { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
.sw-cell .sw-sub {
  display: flex;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-2);
}
.sw-cell .sw-failn { color: var(--fail); }
.sw-cell.st-active { border-left-color: var(--accent); }
.sw-cell.st-active .sw-state { color: var(--accent); }
.sw-cell.st-done { border-left-color: var(--pass); }
.sw-cell.st-done .sw-state { color: var(--pass); }
.sw-cell.st-failed { border-left-color: var(--fail); }
.sw-cell.st-failed .sw-state { color: var(--fail); }
.sw-cell.st-stopped { border-left-style: dashed; }
.sw-current {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-sm);
  color: var(--text-2);
  margin: var(--sp-4) 0 var(--sp-2);
}
.sw-current b { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
.sw-log { max-height: 260px; overflow-y: auto; }
.sw-section-h {
  margin: var(--sp-4) 0 var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--text-3);
}
.sw-def-row { display: flex; align-items: center; gap: var(--sp-2); padding: 3px 0; font-size: var(--fs-sm); }
.sw-def-name { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <a class="wordmark" href="#/">smevals<span class="studio">studio</span></a>
  <nav class="header-nav"><a href="#/results">Results</a><a href="#/sweep">Sweeps</a></nav>
  <span id="header-meta"></span>
</header>
<main id="view"></main>
<script>
"use strict";

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const enc = encodeURIComponent;
const view = document.getElementById("view");
// wbCache: slug -> workbench state parked while another route is showing -
// see renderWorkbench/route. Unsaved buffers and an in-flight job survive an
// in-app trip to the shelf and back this way, instead of the shelf discarding
// state.wb outright.
// resultsMatrix: the global #/results cache. sweepActive is true while a
// sweep job is running (the sweep poll loop maintains it), which is what
// turns the results poll ticker below on. sweeps holds the Sweeps
// surface's state - see sweepsState().
const state = {
  evals: null, models: null, wb: null, wbCache: new Map(),
  resultsMatrix: null, sweepActive: false, sweeps: null,
};

// --- studio key ------------------------------------------------------------
//
// `smevals studio` prints the URL with ?k=<token>; every /api/* request must
// carry it as X-Studio-Key or the server 403s (a loopback bind alone doesn't
// stop a hostile page open in the same browser from reaching it). Read once
// from the URL, stash in sessionStorage (survives in-tab navigation, not a
// new tab), then scrub the query string so the token never sits in history
// or gets shared via a copy-pasted link.
const STUDIO_KEY_STORAGE = "smevals-studio-key";
(() => {
  const params = new URLSearchParams(location.search);
  const k = params.get("k");
  if (!k) return;
  sessionStorage.setItem(STUDIO_KEY_STORAGE, k);
  params.delete("k");
  const rest = params.toString();
  history.replaceState(null, "",
    location.pathname + (rest ? `?${rest}` : "") + location.hash);
})();
const studioKey = () => sessionStorage.getItem(STUDIO_KEY_STORAGE) || "";

// --- fetch layer ---------------------------------------------------------

async function api(path, options = {}) {
  const init = options.body === undefined ? { ...options } : {
    method: options.method || "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(options.body),
  };
  init.headers = { ...(init.headers || {}), "X-Studio-Key": studioKey() };
  const response = await fetch(path, init);
  let data = null;
  try { data = await response.json(); } catch { /* non-JSON reply */ }
  if (!response.ok) {
    const error = new Error(data?.error || `${path}: HTTP ${response.status}`);
    // A 409 carries both versions of the file so the app can offer a choice
    if (response.status === 409 && data?.theirs !== undefined) {
      error.conflict = data;
    }
    throw error;
  }
  return data;
}

// The one error-rendering voice: every failure lands inline, never alert()
const errorBox = message => `<div class="error" role="alert">${esc(message)}</div>`;

async function loadEvals(force = false) {
  if (state.evals === null || force) {
    state.evals = await api("/api/evals");
    document.getElementById("header-meta").textContent =
      state.evals.length ? plural(state.evals.length, "eval") : "";
  }
  return state.evals;
}

// --- helpers -------------------------------------------------------------

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 45) return Math.floor(s / 86400) + "d ago";
  return new Date(iso).toISOString().slice(0, 10);
}

// A single score, or a mean +- stderr pair - formatted exactly like
// cli.py's format_mean_stderr, so a Results surface's numbers read
// identically to `smevals report`'s for the same data.
const fmtScore = v => v == null ? "–" : v.toFixed(2);
const fmtMeanStderr = (mean, stderr) => mean == null ? "–"
  : stderr != null ? `${mean.toFixed(2)} ±${stderr.toFixed(2)}` : mean.toFixed(2);

// --- shelf ---------------------------------------------------------------

function resultsStripHtml(e) {
  if (!e.best) return `<div class="card-results none">not graded yet</div>`;
  return `
    <div class="card-results">best <span class="best-score">${
      esc(fmtScore(e.best.score))}</span> · ${esc(e.best.model)} (${esc(e.best.config)})</div>`;
}

// Run/graded/fail totals - parity with the old dashboard's card facts
// (app.html:230-236). The fail count reuses the sweep ledger's existing
// fail styling and shows only when nonzero, same rule as resultsStripHtml.
function runsFactsHtml(e) {
  const total = e.runs?.total ?? 0;
  const graded = e.runs?.graded ?? 0;
  const failed = e.runs?.failed ?? 0;
  return `
    <div class="card-runs"><b>${total}</b> run${total === 1 ? "" : "s"} · <b>${
      graded}</b> graded${failed
        ? ` · <span class="sw-failn">${esc(plural(failed, "fail"))}</span>` : ""}</div>`;
}

function cardHtml(e) {
  const counts = ["tasks", "configs", "graders"]
    .map(k => {
      const n = e.counts?.[k] ?? 0;
      return `<b>${n}</b> ${k.slice(0, -1)}${n === 1 ? "" : "s"}`;
    })
    .join(" · ");
  const run = e.last_run_iso
    ? `<span class="dot${Date.now() - new Date(e.last_run_iso) < 86400000
        ? " fresh" : ""}"></span>${esc(ago(e.last_run_iso))}`
    : `<span class="dot never"></span>never run`;
  const badge = e.problems
    ? `<span class="badge-warn" title="${esc(plural(e.problems, "problem") +
        " to review — open the workbench to see and fix them")}">${
        esc(plural(e.problems, "problem"))}</span>`
    : "";
  return `
    <a class="card" href="#/eval/${enc(e.slug)}">
      <div class="card-head">
        <span class="card-name">${esc(e.name)}</span>${badge}
      </div>
      ${e.description
        ? `<div class="card-desc">${esc(e.description)}</div>`
        : `<div class="card-desc none">No description yet.</div>`}
      <div class="card-foot">
        <span>${counts}</span>
        <span class="lastrun">${run}</span>
      </div>
      ${runsFactsHtml(e)}
      ${resultsStripHtml(e)}
    </a>`;
}

const newEvalFormHtml = () => `
  <form class="new-eval">
    <label for="new-name">Name</label>
    <input id="new-name" name="name" autocomplete="off" spellcheck="false"
           placeholder="my-eval">
    <label for="new-desc">Description</label>
    <textarea id="new-desc" name="description" rows="3"
              placeholder="What does this eval measure?"></textarea>
    <div class="form-err"></div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create eval</button>
      <button type="button" class="btn btn-quiet" data-cancel>Cancel</button>
    </div>
  </form>`;

function bindNewEvalForm(container, onCancel) {
  const form = container.querySelector("form.new-eval");
  const errSlot = form.querySelector(".form-err");
  form.querySelector("[data-cancel]").addEventListener("click", onCancel);
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const name = form.name.value.trim();
    const description = form.description.value.trim();
    if (!name) {
      errSlot.innerHTML = errorBox("Name is required.");
      form.name.focus();
      return;
    }
    const button = form.querySelector(".btn-primary");
    button.disabled = true;
    button.textContent = "Creating…";
    try {
      const made = await api("/api/evals", { body: { name, description } });
      state.evals = null; // the shelf changed
      location.hash = `#/eval/${enc(made.slug)}`;
    } catch (ex) {
      errSlot.innerHTML = errorBox(ex.message);
      button.disabled = false;
      button.textContent = "Create eval";
    }
  });
  form.name.focus();
}

const newCardButton = `
  <button type="button" class="card-new">
    <span><span class="plus">+</span>New eval</span>
  </button>`;

function bindNewCard() {
  const slot = document.getElementById("new-eval-slot");
  const openForm = () => {
    slot.innerHTML = `<div class="card">${newEvalFormHtml()}</div>`;
    bindNewEvalForm(slot, () => {
      slot.innerHTML = newCardButton;
      slot.querySelector("button").addEventListener("click", openForm);
    });
  };
  slot.querySelector("button").addEventListener("click", openForm);
}

const emptyShelfHtml = () => `
  <div class="card empty-shelf">
    <h2>An empty shelf</h2>
    <p>No evals here yet. An eval is just a directory: <code>eval.yaml</code>
       names it, <code>tasks/</code> holds the exercises, <code>configs/</code>
       say how a model attempts them, and <code>graders/</code> score what
       comes back. Runs land in <code>runs/</code> as plain files.</p>
    <div class="tree">my-eval/
├── <span class="k">eval.yaml</span>          <span class="c"># name + description</span>
├── <span class="k">run-llm</span>            <span class="c"># the runner configs point at</span>
├── tasks/<span class="k">example.yaml</span>
├── configs/<span class="k">default.yaml</span>
└── graders/<span class="k">default.yaml</span></div>
    <div class="empty-actions">
      <button type="button" class="btn btn-primary" id="empty-create">
        Create your first eval</button>
      <span class="empty-hint">or run <code>smevals docs</code> for the
        full tutorial</span>
    </div>
    <div id="empty-form-slot"></div>
  </div>`;

// Poll-tick refresh: patch each card's results strip + last-run dot in
// place rather than a full renderShelf() - a full grid rebuild every ~3s
// during a sweep visibly flickered the whole shelf. Falls back to a full
// render if the eval set itself changed (a card added/removed elsewhere).
async function refreshShelfInPlace() {
  const evals = await loadEvals(true);
  const cards = document.querySelectorAll(".shelf-grid > a.card");
  if (cards.length !== evals.length) return renderShelf();
  for (const e of evals) {
    const card = document.querySelector(`a.card[href="#/eval/${enc(e.slug)}"]`);
    if (!card) return renderShelf();
    const runs = card.querySelector(".card-runs");
    if (runs) runs.outerHTML = runsFactsHtml(e);
    const results = card.querySelector(".card-results");
    if (results) results.outerHTML = resultsStripHtml(e);
    const lastrun = card.querySelector(".lastrun");
    if (lastrun) lastrun.innerHTML = e.last_run_iso
      ? `<span class="dot${Date.now() - new Date(e.last_run_iso) < 86400000
          ? " fresh" : ""}"></span>${esc(ago(e.last_run_iso))}`
      : `<span class="dot never"></span>never run`;
  }
}

async function renderShelf() {
  let evals;
  try {
    evals = await loadEvals(true);
  } catch (ex) {
    view.innerHTML = errorBox("Couldn't load the shelf: " + ex.message);
    return;
  }
  if (!evals.length) {
    view.innerHTML = emptyShelfHtml();
    const button = document.getElementById("empty-create");
    button.addEventListener("click", () => {
      const slot = document.getElementById("empty-form-slot");
      slot.innerHTML = newEvalFormHtml();
      button.disabled = true;
      bindNewEvalForm(slot, () => {
        slot.innerHTML = "";
        button.disabled = false;
      });
    });
    return;
  }
  view.innerHTML =
    `<div class="shelf-grid">${evals.map(cardHtml).join("")}` +
    `<div id="new-eval-slot">${newCardButton}</div></div>`;
  bindNewCard();
}

// --- pure: YAML subset + derivations -------------------------------------
// Everything in this block is a pure function of its arguments: no DOM, no
// fetch, no state. The node verification harness extracts the block between
// the STUDIO_PURE markers and asserts round-trips against real PyYAML.
// The subset covers what smevals YAML actually uses (block maps/seqs,
// literal and folded block scalars, quotes, comments, simple flow lists);
// anything beyond it fails the parse honestly and the doc stays raw-only.
// STUDIO_PURE_BEGIN
const pure = (() => {
  const BUILTIN_CHECKERS = ["contains", "xml-valid"];

  const yerr = (message, line) => {
    const e = new Error(message);
    e.yaml = true;
    e.line = line;
    return e;
  };

  // Plain scalars mirror PyYAML's implicit resolvers exactly, including
  // the YAML 1.1 bool spellings. Any spelling the two sides could read
  // differently (octal-looking ints, base-60, underscore grouping,
  // inf/nan, dates) throws instead, sending the doc to raw-only with the
  // reason - refusing beats silently changing a value's meaning on save.
  // plainFloat marks float-spelled numbers so the env mirror can render
  // them the way Python's str() would ("1.0", not "1").
  let plainFloat = false;
  function parsePlain(s, line) {
    plainFloat = false;
    if (s === "" || s === "~" || /^(null|Null|NULL)$/.test(s)) return null;
    if (/^(true|True|TRUE|yes|Yes|YES|on|On|ON)$/.test(s)) return true;
    if (/^(false|False|FALSE|no|No|NO|off|Off|OFF)$/.test(s)) return false;
    if (/^[-+]?0[0-9_]+$/.test(s)) {
      throw yerr(`${JSON.stringify(s)} is octal in YAML 1.1 - quote it or drop the leading zero`, line);
    }
    if (/^[-+]?0b[01_]+$/.test(s)) {
      throw yerr("0b binary integers are not supported - quote it or use decimal", line);
    }
    if (s.includes("_")
        && /^[-+]?(0x[0-9a-fA-F_]+|[0-9][0-9_]*(\.[0-9_]*)?([eE][-+][0-9]+)?)$/.test(s)) {
      throw yerr("underscore-grouped numbers are not supported - quote it or drop the underscores", line);
    }
    if (/^[-+]?[0-9]+(:[0-5]?[0-9])+(\.[0-9]*)?$/.test(s)) {
      throw yerr(`${JSON.stringify(s)} is a base-60 number in YAML 1.1 - quote it`, line);
    }
    if (/^[-+]?\.(inf|Inf|INF)$/.test(s) || /^\.(nan|NaN|NAN)$/.test(s)) {
      throw yerr("inf/nan numbers are not supported - quote the value if it is a string", line);
    }
    if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s)
        || /^[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}([Tt]|[ \t]+)[0-9]{1,2}:[0-9]{2}:[0-9]{2}(\.[0-9]*)?([ \t]*(Z|[-+][0-9]{1,2}(:[0-9]{2})?))?$/.test(s)) {
      throw yerr(`${JSON.stringify(s)} reads as a date in YAML 1.1 - quote it`, line);
    }
    if (/^[-+]?(0|[1-9][0-9]*)$/.test(s)) return parseInt(s, 10);
    if (/^[-+]?0x[0-9a-fA-F]+$/.test(s)) return parseInt(s.replace("0x", ""), 16);
    if (/^[-+]?([0-9]+\.[0-9]*|\.[0-9]+)([eE][-+][0-9]+)?$/.test(s)) {
      plainFloat = true;
      return parseFloat(s);
    }
    return s;
  }

  const unescapeDouble = s => s.replace(/\\(.)/g, (all, c) =>
    ({ n: "\n", t: "\t", r: "\r", "0": "\0", '"': '"', "\\": "\\" }[c] ?? c));

  function parseScalarToken(raw, line) {
    plainFloat = false; // quoted/flow tokens never carry float spelling
    const s = raw.trim();
    let m = s.match(/^"((?:[^"\\]|\\.)*)"\s*(#.*)?$/);
    if (m) return unescapeDouble(m[1]);
    m = s.match(/^'((?:[^']|'')*)'\s*(#.*)?$/);
    if (m) return m[1].replace(/''/g, "'");
    if (s.startsWith('"') || s.startsWith("'")) {
      throw yerr("unterminated quoted scalar", line);
    }
    if (s === "{}") return {};
    if (s.startsWith("{")) throw yerr("flow mappings {…} are not supported", line);
    if (s.startsWith("[")) {
      m = s.match(/^\[(.*)\]\s*(#.*)?$/);
      if (!m) throw yerr("multi-line flow sequences are not supported", line);
      if (!m[1].trim()) return [];
      return m[1]
        .split(/,(?=(?:[^'"]|'[^']*'|"[^"]*")*$)/)
        .map(part => parseScalarToken(part.trim(), line));
    }
    if (/^[&*!]/.test(s) || s.startsWith("? ")) {
      throw yerr("anchors, aliases and tags are not supported", line);
    }
    const cut = s.search(/\s#/);
    const body = cut >= 0 ? s.slice(0, cut).trimEnd() : s;
    return parsePlain(body, line);
  }

  function matchKey(content, line) {
    let m = content.match(/^"((?:[^"\\]|\\.)*)"\s*:(?:[ \t]+(.*))?$/);
    if (m) return { key: unescapeDouble(m[1]), rest: m[2] ?? null };
    m = content.match(/^'((?:[^']|'')*)'\s*:(?:[ \t]+(.*))?$/);
    if (m) return { key: m[1].replace(/''/g, "'"), rest: m[2] ?? null };
    m = content.match(/^([^:#]+?)\s*:(?:[ \t]+(.*))?$/);
    if (m) {
      // Bare keys must read back as the same string under PyYAML's
      // resolvers; a key like `yes` or `012` would become True or 10
      let plain;
      try { plain = parsePlain(m[1], line); } catch (e) { plain = undefined; }
      if (plain !== m[1]) {
        throw yerr(`key ${JSON.stringify(m[1])} would not read as a string in YAML - quote it`, line);
      }
      return { key: m[1], rest: m[2] ?? null };
    }
    return null;
  }

  function yamlParse(text) {
    // Normalize CRLF/CR so block scalars never bake \r into values the
    // CLI would not see (PyYAML treats \r as a line break too)
    const rawLines = String(text ?? "").replace(/\r\n?/g, "\n").split("\n");
    const sig = [];
    const lineMap = {};
    const floats = {}; // keypaths of integral float-spelled scalars ("1.0")
    try {
      rawLines.forEach((raw, i) => {
        if (/^\s*$/.test(raw)) return;
        if (/^[ ]*\t/.test(raw)) throw yerr("tab indentation is not supported", i + 1);
        const indent = raw.match(/^ */)[0].length;
        const content = raw.slice(indent).replace(/\s+$/, "");
        if (content.startsWith("#")) return;
        if (content === "---" || content === "...") {
          if (sig.length) throw yerr("multi-document YAML is not supported", i + 1);
          return;
        }
        sig.push({ indent, content, line: i + 1 });
      });

      const isSeqItem = c => c === "-" || c.startsWith("- ");

      // Block scalars read raw lines (blanks and #-lines are content there),
      // so they return the next 1-based line to resume structure parsing at.
      function parseBlockScalar(afterLine, parentIndent, style, chomp) {
        const lines = [];
        let li = afterLine; // 0-based index into rawLines
        let blockIndent = -1;
        while (li < rawLines.length) {
          const raw = rawLines[li];
          if (/^\s*$/.test(raw)) {
            // Whitespace-only lines keep their content beyond the block
            // indent (PyYAML does; the harness holds us to it)
            lines.push(blockIndent > 0 && raw.length > blockIndent
              ? raw.slice(blockIndent) : "");
            li += 1;
            continue;
          }
          const ind = raw.match(/^ */)[0].length;
          if (ind <= parentIndent) break;
          if (blockIndent < 0) blockIndent = ind;
          if (ind < blockIndent) {
            throw yerr("bad indentation inside a block scalar", li + 1);
          }
          lines.push(raw.slice(blockIndent));
          li += 1;
        }
        // Keep chomp (|+ / >+) preserves trailing blank lines; clip and
        // strip drop them (and strip drops the final newline too)
        if (chomp !== "+") {
          while (lines.length && lines[lines.length - 1] === "") lines.pop();
        }
        let content = style === ">" ? foldLines(lines) : lines.join("\n");
        if (chomp !== "-" && content) content += "\n";
        return [content, li + 1];
      }

      function foldLines(lines) {
        let out = "";
        for (let i = 0; i < lines.length; i++) {
          const ln = lines[i];
          if (i === 0) { out = ln; continue; }
          const prev = lines[i - 1];
          if (ln === "") out += "\n";
          else if (ln.startsWith(" ") || prev.startsWith(" ")) out += "\n" + ln;
          else if (prev === "") out += ln;
          else out += " " + ln;
        }
        return out;
      }

      const blockHeader = rest => {
        const m = rest.match(/^([|>])([+-]?)\s*(#.*)?$/);
        if (m) return { style: m[1], chomp: m[2] };
        if (/^[|>]/.test(rest)) return "unsupported";
        return null;
      };

      // Returns [value, nextSigIndex]
      function parseValue(idx, parentIndent, keyPath, rest, line) {
        if (rest !== null && rest !== "") {
          const bh = blockHeader(rest);
          if (bh === "unsupported") {
            throw yerr("this block scalar header is not supported", line);
          }
          if (bh) {
            const [value, resumeLine] =
              parseBlockScalar(line, parentIndent, bh.style, bh.chomp);
            let next = idx + 1;
            while (next < sig.length && sig[next].line < resumeLine) next += 1;
            return [value, next];
          }
          const value = parseScalarToken(rest, line);
          if (typeof value === "number" && plainFloat && Number.isInteger(value)) {
            floats[keyPath.join(".")] = true;
          }
          return [value, idx + 1];
        }
        const nxt = sig[idx + 1];
        if (nxt && nxt.indent > parentIndent) return parseNode(idx + 1, keyPath);
        if (nxt && nxt.indent === parentIndent && isSeqItem(nxt.content)) {
          return parseSeq(idx + 1, parentIndent, keyPath);
        }
        return [null, idx + 1];
      }

      function parseMap(i, indent, path) {
        const obj = {};
        let idx = i;
        while (idx < sig.length && sig[idx].indent === indent
               && !isSeqItem(sig[idx].content)) {
          const L = sig[idx];
          const km = matchKey(L.content, L.line);
          if (!km) throw yerr(`expected "key: value", got ${JSON.stringify(L.content)}`, L.line);
          const kp = path.concat(km.key);
          lineMap[kp.join(".")] = L.line;
          const [value, next] = parseValue(idx, indent, kp, km.rest, L.line);
          obj[km.key] = value;
          idx = next;
        }
        if (idx < sig.length && sig[idx].indent > indent) {
          throw yerr("bad indentation", sig[idx].line);
        }
        return [obj, idx];
      }

      function parseSeq(i, indent, path) {
        const arr = [];
        let idx = i;
        while (idx < sig.length && sig[idx].indent === indent
               && isSeqItem(sig[idx].content)) {
          const L = sig[idx];
          const kp = path.concat(String(arr.length));
          lineMap[kp.join(".")] = L.line;
          if (L.content === "-") {
            const nxt = sig[idx + 1];
            if (nxt && nxt.indent > indent) {
              const [value, next] = parseNode(idx + 1, kp);
              arr.push(value);
              idx = next;
            } else { arr.push(null); idx += 1; }
            continue;
          }
          const rest = L.content.slice(2).trimStart();
          const keyCol = indent + (L.content.length - rest.length);
          if (isSeqItem(rest)) throw yerr("nested inline sequences are not supported", L.line);
          const km = matchKey(rest, L.line);
          if (km) {
            sig[idx] = { indent: keyCol, content: rest, line: L.line };
            const [value, next] = parseMap(idx, keyCol, kp);
            arr.push(value);
            idx = next;
          } else {
            const [value, next] = parseValue(idx, indent, kp, rest, L.line);
            arr.push(value);
            idx = next;
          }
        }
        return [arr, idx];
      }

      const parseNode = (i, path) =>
        isSeqItem(sig[i].content)
          ? parseSeq(i, sig[i].indent, path)
          : parseMap(i, sig[i].indent, path);

      if (!sig.length) return { ok: true, doc: {}, lineMap, floats };
      const [doc, next] = parseNode(0, []);
      if (next !== sig.length) throw yerr("bad indentation", sig[next].line);
      return { ok: true, doc, lineMap, floats };
    } catch (e) {
      if (e && e.yaml) return { ok: false, error: e.message, line: e.line ?? null };
      throw e;
    }
  }

  // --- emitter ------------------------------------------------------------

  const PLAIN_RE = /^[A-Za-z0-9_./][A-Za-z0-9_ ./,'()+?=-]*$/;
  function plainSafe(s) {
    if (!PLAIN_RE.test(s) || /\s$/.test(s)) return false;
    // Belt and braces: any spelling parsePlain resolves to a non-string
    // OR refuses (bools, numbers, octal/base-60/inf/nan/date lookalikes)
    // must be quoted so PyYAML reads back exactly this string
    try {
      return parsePlain(s) === s;
    } catch (e) {
      return false;
    }
  }
  const emitKey = k => plainSafe(String(k)) ? String(k) : JSON.stringify(String(k));

  function emitScalar(v) {
    if (v === null || v === undefined) return "null";
    if (typeof v === "boolean") return v ? "true" : "false";
    if (typeof v === "number") return Number.isFinite(v) ? String(v) : "null";
    const s = String(v);
    return plainSafe(s) ? s : JSON.stringify(s);
  }

  function blockable(s) {
    // Literal blocks preserve trailing whitespace, so only three shapes
    // force the double-quoted fallback: a first line that would confuse
    // indent detection, carriage returns, and 2+ trailing newlines
    if (s.match(/\n*$/)[0].length > 1) return false;
    const lines = s.replace(/\n$/, "").split("\n");
    return lines[0] !== "" && !lines[0].startsWith(" ") && !s.includes("\r");
  }

  function emitBlock(s, indent, prefix) {
    const pad = " ".repeat(indent);
    const header = s.endsWith("\n") ? "|" : "|-";
    const lines = s.replace(/\n$/, "").split("\n")
      .map(ln => (ln === "" ? "" : pad + "  " + ln));
    return prefix + " " + header + "\n" + lines.join("\n");
  }

  function emitEntry(key, v, indent) {
    const pad = " ".repeat(indent);
    const prefix = pad + emitKey(key) + ":";
    if (v === null || v === undefined) return prefix;
    if (Array.isArray(v)) {
      return v.length ? prefix + "\n" + emitSeq(v, indent + 2) : prefix + " []";
    }
    if (typeof v === "object") {
      return Object.keys(v).length
        ? prefix + "\n" + emitMap(v, indent + 2)
        : prefix + " {}";
    }
    if (typeof v === "string" && v.includes("\n") && blockable(v)) {
      return emitBlock(v, indent, prefix);
    }
    return prefix + " " + emitScalar(v);
  }

  const emitMap = (obj, indent) =>
    Object.entries(obj).map(([k, v]) => emitEntry(k, v, indent)).join("\n");

  function emitSeq(arr, indent) {
    const pad = " ".repeat(indent);
    return arr.map(v => {
      if (Array.isArray(v) && v.length) return pad + "-\n" + emitSeq(v, indent + 2);
      if (v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length) {
        const body = emitMap(v, indent + 2);
        return pad + "- " + body.slice(indent + 2);
      }
      if (typeof v === "string" && v.includes("\n") && blockable(v)) {
        return emitBlock(v, indent, pad + "-");
      }
      return pad + "- " + emitScalar(v);
    }).join("\n");
  }

  function yamlEmit(doc) {
    if (doc === null || doc === undefined) return "";
    if (typeof doc !== "object" || Array.isArray(doc)) {
      return emitScalar(doc) + "\n";
    }
    if (!Object.keys(doc).length) return "";
    return emitMap(doc, 0) + "\n";
  }

  // --- keypath edits ------------------------------------------------------

  const splitPath = p => (Array.isArray(p) ? p : String(p).split("."));

  function getAt(doc, path) {
    return splitPath(path).reduce(
      (node, seg) => (node == null ? undefined : node[seg]), doc);
  }

  function setAt(doc, path, value) {
    const segs = splitPath(path);
    let node = doc;
    for (const seg of segs.slice(0, -1)) {
      if (node[seg] === null || node[seg] === undefined) node[seg] = {};
      node = node[seg];
    }
    node[segs[segs.length - 1]] = value;
  }

  function delAt(doc, path) {
    const segs = splitPath(path);
    const parent = segs.length > 1 ? getAt(doc, segs.slice(0, -1)) : doc;
    if (parent == null) return;
    if (Array.isArray(parent)) parent.splice(Number(segs[segs.length - 1]), 1);
    else delete parent[segs[segs.length - 1]];
    // A map left empty by the deletion would linger as "key: {}" noise
    if (segs.length > 1 && !Array.isArray(parent)
        && parent && typeof parent === "object" && !Object.keys(parent).length) {
      delAt(doc, segs.slice(0, -1));
    }
  }

  // One text state in, one text state out: every form edit is an op applied
  // to the parsed doc and re-emitted, so form and raw always agree.
  function applyEdit(text, op) {
    const parsed = yamlParse(text);
    if (!parsed.ok) return { ok: false, error: parsed.error };
    let doc = parsed.doc;
    if (doc === null || typeof doc !== "object" || Array.isArray(doc)) doc = {};
    if (op.op === "set") setAt(doc, op.path, op.value);
    else if (op.op === "del") delAt(doc, op.path);
    else if (op.op === "insert") {
      let arr = getAt(doc, op.path);
      if (!Array.isArray(arr)) { arr = []; setAt(doc, op.path, arr); }
      arr.splice(op.at ?? arr.length, 0, op.value);
    } else if (op.op === "move") {
      const arr = getAt(doc, op.path);
      if (!Array.isArray(arr)) return { ok: false, error: "not a list" };
      const [item] = arr.splice(op.from, 1);
      arr.splice(op.to, 0, item);
    } else return { ok: false, error: `unknown op: ${op.op}` };
    return { ok: true, text: yamlEmit(doc) };
  }

  // --- derivations --------------------------------------------------------

  const isScalar = v =>
    typeof v === "string" || typeof v === "number" || typeof v === "boolean";
  // Python's str() of a YAML scalar, which is what the Runner's env gets
  const pyStr = v => (typeof v === "boolean" ? (v ? "True" : "False") : String(v));
  const slugifyModel = s =>
    String(s).replace(/[^a-zA-Z0-9._-]+/g, "-").replace(/^-+|-+$/g, "");

  // Env var name for a scalar mapping entry, mirroring cli.scalar_env_vars
  // exactly: runs of non-alnum characters collapse to one underscore, then
  // uppercase - e.g. ("SMEVALS_TASK_", "weird key!") -> "SMEVALS_TASK_WEIRD_KEY_".
  const scalarEnvKey = (prefix, k) =>
    prefix + String(k).replace(/[^A-Za-z0-9]+/g, "_").toUpperCase();

  // Every scalar entry of doc as {envVarName: str(value)}, exactly what
  // cli.scalar_env_vars would build for the same mapping: non-scalar values
  // (lists, maps) are silently skipped, never guessed at.
  function scalarEnvVars(prefix, doc, floats = {}) {
    const out = {};
    for (const [k, v] of Object.entries(doc || {})) {
      if (!isScalar(v)) continue;
      // Python's str() keeps float-ness ("1.0"); JS numbers do not, so
      // integral float-spelled scalars carry a parse-time flag
      out[scalarEnvKey(prefix, k)] =
        typeof v === "number" && floats[k] ? v.toFixed(1) : pyStr(v);
    }
    return out;
  }

  // The one env var name a single field's current value produces, or null
  // when the value isn't scalar - the Runner/checker never sees it as one.
  // What the task and check forms annotate each field with, live.
  function scalarEnvName(prefix, key, value) {
    return isScalar(value) ? scalarEnvKey(prefix, key) : null;
  }

  // What the task form's inline annotations can't show because it isn't a
  // task field: the model "Run this task" resolves to, and where the run
  // would land. opts: {config, model}.
  function envMirror(text, opts = {}) {
    const parsed = yamlParse(text);
