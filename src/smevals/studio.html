<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>smevals studio</title>
<style>
/* ---- design tokens -----------------------------------------------------
   Every Studio surface draws from these custom properties. One accent hue
   (iris); green/red are semantic and reserved for pass/fail; amber is the
   problems/warning voice. Both color schemes are first-class. */
:root {
  --bg: #f4f5f7;
  --bg-dot: #e3e5ec;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --text: #1a1d23;
  --text-2: #5b6472;
  --text-3: #8b93a1;
  --line: #e3e5eb;
  --line-strong: #c8cdd8;
  --accent: #4d55cc;
  --accent-contrast: #ffffff;
  --accent-soft: rgba(77, 85, 204, 0.09);
  --warn: #8a5a00;
  --warn-bg: #f7ecd2;
  --pass: #1a7f45;
  --fail: #c03d3d;
  --shadow: 0 1px 2px rgba(20, 22, 28, 0.04), 0 4px 14px rgba(20, 22, 28, 0.05);
  --shadow-lift: 0 2px 4px rgba(20, 22, 28, 0.06), 0 10px 28px rgba(20, 22, 28, 0.09);

  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 11.5px;
  --fs-sm: 13px;
  --fs-md: 14.5px;
  --fs-lg: 17px;
  --fs-xl: 22px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 36px;
  --sp-7: 56px;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b;
    --bg-dot: #1d2028;
    --surface: #1c1f26;
    --surface-2: #242833;
    --text: #e8eaef;
    --text-2: #a0a7b4;
    --text-3: #6d7480;
    --line: #2b2f3a;
    --line-strong: #3c4150;
    --accent: #9aa3ff;
    --accent-contrast: #14161b;
    --accent-soft: rgba(154, 163, 255, 0.12);
    --warn: #e2b45c;
    --warn-bg: rgba(226, 180, 92, 0.14);
    --pass: #4cc47e;
    --fail: #ef6d6d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 14px rgba(0, 0, 0, 0.22);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.32);
  }
}

/* ---- base --------------------------------------------------------------- */
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--text);
  background-color: var(--bg);
  /* a whisper of graph paper: evals are measurement */
  background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
  background-size: 26px 26px;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--surface-2);
  padding: 1px 6px;
  border-radius: var(--r-sm);
}

/* ---- shell -------------------------------------------------------------- */
header, main {
  max-width: 1120px;
  margin: 0 auto;
  padding-inline: var(--sp-5);
}
header {
  display: flex;
  align-items: baseline;
  gap: var(--sp-3);
  padding-block: var(--sp-6) var(--sp-5);
}
.wordmark {
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--text);
}
.wordmark:hover { text-decoration: none; }
.wordmark .studio {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.88em;
  color: var(--accent);
  margin-left: 2px;
}
#header-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
}
main { padding-bottom: var(--sp-7); }

/* ---- cards & shelf ------------------------------------------------------ */
.shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
a.card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  color: inherit;
}
a.card:hover { text-decoration: none; }
@media (prefers-reduced-motion: no-preference) {
  a.card { transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }
  .shelf-grid > * { animation: rise 0.3s ease backwards; }
  .shelf-grid > :nth-child(2) { animation-delay: 0.04s; }
  .shelf-grid > :nth-child(3) { animation-delay: 0.08s; }
  .shelf-grid > :nth-child(4) { animation-delay: 0.12s; }
  .shelf-grid > :nth-child(5) { animation-delay: 0.16s; }
  .shelf-grid > :nth-child(6) { animation-delay: 0.2s; }
  .shelf-grid > :nth-child(7) { animation-delay: 0.24s; }
  .shelf-grid > :nth-child(n + 8) { animation-delay: 0.28s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
  }
}
a.card:hover, a.card:focus-visible {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  box-shadow: var(--shadow-lift);
}
.card-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
}
.card-name {
  font-size: var(--fs-lg);
  font-weight: 600;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.card-desc {
  font-size: var(--fs-sm);
  line-height: 1.55;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-desc.none { color: var(--text-3); font-style: italic; }
.card-foot {
  margin-top: auto;
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  white-space: nowrap;
}
.card-foot b { font-weight: 600; color: var(--text-2); }
.lastrun { display: inline-flex; align-items: center; gap: 6px; }
.lastrun .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line-strong);
}
.lastrun .dot.fresh { background: var(--accent); }
.lastrun .dot.never { background: transparent; border: 1px solid var(--line-strong); }
.badge-warn {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--warn);
  background: var(--warn-bg);
  border-radius: 999px;
  padding: 2px 9px;
  margin-left: auto;
  white-space: nowrap;
}

/* ---- new-eval card ------------------------------------------------------ */
.card-new {
  display: grid;
  place-items: center;
  min-height: 176px;
  height: 100%;
  padding: var(--sp-5);
  width: 100%;
  font: inherit;
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--text-3);
  background: color-mix(in srgb, var(--surface) 45%, transparent);
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--r-lg);
  cursor: pointer;
}
@media (prefers-reduced-motion: no-preference) {
  .card-new { transition: border-color 0.15s ease, color 0.15s ease; }
}
.card-new:hover, .card-new:focus-visible { border-color: var(--accent); color: var(--accent); }
.card-new .plus { font-size: var(--fs-xl); display: block; text-align: center; line-height: 1.2; }

/* ---- forms -------------------------------------------------------------- */
form.new-eval {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-5) var(--sp-5);
}
form.new-eval label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: var(--sp-2);
}
input, textarea {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: 7px 10px;
}
textarea { resize: vertical; }
input:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-actions { display: flex; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }
.btn {
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--r-sm);
  padding: 8px 14px;
  cursor: pointer;
}
.btn-primary { background: var(--accent); color: var(--accent-contrast); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { opacity: 0.6; cursor: default; filter: none; }
.btn-quiet { background: transparent; color: var(--text-2); font-weight: 500; }
.btn-quiet:hover { color: var(--text); }

/* ---- inline errors (the one error-rendering voice) ---------------------- */
.error {
  font-size: var(--fs-sm);
  color: var(--fail);
  background: color-mix(in srgb, var(--fail) 9%, transparent);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3);
}

/* ---- teaching empty state ----------------------------------------------- */
.empty-shelf {
  max-width: 640px;
  margin: var(--sp-6) auto 0;
  padding: var(--sp-6) var(--sp-6) var(--sp-5);
}
.empty-shelf h2 {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-xl);
  font-weight: 650;
  letter-spacing: -0.02em;
}
.empty-shelf p { margin: 0 0 var(--sp-4); color: var(--text-2); }
.tree {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.8;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: var(--sp-4) var(--sp-5);
  margin: 0 0 var(--sp-4);
  overflow-x: auto;
  white-space: pre;
}
.tree .c { color: var(--text-3); }
.tree .k { color: var(--accent); }
.empty-actions { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.empty-hint { font-size: var(--fs-sm); color: var(--text-3); }
.empty-shelf form.new-eval { padding: var(--sp-4) 0 0; }

/* ---- workbench placeholder ---------------------------------------------- */
.crumb {
  font-size: var(--fs-sm);
  margin-bottom: var(--sp-4);
}
.panel { padding: var(--sp-6); }
.panel h2 {
  margin: 0;
  font-size: var(--fs-xl);
  font-weight: 650;
  letter-spacing: -0.02em;
}
.panel .slug {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  margin-top: var(--sp-1);
}
.panel .desc { color: var(--text-2); margin: var(--sp-3) 0 0; max-width: 62ch; }
.placeholder-note {
  margin-top: var(--sp-5);
  padding: var(--sp-4) var(--sp-5);
  background: var(--accent-soft);
  border-radius: var(--r-md);
  color: var(--text-2);
  font-size: var(--fs-sm);
  max-width: 62ch;
}
.problems { margin-top: var(--sp-5); }
.problems h3 {
  margin: 0 0 var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--warn);
}
.problem {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  padding: var(--sp-1) 0;
  color: var(--text-2);
}
.problem b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <a class="wordmark" href="#/">smevals<span class="studio">studio</span></a>
  <span id="header-meta"></span>
</header>
<main id="view"></main>
<script>
"use strict";

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const enc = encodeURIComponent;
const view = document.getElementById("view");
const state = { evals: null };

// --- fetch layer ---------------------------------------------------------

async function api(path, options = {}) {
  const init = options.body === undefined ? options : {
    method: options.method || "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(options.body),
  };
  const response = await fetch(path, init);
  let data = null;
  try { data = await response.json(); } catch { /* non-JSON reply */ }
  if (!response.ok) {
    throw new Error(data?.error || `${path}: HTTP ${response.status}`);
  }
  return data;
}

// The one error-rendering voice: every failure lands inline, never alert()
const errorBox = message => `<div class="error" role="alert">${esc(message)}</div>`;

async function loadEvals(force = false) {
  if (state.evals === null || force) {
    state.evals = await api("/api/evals");
    document.getElementById("header-meta").textContent =
      state.evals.length ? plural(state.evals.length, "eval") : "";
  }
  return state.evals;
}

// --- helpers -------------------------------------------------------------

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 45) return Math.floor(s / 86400) + "d ago";
  return new Date(iso).toISOString().slice(0, 10);
}

// --- shelf ---------------------------------------------------------------

function cardHtml(e) {
  const counts = ["tasks", "configs", "graders"]
    .map(k => {
      const n = e.counts?.[k] ?? 0;
      return `<b>${n}</b> ${k.slice(0, -1)}${n === 1 ? "" : "s"}`;
    })
    .join(" · ");
  const run = e.last_run_iso
    ? `<span class="dot${Date.now() - new Date(e.last_run_iso) < 86400000
        ? " fresh" : ""}"></span>${esc(ago(e.last_run_iso))}`
    : `<span class="dot never"></span>never run`;
  const badge = e.problems
    ? `<span class="badge-warn" title="${esc(plural(e.problems, "problem") +
        " to review — open the workbench to see and fix them")}">${
        esc(plural(e.problems, "problem"))}</span>`
    : "";
  return `
    <a class="card" href="#/eval/${enc(e.slug)}">
      <div class="card-head">
        <span class="card-name">${esc(e.name)}</span>${badge}
      </div>
      ${e.description
        ? `<div class="card-desc">${esc(e.description)}</div>`
        : `<div class="card-desc none">No description yet.</div>`}
      <div class="card-foot">
        <span>${counts}</span>
        <span class="lastrun">${run}</span>
      </div>
    </a>`;
}

const newEvalFormHtml = () => `
  <form class="new-eval">
    <label for="new-name">Name</label>
    <input id="new-name" name="name" autocomplete="off" spellcheck="false"
           placeholder="my-eval">
    <label for="new-desc">Description</label>
    <textarea id="new-desc" name="description" rows="3"
              placeholder="What does this eval measure?"></textarea>
    <div class="form-err"></div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create eval</button>
      <button type="button" class="btn btn-quiet" data-cancel>Cancel</button>
    </div>
  </form>`;

function bindNewEvalForm(container, onCancel) {
  const form = container.querySelector("form.new-eval");
  const errSlot = form.querySelector(".form-err");
  form.querySelector("[data-cancel]").addEventListener("click", onCancel);
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const name = form.name.value.trim();
    const description = form.description.value.trim();
    if (!name) {
      errSlot.innerHTML = errorBox("Name is required.");
      form.name.focus();
      return;
    }
    const button = form.querySelector(".btn-primary");
    button.disabled = true;
    button.textContent = "Creating…";
    try {
      const made = await api("/api/evals", { body: { name, description } });
      state.evals = null; // the shelf changed
      location.hash = `#/eval/${enc(made.slug)}`;
    } catch (ex) {
      errSlot.innerHTML = errorBox(ex.message);
      button.disabled = false;
      button.textContent = "Create eval";
    }
  });
  form.name.focus();
}

const newCardButton = `
  <button type="button" class="card-new">
    <span><span class="plus">+</span>New eval</span>
  </button>`;

function bindNewCard() {
  const slot = document.getElementById("new-eval-slot");
  const openForm = () => {
    slot.innerHTML = `<div class="card">${newEvalFormHtml()}</div>`;
    bindNewEvalForm(slot, () => {
      slot.innerHTML = newCardButton;
      slot.querySelector("button").addEventListener("click", openForm);
    });
  };
  slot.querySelector("button").addEventListener("click", openForm);
}

const emptyShelfHtml = () => `
  <div class="card empty-shelf">
    <h2>An empty shelf</h2>
    <p>No evals here yet. An eval is just a directory: <code>eval.yaml</code>
       names it, <code>tasks/</code> holds the exercises, <code>configs/</code>
       say how a model attempts them, and <code>graders/</code> score what
       comes back. Runs land in <code>runs/</code> as plain files.</p>
    <div class="tree">my-eval/
├── <span class="k">eval.yaml</span>          <span class="c"># name + description</span>
├── <span class="k">run-llm</span>            <span class="c"># the runner configs point at</span>
├── tasks/<span class="k">example.yaml</span>
├── configs/<span class="k">default.yaml</span>
└── graders/<span class="k">default.yaml</span></div>
    <div class="empty-actions">
      <button type="button" class="btn btn-primary" id="empty-create">
        Create your first eval</button>
      <span class="empty-hint">or run <code>smevals docs</code> for the
        full tutorial</span>
    </div>
    <div id="empty-form-slot"></div>
  </div>`;

async function renderShelf() {
  let evals;
  try {
    evals = await loadEvals(true);
  } catch (ex) {
    view.innerHTML = errorBox("Couldn't load the shelf: " + ex.message);
    return;
  }
  if (!evals.length) {
    view.innerHTML = emptyShelfHtml();
    const button = document.getElementById("empty-create");
    button.addEventListener("click", () => {
      const slot = document.getElementById("empty-form-slot");
      slot.innerHTML = newEvalFormHtml();
      button.disabled = true;
      bindNewEvalForm(slot, () => {
        slot.innerHTML = "";
        button.disabled = false;
      });
    });
    return;
  }
  view.innerHTML =
    `<div class="shelf-grid">${evals.map(cardHtml).join("")}` +
    `<div id="new-eval-slot">${newCardButton}</div></div>`;
  bindNewCard();
}

// --- workbench (placeholder until the editor lands) ----------------------

async function renderWorkbench(slug) {
  const crumb = `<div class="crumb"><a href="#/">← shelf</a></div>`;
  view.innerHTML = crumb;
  let evals, detail;
  try {
    [evals, detail] = await Promise.all([
      loadEvals(),
      api(`/api/evals/${enc(slug)}`),
    ]);
  } catch (ex) {
    view.innerHTML = crumb + errorBox(ex.message);
    return;
  }
  const info = evals.find(e => e.slug === slug) || {};
  const problems = detail.validation || [];
  view.innerHTML = `
    ${crumb}
    <div class="card panel">
      <h2>${esc(info.name || slug)}</h2>
      ${info.name && info.name !== slug
        ? `<div class="slug">${esc(slug)}</div>` : ""}
      ${info.description ? `<p class="desc">${esc(info.description)}</p>` : ""}
      ${problems.length ? `
        <div class="problems">
          <h3>${esc(plural(problems.length, "problem"))} to fix</h3>
          ${problems.map(p => `
            <div class="problem"><b>${esc(p.file)}</b> — ${esc(p.problem)}</div>
          `).join("")}
        </div>` : ""}
      <div class="placeholder-note">
        The workbench isn't built yet. File editing, live validation, and
        the try-it bench land in the next build steps — everything on the
        shelf is already real, and this page will grow into the editor.
      </div>
    </div>`;
}

// --- router --------------------------------------------------------------

function route() {
  const hash = location.hash || "#/";
  const eval_ = hash.match(/^#\/eval\/([^/?]+)/);
  if (eval_) return renderWorkbench(decodeURIComponent(eval_[1]));
  return renderShelf();
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
