<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    background: #101014; color: #f2f2f5;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  .card { text-align: center; max-width: 70%; }
  h1 {
    margin: 0 0 0.4em;
    font-size: 88px; font-weight: 650; letter-spacing: -0.02em;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  p {
    margin: 0;
    font-size: 30px; font-weight: 400; color: #9a9aa6;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
</body>
</html>
